name: Automated Site QA

# Node 22 repush checkpoint — keep CI runtime aligned with functions/package.json.
# Full-suite QA rerun checkpoint: revalidate every phase before the next phase is started.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

# One QA run at a time per branch: a second run (e.g. a duplicate push
# event) waits instead of racing the first one to publish the bug snapshot.
concurrency:
  group: automated-qa-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # No cache: repo root has no package-lock.json.

      - name: Verify Node runtime
        run: |
          node --version
          npm --version
          node -e "if (process.versions.node.split('.')[0] !== '22') process.exit(1); console.log('Node 22 runtime confirmed:', process.version)"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Check authenticated QA configuration
        env:
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          QA_ROLE: ${{ secrets.QA_ROLE }}
        run: |
          if [ -n "$QA_EMAIL" ] && [ -n "$QA_PASSWORD" ] && [ "${QA_ROLE,,}" = "servicecenter" ]; then
            echo "Authenticated CRM QA configuration: READY"
            echo "### Authenticated CRM QA" >> "$GITHUB_STEP_SUMMARY"
            echo "- Status: **READY**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Role: **servicecenter**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Authenticated CRM QA configuration: NOT CONFIGURED"
            echo "Phase 3, Phase 4 and authenticated Phase 5 browser checks will be skipped until QA_EMAIL, QA_PASSWORD and QA_ROLE=servicecenter are configured as GitHub Actions secrets."
            echo "### Authenticated CRM QA" >> "$GITHUB_STEP_SUMMARY"
            echo "- Status: **NOT CONFIGURED**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Phase 3, Phase 4 and authenticated Phase 5 browser checks will be skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "- Required GitHub Actions secrets: QA_EMAIL, QA_PASSWORD, QA_ROLE=servicecenter" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run backend lifecycle unit QA
        id: backend_qa
        continue-on-error: true
        run: |
          mkdir -p qa-results/json
          cd functions
          npm install
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=../scripts/qa/node-json-reporter.mjs --test-reporter-destination=../qa-results/json/backend_qa.json

      - name: Run frontend unit QA
        id: frontend_qa
        continue-on-error: true
        # crm/*.js screens against an in-memory Firestore, plus static
        # checks on every page (scripts parse, Firebase/module imports exist).
        run: npm run test:unit:ci

      # Rules, role and workflow tests need the Firebase emulators (Java).
      - name: Set up Java for the Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install emulator QA tools
        run: |
          npm install -g firebase-tools@14
          npm --prefix tests/emulator install
          npm --prefix functions install

      - name: Run Firestore & Storage rules and role QA
        id: rules_qa
        continue-on-error: true
        run: firebase emulators:exec --project demo-pushpak --only firestore,storage "npm --prefix tests/emulator run test:rules"

      - name: Run workflow QA (rules + Cloud Functions in the emulator)
        id: workflow_qa
        continue-on-error: true
        run: firebase emulators:exec --project demo-pushpak --only auth,firestore,functions "npm --prefix tests/emulator run test:workflows"

      - name: Report emulator QA failures
        if: always()
        run: |
          cat tests/emulator/results/*.txt 2>/dev/null || true
          mkdir -p qa-results/json
          cp tests/emulator/results/rules.json qa-results/json/rules_qa.json 2>/dev/null || true
          cp tests/emulator/results/workflows.json qa-results/json/workflow_qa.json 2>/dev/null || true

      - name: Run public-site QA
        id: public_qa
        continue-on-error: true
        env:
          BASE_URL: https://tarun1203.github.io/Pushpak-enterprises-website-and-CRM/
          QA_MAX_PAGES: 150
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=qa-results/json/public_qa.json npx playwright test tests/e2e/site-smoke.spec.js tests/e2e/site-crawler.spec.js --reporter=list,json

      - name: Run CRM Phase 2 QA
        id: crm_qa
        continue-on-error: true
        env:
          BASE_URL: https://tarun1203.github.io/Pushpak-enterprises-website-and-CRM/
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          QA_ROLE: ${{ secrets.QA_ROLE }}
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=qa-results/json/crm_qa.json npx playwright test tests/e2e/crm-auth.spec.js tests/e2e/crm-phase2-contract.spec.js --reporter=list,json

      - name: Run CRM Phase 3 service workflow QA
        id: phase3_qa
        continue-on-error: true
        env:
          BASE_URL: https://tarun1203.github.io/Pushpak-enterprises-website-and-CRM/
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          QA_ROLE: ${{ secrets.QA_ROLE }}
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=qa-results/json/phase3_qa.json npx playwright test tests/e2e/crm-phase3-service-workflow.spec.js --reporter=list,json

      - name: Run CRM Phase 4 full lifecycle QA
        id: phase4_qa
        continue-on-error: true
        env:
          BASE_URL: https://tarun1203.github.io/Pushpak-enterprises-website-and-CRM/
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          QA_ROLE: ${{ secrets.QA_ROLE }}
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=qa-results/json/phase4_qa.json npx playwright test tests/e2e/crm-phase4-lifecycle-contract.spec.js --reporter=list,json

      - name: Run CRM Phase 5 security and data-integrity QA
        id: phase5_qa
        continue-on-error: true
        env:
          BASE_URL: https://tarun1203.github.io/Pushpak-enterprises-website-and-CRM/
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          QA_ROLE: ${{ secrets.QA_ROLE }}
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=qa-results/json/phase5_qa.json npx playwright test tests/e2e/crm-phase5-security-contract.spec.js --reporter=list,json

      - name: Run Phase 6 production readiness QA
        id: phase6_qa
        continue-on-error: true
        env:
          BASE_URL: https://tarun1203.github.io/Pushpak-enterprises-website-and-CRM/
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=qa-results/json/phase6_qa.json npx playwright test tests/e2e/phase6-production-readiness.spec.js --reporter=list,json

      - name: Run Phase 7 customer lifecycle QA
        id: phase7_qa
        continue-on-error: true
        env:
          BASE_URL: https://tarun1203.github.io/Pushpak-enterprises-website-and-CRM/
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=qa-results/json/phase7_qa.json npx playwright test tests/e2e/phase7-customer-lifecycle-contract.spec.js --reporter=list,json

      - name: Run Phase 8 inventory and logistics QA
        id: phase8_qa
        continue-on-error: true
        env:
          BASE_URL: https://tarun1203.github.io/Pushpak-enterprises-website-and-CRM/
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=qa-results/json/phase8_qa.json npx playwright test tests/e2e/phase8-inventory-logistics-contract.spec.js --reporter=list,json

      - name: Run mobile QA (phones, this commit's files)
        id: mobile_qa
        continue-on-error: true
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=qa-results/json/mobile_qa.json npx playwright test tests/e2e/mobile.spec.js --reporter=list,json

      - name: Run responsive QA (320px-1920px, every CRM section; screenshots in the QA report)
        id: responsive_qa
        continue-on-error: true
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=qa-results/json/responsive_qa.json npx playwright test tests/e2e/responsive.spec.js --reporter=list,json

      - name: Run outside-link QA (Firebase SDK, fonts, external links)
        id: links_qa
        continue-on-error: true
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=qa-results/json/links_qa.json npx playwright test tests/e2e/external-links.spec.js --reporter=list,json

      - name: Run browser security QA (stored-XSS sweep of every CRM screen)
        id: security_qa
        continue-on-error: true
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=qa-results/json/security_qa.json npx playwright test tests/e2e/security.spec.js --reporter=list,json

      - name: Check Cloud Functions dependencies for known vulnerabilities
        id: audit_qa
        continue-on-error: true
        run: npm --prefix functions audit --omit=dev --audit-level=high

      - name: Run Phase 9-10 Customer 360 & role QA (one customer, every record, safe display)
        id: phase9_qa
        continue-on-error: true
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=qa-results/json/phase9_qa.json npx playwright test tests/e2e/customer360.spec.js tests/e2e/phase10-roles.spec.js tests/e2e/phase10-field.spec.js tests/e2e/ui-customer.spec.js tests/e2e/ui-crm.spec.js tests/e2e/ui-live.spec.js tests/e2e/ui-rows.spec.js --reporter=list,json

      - name: Run auto-fit QA (phones, tablets, laptops, monitors and TVs; every page)
        id: fit_qa
        continue-on-error: true
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=qa-results/json/fit_qa.json npx playwright test tests/e2e/fit.spec.js --reporter=list,json

      - name: Run performance QA (page weight, slow-4G speed, CRM render time and data use)
        id: perf_qa
        continue-on-error: true
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=qa-results/json/perf_qa.json npx playwright test tests/e2e/performance.spec.js --reporter=list,json

      - name: Run browser compatibility QA (Chrome, Firefox, Safari engine, Android, iPhone, iPad)
        id: browsers_qa
        continue-on-error: true
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=qa-results/json/browsers_qa.json npx playwright test tests/e2e/browsers.spec.js --reporter=list,json

      # One pass/fail verdict over every suite above, compared with
      # tests/regression-baseline.json (fails if any test failed, a suite
      # produced no results, or a suite has fewer tests than before).
      - name: Regression gate (all suites)
        id: regression_qa
        if: always()
        continue-on-error: true
        run: node scripts/qa/regression-summary.mjs

      - name: Go-live gate (GO / GO WITH KNOWN ISSUES / NO-GO)
        id: go_live_gate
        if: always()
        continue-on-error: true
        env:
          GATE_OUTCOMES: '{"public_qa":"${{ steps.public_qa.outcome }}","backend_qa":"${{ steps.backend_qa.outcome }}","frontend_qa":"${{ steps.frontend_qa.outcome }}","rules_qa":"${{ steps.rules_qa.outcome }}","workflow_qa":"${{ steps.workflow_qa.outcome }}","mobile_qa":"${{ steps.mobile_qa.outcome }}","responsive_qa":"${{ steps.responsive_qa.outcome }}","links_qa":"${{ steps.links_qa.outcome }}","security_qa":"${{ steps.security_qa.outcome }}","audit_qa":"${{ steps.audit_qa.outcome }}","perf_qa":"${{ steps.perf_qa.outcome }}","fit_qa":"${{ steps.fit_qa.outcome }}","phase9_qa":"${{ steps.phase9_qa.outcome }}","browsers_qa":"${{ steps.browsers_qa.outcome }}","crm_qa":"${{ steps.crm_qa.outcome }}","phase3_qa":"${{ steps.phase3_qa.outcome }}","phase4_qa":"${{ steps.phase4_qa.outcome }}","phase5_qa":"${{ steps.phase5_qa.outcome }}","phase6_qa":"${{ steps.phase6_qa.outcome }}","phase7_qa":"${{ steps.phase7_qa.outcome }}","phase8_qa":"${{ steps.phase8_qa.outcome }}"}'
        run: node scripts/qa/go-live-gate.mjs

      - name: Publish QA phase summary
        if: always()
        run: |
          {
            echo "### Automated QA phase summary"
            echo "| Phase | Result |"
            echo "|---|---|"
            echo "| Backend lifecycle | **${{ steps.backend_qa.outcome }}** |"
            echo "| Frontend unit | **${{ steps.frontend_qa.outcome }}** |"
            echo "| Firestore/Storage rules & roles | **${{ steps.rules_qa.outcome }}** |"
            echo "| Workflows (emulator) | **${{ steps.workflow_qa.outcome }}** |"
            echo "| Mobile | **${{ steps.mobile_qa.outcome }}** |"
            echo "| Responsive | **${{ steps.responsive_qa.outcome }}** |"
            echo "| Outside links (local links: Frontend unit) | **${{ steps.links_qa.outcome }}** |"
            echo "| Security: XSS sweep | **${{ steps.security_qa.outcome }}** |"
            echo "| Security: dependency audit | **${{ steps.audit_qa.outcome }}** |"
            echo "| Performance | **${{ steps.perf_qa.outcome }}** |"
            echo "| Public site | **${{ steps.public_qa.outcome }}** |"
            echo "| CRM Phase 2 | **${{ steps.crm_qa.outcome }}** |"
            echo "| CRM Phase 3 | **${{ steps.phase3_qa.outcome }}** |"
            echo "| CRM Phase 4 | **${{ steps.phase4_qa.outcome }}** |"
            echo "| CRM Phase 5 | **${{ steps.phase5_qa.outcome }}** |"
            echo "| Phase 6 production readiness | **${{ steps.phase6_qa.outcome }}** |"
            echo "| Phase 7 customer lifecycle | **${{ steps.phase7_qa.outcome }}** |"
            echo "| Phase 8 inventory & logistics | **${{ steps.phase8_qa.outcome }}** |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload QA report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pushpak-qa-report
          path: qa-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Create or update QA bug
        if: steps.public_qa.outcome == 'failure' || steps.backend_qa.outcome == 'failure' || steps.frontend_qa.outcome == 'failure' || steps.rules_qa.outcome == 'failure' || steps.workflow_qa.outcome == 'failure' || steps.mobile_qa.outcome == 'failure' || steps.responsive_qa.outcome == 'failure' || steps.links_qa.outcome == 'failure' || steps.security_qa.outcome == 'failure' || steps.audit_qa.outcome == 'failure' || steps.perf_qa.outcome == 'failure' || steps.fit_qa.outcome == 'failure' || steps.phase9_qa.outcome == 'failure' || steps.regression_qa.outcome == 'failure' || steps.crm_qa.outcome == 'failure' || steps.phase3_qa.outcome == 'failure' || steps.phase4_qa.outcome == 'failure' || steps.phase5_qa.outcome == 'failure' || steps.phase6_qa.outcome == 'failure' || steps.phase7_qa.outcome == 'failure' || steps.phase8_qa.outcome == 'failure' || steps.browsers_qa.outcome == 'failure' || steps.go_live_gate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_TITLE="Automated QA: Site/CRM Test Failures"
          ISSUE_NUMBER=$(gh issue list --state open --search "Automated QA: Site/CRM Test Failures in:title" --json number --jq '.[0].number')
          BODY="## Automated QA failure\n\nThe CI tests detected one or more failures.\n\n- Backend lifecycle QA: ${{ steps.backend_qa.outcome }}\n- Frontend unit QA: ${{ steps.frontend_qa.outcome }}\n- Rules & role QA: ${{ steps.rules_qa.outcome }}\n- Workflow QA: ${{ steps.workflow_qa.outcome }}\n- Mobile QA: ${{ steps.mobile_qa.outcome }}\n- Responsive QA: ${{ steps.responsive_qa.outcome }}\n- Outside-link QA: ${{ steps.links_qa.outcome }}\n- Security XSS QA: ${{ steps.security_qa.outcome }}\n- Dependency audit: ${{ steps.audit_qa.outcome }}\n- Performance QA: ${{ steps.perf_qa.outcome }}\n- Auto-fit QA: ${{ steps.fit_qa.outcome }}\n- Phase 9-10 Customer 360 & role QA: ${{ steps.phase9_qa.outcome }}\n- Regression gate: ${{ steps.regression_qa.outcome }} (see qa-results/regression.md)\n- Public QA: ${{ steps.public_qa.outcome }}\n- CRM Phase 2 QA: ${{ steps.crm_qa.outcome }}\n- CRM Phase 3 QA: ${{ steps.phase3_qa.outcome }}\n- CRM Phase 4 QA: ${{ steps.phase4_qa.outcome }}\n- CRM Phase 5 security QA: ${{ steps.phase5_qa.outcome }}\n- Phase 6 production readiness QA: ${{ steps.phase6_qa.outcome }}\n- Phase 7 customer lifecycle QA: ${{ steps.phase7_qa.outcome }}\n- Phase 8 inventory & logistics QA: ${{ steps.phase8_qa.outcome }}\n- Browser compatibility QA: ${{ steps.browsers_qa.outcome }}\n- Go-live gate: ${{ steps.go_live_gate.outcome }}\n- Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n- Commit: $GITHUB_SHA\n- Base URL: https://tarun1203.github.io/Pushpak-enterprises-website-and-CRM/\n- Generated: $(date -u '+%Y-%m-%d %H:%M UTC')\n\nSee the **pushpak-qa-report** artifact for the Playwright report, traces, screenshots and videos."
          if [ -z "$ISSUE_NUMBER" ]; then
            gh issue create --title "$ISSUE_TITLE" --body "$BODY"
          else
            gh issue comment "$ISSUE_NUMBER" --body "$BODY"
          fi

      - name: Publish bug snapshot for Bug Tracker
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" --paginate | \
            jq -s --arg generated "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            '{generated_at:$generated, source:"GitHub Issues", issues:(add | map(select(.pull_request == null)))}' > crm/bug-data.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f crm/bug-data.json
          if git diff --cached --quiet; then
            echo "Bug snapshot unchanged"
          else
            git commit -m "[skip ci] Update automated QA bug snapshot"
            git push
          fi

      - name: Fail workflow when QA fails
        if: steps.public_qa.outcome == 'failure' || steps.backend_qa.outcome == 'failure' || steps.frontend_qa.outcome == 'failure' || steps.rules_qa.outcome == 'failure' || steps.workflow_qa.outcome == 'failure' || steps.mobile_qa.outcome == 'failure' || steps.responsive_qa.outcome == 'failure' || steps.links_qa.outcome == 'failure' || steps.security_qa.outcome == 'failure' || steps.audit_qa.outcome == 'failure' || steps.perf_qa.outcome == 'failure' || steps.fit_qa.outcome == 'failure' || steps.phase9_qa.outcome == 'failure' || steps.regression_qa.outcome == 'failure' || steps.crm_qa.outcome == 'failure' || steps.phase3_qa.outcome == 'failure' || steps.phase4_qa.outcome == 'failure' || steps.phase5_qa.outcome == 'failure' || steps.phase6_qa.outcome == 'failure' || steps.phase7_qa.outcome == 'failure' || steps.phase8_qa.outcome == 'failure' || steps.browsers_qa.outcome == 'failure' || steps.go_live_gate.outcome == 'failure'
        run: exit 1
