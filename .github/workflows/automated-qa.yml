name: Automated Site QA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run public-site QA
        id: public_qa
        continue-on-error: true
        env:
          BASE_URL: https://tarun1203.github.io/Pushpak-enterprises-website-and-CRM/
          QA_MAX_PAGES: 150
        run: npx playwright test tests/e2e/site-smoke.spec.js tests/e2e/site-crawler.spec.js

      - name: Run CRM Phase 2 QA
        id: crm_qa
        continue-on-error: true
        env:
          BASE_URL: https://tarun1203.github.io/Pushpak-enterprises-website-and-CRM/
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          QA_ROLE: ${{ secrets.QA_ROLE }}
        run: npx playwright test tests/e2e/crm-auth.spec.js

      - name: Upload QA report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pushpak-qa-report
          path: qa-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Create or update QA bug
        if: steps.public_qa.outcome == 'failure' || steps.crm_qa.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_TITLE="Automated QA: Site/CRM Test Failures"
          ISSUE_NUMBER=$(gh issue list --state open --search "Automated QA: Site/CRM Test Failures in:title" --json number --jq '.[0].number')
          BODY="## Automated QA failure\n\nThe CI browser tests detected one or more failures.\n\n- Public QA: ${{ steps.public_qa.outcome }}\n- CRM Phase 2 QA: ${{ steps.crm_qa.outcome }}\n- Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n- Commit: $GITHUB_SHA\n- Base URL: https://tarun1203.github.io/Pushpak-enterprises-website-and-CRM/\n- Generated: $(date -u '+%Y-%m-%d %H:%M UTC')\n\nSee the **pushpak-qa-report** artifact for the Playwright report, traces, screenshots and videos."
          if [ -z "$ISSUE_NUMBER" ]; then
            gh issue create --title "$ISSUE_TITLE" --body "$BODY"
          else
            gh issue comment "$ISSUE_NUMBER" --body "$BODY"
          fi

      - name: Fail workflow when QA fails
        if: steps.public_qa.outcome == 'failure' || steps.crm_qa.outcome == 'failure'
        run: exit 1
