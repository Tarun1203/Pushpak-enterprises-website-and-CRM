name: Automated Site QA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run full-site QA
        id: qa
        continue-on-error: true
        env:
          BASE_URL: https://tarun1203.github.io/Pushpak-enterprises-website-and-CRM/
          QA_MAX_PAGES: 150
        run: npx playwright test tests/e2e/site-smoke.spec.js tests/e2e/site-crawler.spec.js

      - name: Upload QA report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pushpak-qa-report
          path: qa-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Create or update QA bug
        if: steps.qa.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_TITLE="Automated QA: Site Test Failures"
          ISSUE_NUMBER=$(gh issue list --state open --search "Automated QA: Site Test Failures in:title" --json number --jq '.[0].number')
          BODY="## Automated QA failure\n\nThe scheduled/CI browser test detected one or more failures.\n\n- Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n- Commit: $GITHUB_SHA\n- Base URL: https://tarun1203.github.io/Pushpak-enterprises-website-and-CRM/\n- Generated: $(date -u '+%Y-%m-%d %H:%M UTC')\n\nSee the **pushpak-qa-report** artifact for the detailed Playwright report, traces, screenshots and videos."
          if [ -z "$ISSUE_NUMBER" ]; then
            gh issue create --title "$ISSUE_TITLE" --body "$BODY"
          else
            gh issue comment "$ISSUE_NUMBER" --body "$BODY"
          fi

      - name: Fail workflow when QA fails
        if: steps.qa.outcome == 'failure'
        run: exit 1
