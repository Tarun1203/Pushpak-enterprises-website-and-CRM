name: Apply Priority 1 Dashboard Performance Fix

on:
  push:
    paths:
      - .github/workflows/apply-priority1-performance-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch dashboard reads
        shell: python
        run: |
          from pathlib import Path

          sa = Path('crm/CRMsuperadmin.html')
          text = sa.read_text(encoding='utf-8')
          old = """        jobsSnap, requestsSnap, pincodeMaster, slaRules, approvalsChangeRequests,\n"""
          assert old in text, 'Super Admin destructuring block not found'
          text = text.replace(old, """        serviceJobsOpenCount, centerRequestsOpenCount, jobsSnap, requestsSnap, pincodeMaster, slaRules, approvalsChangeRequests,\n""", 1)
          old = """        getDocs(query(C('serviceJobs'), where('status', 'not-in', CLOSED_TICKET))),\n        getDocs(query(C('centerRequests'), where('status', 'not-in', CLOSED_TICKET))),\n"""
          new = """        count(query(C('serviceJobs'), where('status', 'not-in', CLOSED_TICKET))),\n        count(query(C('centerRequests'), where('status', 'not-in', CLOSED_TICKET))),\n        getDocs(query(C('serviceJobs'), where('status', 'not-in', CLOSED_TICKET), limit(100))),\n        getDocs(query(C('centerRequests'), where('status', 'not-in', CLOSED_TICKET), limit(100))),\n"""
          assert old in text, 'Super Admin unbounded service queries not found'
          text = text.replace(old, new, 1)
          old = """      let serviceTickets = 0, installationDemo = 0, slaAlerts = 0;\n"""
          new = """      let serviceTickets = serviceJobsOpenCount + centerRequestsOpenCount;\n      let installationDemo = 0, slaAlerts = 0;\n"""
          assert old in text, 'Super Admin service ticket accumulator not found'
          text = text.replace(old, new, 1)
          sa.write_text(text, encoding='utf-8')

          wh = Path('crm/CRMwarehouse.html')
          text = wh.read_text(encoding='utf-8')
          old = """  import { getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, collection, getDocs, query, where, orderBy, runTransaction, serverTimestamp, arrayUnion, getCountFromServer\n"""
          new = """  import { getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, collection, getDocs, query, where, orderBy, limit, runTransaction, serverTimestamp, arrayUnion, getCountFromServer\n"""
          assert old in text, 'Warehouse Firestore import line not found'
          text = text.replace(old, new, 1)
          old = """        newRequests, backorder, inTransit, partsSnap, damaged,\n"""
          new = """        newRequests, backorder, inTransit, warehouseInvSnap, damaged,\n"""
          assert old in text, 'Warehouse dashboard destructuring block not found'
          text = text.replace(old, new, 1)
          old = """        getDocs(C('spareParts')),\n"""
          new = """        getDocs(query(C('inventory'), where('location', '==', 'warehouse'), limit(500))),\n"""
          assert old in text, 'Warehouse dashboard full spareParts read not found'
          text = text.replace(old, new, 1)
          old = """      partsSnap.forEach(docSnap => {\n        const d = docSnap.data();\n        const qty = typeof d.quantity === 'number' ? d.quantity : (typeof d.stock === 'number' ? d.stock : null);\n        const reorder = typeof d.reorderLevel === 'number' ? d.reorderLevel : 5;\n        if (qty !== null && qty <= reorder) lowStock++;\n      });\n"""
          new = """      warehouseInvSnap.forEach(docSnap => {\n        const d = docSnap.data();\n        const qty = typeof d.quantity === 'number' ? d.quantity : (typeof d.stock === 'number' ? d.stock : null);\n        const reorder = typeof d.reorderLevel === 'number' ? d.reorderLevel : 5;\n        if (qty !== null && qty <= reorder) lowStock++;\n      });\n"""
          assert old in text, 'Warehouse low-stock calculation not found'
          text = text.replace(old, new, 1)
          wh.write_text(text, encoding='utf-8')

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "getDocs(C('spareParts'))" crm/CRMwarehouse.html
          grep -q "limit(500)" crm/CRMwarehouse.html
          grep -q "limit(100)" crm/CRMsuperadmin.html

      - name: Commit dashboard fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f crm/CRMsuperadmin.html crm/CRMwarehouse.html
          git commit -m "Fix Super Admin and Warehouse dashboard performance"
          git push origin main

      - name: Trigger Automated Site QA
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run automated-qa.yml --ref main

      - name: Remove one-time patch workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-priority1-performance-fix.yml
          git commit -m "Remove one-time dashboard performance patch workflow [skip ci]"
          git push origin main
