name: Patch QA bug snapshot push race

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Automated Site QA push step
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('.github/workflows/automated-qa.yml')
          s = p.read_text()
          pattern = r'''(?ms)(\s+git config user\.name "github-actions\[bot\]"\n\s+git config user\.email "41898282\+github-actions\[bot\]@users\.noreply\.github\.com"\n\s+git add -f crm/bug-data\.json\n\s+if git diff --cached --quiet; then\n\s+echo "Bug snapshot unchanged"\n\s+else\n\s+git commit -m "\[skip ci\] Update automated QA bug snapshot"\n)(\s+git push\n\s+fi)'''
          replacement = r'''\1\n            # QA can finish while another commit lands on main. Rebase before publishing the snapshot.\n            for attempt in 1 2 3; do\n              git fetch origin main\n              if git rebase origin/main && git push origin HEAD:main; then\n                break\n              fi\n              git rebase --abort || true\n              if [ "$attempt" -eq 3 ]; then exit 1; fi\n              sleep $((attempt * 3))\n            done\n          fi'''
          if not re.search(pattern, s):
              raise SystemExit('Target QA snapshot push block not found')
          p.write_text(re.sub(pattern, replacement, s, count=1))
          PY

      - name: Commit workflow fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/automated-qa.yml
          git commit -m "Fix QA bug snapshot push race [skip ci]"
          git push origin HEAD:main

      - name: Remove one-time patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-qa-push-race.yml
          git commit -m "Remove one-time QA push race patch [skip ci]"
          git push origin HEAD:main
