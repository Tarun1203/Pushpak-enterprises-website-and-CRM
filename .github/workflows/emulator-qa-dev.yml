name: Emulator QA (dev)

on:
  push:
    branches: ["qa/emulator-tests"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator QA tools
        run: |
          npm install -g firebase-tools@14
          cd tests/emulator && npm install
          cd ../../functions && npm install
      - name: Rules and role QA
        id: rules_qa
        continue-on-error: true
        run: firebase emulators:exec --project demo-pushpak --only firestore,storage "npm --prefix tests/emulator run test:rules"
      - name: Workflow QA
        id: workflow_qa
        continue-on-error: true
        run: firebase emulators:exec --project demo-pushpak --only auth,firestore,functions "npm --prefix tests/emulator run test:workflows"
      - name: Report
        if: always()
        run: |
          cat tests/emulator/results/*.txt 2>/dev/null || echo "::warning::no results"
          if [ "${{ steps.rules_qa.outcome }}" = "failure" ] || [ "${{ steps.workflow_qa.outcome }}" = "failure" ]; then exit 1; fi
