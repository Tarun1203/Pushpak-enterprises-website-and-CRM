<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technician — Pushpak Enterprises CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
    --ink:#25292E;--paper:#F5EFE0;--paper-deep:#EDE3CC;--stone:#7A7565;--hairline:#E0D6BC;
    --blue:#1C6FBA;--blue-deep:#0F4C88;
    --err:#B3261E;--ok:#1C7A46;--sidebar-w:264px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}

  #gate{
    position:fixed;inset:0;background:var(--paper);z-index:100;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--stone);
  }
  #app{display:none;}

  .layout{display:flex;min-height:100vh;}
  .sidebar{
    width:var(--sidebar-w);flex-shrink:0;background:var(--blue-deep);color:var(--paper);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .sidebar-header{padding:22px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.1);}
  .sidebar-header img{width:30px;height:30px;flex-shrink:0;object-fit:contain;}
  .sidebar-header .name{font-size:13px;font-weight:700;}
  .sidebar-header .role{font-size:11px;color:#C9D6E4;}
  .nav-group{padding:14px 10px 4px;}
  .nav-group-label{font-size:10.5px;font-weight:700;letter-spacing:0.05em;color:#9FB4C8;padding:6px 12px;text-transform:uppercase;}
  .nav-item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:9px 12px;border-radius:3px;font-size:13px;font-weight:500;color:#E3EAF1;
    cursor:pointer;transition:background .15s;
  }
  .nav-item:hover{background:rgba(255,255,255,0.08);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,0.16);color:#fff;font-weight:600;}
  .nav-badge{font-size:9.5px;background:rgba(255,255,255,0.12);color:#C9D6E4;padding:2px 6px;border-radius:20px;}
  .sidebar-footer{margin-top:auto;padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);}
  .sidebar-footer .email{font-size:11.5px;color:#C9D6E4;margin-bottom:10px;word-break:break-all;}
  .logout-btn{
    width:100%;background:transparent;border:1px solid rgba(255,255,255,0.25);color:#E3EAF1;
    padding:9px;border-radius:3px;font-size:12.5px;font-weight:600;
  }
  .logout-btn:hover{background:rgba(255,255,255,0.1);}

  .main{flex:1;min-width:0;}
  .topbar{
    padding:18px 32px;border-bottom:1px solid var(--hairline);
    display:flex;align-items:center;justify-content:space-between;
  }
  .topbar h1{font-size:20px;font-weight:800;letter-spacing:-0.01em;}
  .topbar .sub{font-size:13px;color:var(--stone);margin-top:2px;}
  .content{padding:32px;}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hairline);border:1px solid var(--hairline);margin-bottom:32px;}
  .stat-card{background:var(--paper);padding:22px 20px;}
  .stat-card .label{font-size:12px;color:var(--stone);font-weight:600;margin-bottom:8px;}
  .stat-card .value{font-size:28px;font-weight:800;letter-spacing:-0.01em;}
  .stat-card .hint{font-size:11.5px;color:var(--stone);margin-top:4px;}
  @media (max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}

  .panel{border:1px solid var(--hairline);border-radius:2px;}
  .panel-header{padding:18px 22px;border-bottom:1px solid var(--hairline);display:flex;justify-content:space-between;align-items:center;}
  .panel-header h2{font-size:15px;font-weight:700;}
  .panel-body{padding:22px;}

  .coming-soon{
    border:1px dashed var(--hairline);border-radius:2px;padding:60px 30px;text-align:center;color:var(--stone);
  }
  .coming-soon .big{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px;}
  .coming-soon .small{font-size:13px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11.5px;font-weight:700;color:var(--stone);text-transform:uppercase;letter-spacing:0.03em;padding:10px 14px;border-bottom:1px solid var(--hairline);}
  td{padding:12px 14px;border-bottom:1px solid var(--hairline);vertical-align:top;}
  tr:last-child td{border-bottom:none;}

  .btn-primary{background:var(--blue);color:#fff;font-weight:600;font-size:13.5px;padding:10px 18px;border:none;border-radius:2px;}
  .btn-primary:disabled{opacity:0.6;cursor:default;}
  .btn-secondary{background:transparent;border:1px solid var(--hairline);font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:2px;}
  .btn-danger{background:transparent;border:1px solid var(--err);color:var(--err);font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:2px;}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .status-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .status-pill.assigned{background:#DCEAF6;color:var(--blue-deep);}
  .status-pill.in_progress{background:#FBEAD2;color:#9A6A15;}
  .status-pill.completed{background:#D9EEE0;color:var(--ok);}
  .status-pill.cancelled{background:#F6DCDC;color:var(--err);}
  .status-pill.new{background:#DCEAF6;color:var(--blue-deep);}
  .status-pill.approved{background:#DCEAF6;color:var(--blue-deep);}
  .status-pill.picking{background:var(--paper-deep);color:var(--ink);}
  .status-pill.packing{background:var(--paper-deep);color:var(--ink);}
  .status-pill.dispatched{background:#D9EEE0;color:var(--ok);}
  .status-pill.intransit{background:#D9EEE0;color:var(--ok);}
  .status-pill.fulfilled_by_center{background:#D9EEE0;color:var(--ok);}
  .status-pill.received{background:#D9EEE0;color:var(--ok);}
  .status-pill.ok{background:#D9EEE0;color:var(--ok);}
  .status-pill.backorder{background:#FBEAD2;color:#9A6A15;}
  .status-pill.out{background:#F6DCDC;color:var(--err);}

  .tab-toggle{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .tab-toggle button{
    background:var(--paper);border:1px solid var(--hairline);font-weight:600;font-size:12.5px;
    padding:8px 16px;border-radius:20px;color:var(--stone);
  }
  .tab-toggle button.active{background:var(--blue);border-color:var(--blue);color:#fff;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,21,26,0.5);display:none;
    align-items:center;justify-content:center;z-index:50;
  }
  .modal-overlay.show{display:flex;}
  .modal{background:var(--paper);width:100%;max-width:440px;border-radius:3px;padding:28px;max-height:88vh;overflow-y:auto;}
  .modal h3{font-size:16px;font-weight:800;margin-bottom:18px;}
  .form-row{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
  .form-row label{font-size:12px;font-weight:600;color:var(--stone);}
  .form-row input,.form-row select,.form-row textarea{border:1px solid var(--hairline);padding:10px 12px;font-size:13.5px;border-radius:2px;font-family:inherit;background:#fff;}
  .form-row textarea{resize:vertical;min-height:70px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
  .modal-error{font-size:12.5px;color:var(--err);margin-top:6px;display:none;}
  .modal-error.show{display:block;}
  .modal-success{font-size:12.5px;color:var(--ok);margin-top:6px;display:none;}
  .modal-success.show{display:block;}
  .empty-row{text-align:center;color:var(--stone);padding:32px;}

  .notif-bell{position:relative;background:none;border:1px solid var(--hairline);border-radius:2px;padding:9px 12px;cursor:pointer;font-size:15px;}
  .notif-badge{position:absolute;top:-6px;right:-6px;background:var(--err);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 5px;min-width:16px;text-align:center;}
  .notif-panel{
    position:absolute;top:100%;right:0;margin-top:8px;width:340px;max-height:400px;overflow-y:auto;
    background:var(--paper);border:1px solid var(--hairline);border-radius:2px;box-shadow:0 8px 24px rgba(0,0,0,0.12);
    z-index:60;display:none;
  }
  .notif-panel.show{display:block;}
  .notif-panel-header{padding:12px 16px;border-bottom:1px solid var(--hairline);display:flex;justify-content:space-between;align-items:center;}
  .notif-panel-header h4{font-size:13px;font-weight:700;}
  .notif-panel-header button{background:none;border:none;font-size:11.5px;color:var(--blue);cursor:pointer;font-weight:600;}
  .notif-item{padding:12px 16px;border-bottom:1px solid var(--hairline);cursor:pointer;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item.unread{background:var(--paper-deep);}
  .notif-item .title{font-size:12.5px;font-weight:700;margin-bottom:3px;}
  .notif-item .msg{font-size:12px;color:var(--stone);}
  .notif-item .time{font-size:10.5px;color:var(--stone);margin-top:4px;}
  .notif-empty{padding:24px 16px;text-align:center;font-size:12.5px;color:var(--stone);}
</style>
</head>
<body>

<div id="gate">Checking your session…</div>

<div id="app">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../assets/logos/pushpak-enterprises-icon.png" alt="">
        <div>
          <div class="name">Pushpak Enterprises</div>
          <div class="role">Technician</div>
        </div>
      </div>

      <div id="nav-container"></div>

      <div class="sidebar-footer">
        <div class="email" id="user-email"></div>
        <button class="logout-btn" id="logout-btn">Sign out</button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div>
          <h1 id="page-title">Dashboard</h1>
          <div class="sub" id="page-sub">Welcome back</div>
        </div>
        <div style="position:relative;">
          <button class="notif-bell" id="notif-bell-btn">🔔<span class="notif-badge" id="notif-badge" style="display:none;">0</span></button>
          <div class="notif-panel" id="notif-panel">
            <div class="notif-panel-header"><h4>Notifications</h4><button id="notif-mark-all">Mark all read</button></div>
            <div id="notif-list"><div class="notif-empty">Loading…</div></div>
          </div>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<!-- New Job modal -->
<!-- Job closure modal — required before a job can be marked complete -->
<div class="modal-overlay" id="closure-overlay">
  <div class="modal">
    <h3>Complete job</h3>
    <div id="closure-job-label" style="font-size:12.5px;color:var(--stone);margin-bottom:14px;"></div>
    <form id="closure-form">
      <input type="hidden" id="closure-job-id">
      <div class="form-row">
        <label>Closure code</label>
        <select id="closure-code" required>
          <option value="">Select…</option>
          <option value="repaired">Repaired</option>
          <option value="replaced">Part(s) Replaced</option>
          <option value="no_fault_found">No Fault Found</option>
          <option value="unable_to_repair">Unable to Repair — Escalated</option>
          <option value="customer_cancelled">Customer Cancelled</option>
        </select>
      </div>
      <div class="form-row">
        <label>Action taken</label>
        <textarea id="closure-notes" rows="3" placeholder="What was actually done during this visit" required></textarea>
      </div>
      <div class="form-row">
        <label>Parts used</label>
        <div id="closure-linked-parts" style="font-size:12.5px;color:var(--stone);margin-bottom:8px;"></div>
        <input type="text" id="closure-parts-notes" placeholder="Any parts used that weren't requested through the system, or type 'None'">
      </div>
      <div class="form-row">
        <label>Consume from your Spare Bag &amp; log the old part as defective <span style="font-weight:400;color:var(--stone);">(optional — leave blank if no physical part was swapped)</span></label>
        <div style="display:flex;gap:8px;margin-bottom:6px;">
          <select id="closure-part-1" style="flex:2;"><option value="">— Select part —</option></select>
          <input type="number" id="closure-partqty-1" min="1" placeholder="Qty" style="flex:1;">
        </div>
        <div style="display:flex;gap:8px;margin-bottom:6px;">
          <select id="closure-part-2" style="flex:2;"><option value="">— Select part —</option></select>
          <input type="number" id="closure-partqty-2" min="1" placeholder="Qty" style="flex:1;">
        </div>
        <div style="display:flex;gap:8px;">
          <select id="closure-part-3" style="flex:2;"><option value="">— Select part —</option></select>
          <input type="number" id="closure-partqty-3" min="1" placeholder="Qty" style="flex:1;">
        </div>
      </div>
      <div class="modal-error" id="closure-error"></div>
      <div class="modal-success" id="closure-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-closure">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-closure">Mark Complete</button>
      </div>
    </form>
  </div>
</div>

<!-- Job detail popup — opened by clicking a ticket row in My Jobs.
     Shows the full ticket, lets the technician advance/close it from
     here, and request a spare part linked to this job. -->
<div class="modal-overlay" id="job-detail-overlay">
  <div class="modal" style="max-width:560px;">
    <h3 id="jd-title">Job details</h3>
    <div id="jd-body" style="font-size:13px;line-height:1.9;margin-bottom:8px;"></div>
    <hr style="margin:16px 0;border:none;border-top:1px solid var(--hairline);">
    <div id="jd-actions" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;"></div>
    <div id="jd-history-section" style="display:none;margin-bottom:18px;">
      <label style="font-size:12px;font-weight:600;color:var(--stone);">Service history — same serial number</label>
      <div id="jd-history-list" style="margin-top:8px;"></div>
    </div>
    <div id="jd-photo-section" style="margin-bottom:18px;">
      <label style="font-size:12px;font-weight:600;color:var(--stone);">Photos</label>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:8px;">
        <div>
          <label style="font-size:11.5px;color:var(--stone);">Serial number</label>
          <div id="jd-serial-photo-wrap" style="display:flex;flex-wrap:wrap;gap:8px;margin:6px 0;"></div>
          <input type="file" id="jd-serial-photo-input" accept="image/*" style="font-size:11.5px;width:100%;">
        </div>
        <div>
          <label style="font-size:11.5px;color:var(--stone);">Before</label>
          <div id="jd-before-photo-grid" style="display:flex;flex-wrap:wrap;gap:8px;margin:6px 0;"></div>
          <input type="file" id="jd-before-photo-input" accept="image/*" multiple style="font-size:11.5px;width:100%;">
        </div>
        <div>
          <label style="font-size:11.5px;color:var(--stone);">After</label>
          <div id="jd-after-photo-grid" style="display:flex;flex-wrap:wrap;gap:8px;margin:6px 0;"></div>
          <input type="file" id="jd-after-photo-input" accept="image/*" multiple style="font-size:11.5px;width:100%;">
        </div>
      </div>
      <div class="modal-error" id="jd-photo-error" style="margin-top:8px;"></div>
    </div>
    <div id="jd-spare-section">
      <div id="jd-spare-request-form">
        <label style="font-size:12px;font-weight:600;color:var(--stone);">Request a spare part</label>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <select id="jd-spare-part" style="flex:1;border:1px solid var(--hairline);padding:8px 10px;border-radius:2px;font-size:13px;"><option value="">Select part…</option></select>
          <input type="number" id="jd-spare-qty" min="1" value="1" style="width:70px;border:1px solid var(--hairline);padding:8px 10px;border-radius:2px;font-size:13px;">
          <button type="button" class="btn-secondary" id="jd-spare-request-btn">Request Spare</button>
        </div>
        <div class="modal-error" id="jd-spare-error" style="margin-top:8px;"></div>
      </div>
      <div id="jd-spare-closed-note" style="display:none;font-size:12.5px;color:var(--stone);">This job is already closed — no further spare requests against it.</div>
      <div id="jd-linked-requests" style="margin-top:10px;"></div>
    </div>
    <div class="modal-actions" style="margin-top:18px;">
      <button type="button" class="btn-secondary" id="jd-close-btn">Close</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="job-overlay">
  <div class="modal">
    <h3>Log a new job</h3>
    <form id="job-form">
      <div class="form-row">
        <label>Customer name</label>
        <input type="text" id="job-customer-name" required>
      </div>
      <div class="form-row">
        <label>Customer phone</label>
        <input type="tel" id="job-customer-phone" required>
      </div>
      <div class="form-row">
        <label>Address</label>
        <input type="text" id="job-address" placeholder="e.g. area, city">
      </div>
      <div class="form-row">
        <label>Pincode <span class="hint">(needed for SLA territory rules)</span></label>
        <input type="text" id="job-pincode" inputmode="numeric" maxlength="6" placeholder="e.g. 580020">
      </div>
      <div class="form-row">
        <label>Service type</label>
        <select id="job-type">
          <option value="repair">Repair</option>
          <option value="installation">Installation</option>
          <option value="warranty">Warranty Repair</option>
          <option value="paid">Paid Repair</option>
        </select>
      </div>
      <div class="form-row">
        <label>Product / brand</label>
        <input type="text" id="job-product" placeholder="e.g. MakWell geyser 15L">
      </div>
      <div class="form-row">
        <label>Product category <span style="font-weight:400;color:var(--stone);">(decides your warranty service-charge rate)</span></label>
        <select id="job-category"><option value="">Loading…</option></select>
      </div>
      <div class="form-row" id="job-size-bucket-row" style="display:none;">
        <label>Size / model <span style="font-weight:400;color:var(--stone);">(this category's rate varies by size)</span></label>
        <select id="job-size-bucket"><option value="">N/A</option></select>
      </div>
      <div class="form-row">
        <label>Serial number <span style="font-weight:400;color:var(--stone);">(links this job to the customer's registration, if any)</span></label>
        <input type="text" id="job-serial" placeholder="e.g. MK3201NML0123456">
      </div>
      <div class="form-row">
        <label>Issue description</label>
        <textarea id="job-issue" placeholder="What's wrong / what's needed" required></textarea>
      </div>
      <div class="form-row">
        <label>Scheduled date (optional)</label>
        <input type="date" id="job-scheduled-date">
      </div>
      <div class="form-row" style="display:flex;gap:12px;">
        <div style="flex:1;"><label>Start time</label><input type="time" id="job-scheduled-start"></div>
        <div style="flex:1;"><label>End time</label><input type="time" id="job-scheduled-end"></div>
      </div>
      <div class="modal-error" id="job-error"></div>
      <div class="modal-success" id="job-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-job">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-job">Save job</button>
      </div>
    </form>
  </div>
</div>

<!-- Spare Bag adjust modal -->
<div class="modal-overlay" id="bag-overlay">
  <div class="modal">
    <h3 id="bag-modal-title">Update spare bag</h3>
    <form id="bag-form">
      <div class="form-row">
        <label>Part</label>
        <select id="bag-part-id" required>
          <option value="">Select a part…</option>
        </select>
      </div>
      <div class="form-row">
        <label>Action</label>
        <select id="bag-type">
          <option value="add">Received from Head Office</option>
          <option value="use">Used on a job</option>
        </select>
      </div>
      <div class="form-row">
        <label>Quantity</label>
        <input type="number" id="bag-qty" min="1" value="1" required>
      </div>
      <div class="form-row">
        <label>Notes (optional)</label>
        <input type="text" id="bag-notes" placeholder="e.g. job ID, or dispatch reference">
      </div>
      <div class="modal-error" id="bag-error"></div>
      <div class="modal-success" id="bag-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-bag">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-bag">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- New Claim modal -->
<div class="modal-overlay" id="tclaim-overlay">
  <div class="modal">
    <h3>Submit a claim</h3>
    <form id="tclaim-form">
      <div class="form-row">
        <label>Description</label>
        <input type="text" id="tclaim-description" placeholder="e.g. Travel expense for on-site repair" required>
      </div>
      <div class="form-row">
        <label>Amount (₹)</label>
        <input type="number" id="tclaim-amount" min="0" step="0.01" required>
      </div>
      <div class="form-row">
        <label>Notes (optional)</label>
        <textarea id="tclaim-notes" placeholder="Any additional context…"></textarea>
      </div>
      <div class="modal-error" id="tclaim-error"></div>
      <div class="modal-success" id="tclaim-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-tclaim">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-tclaim">Submit claim</button>
      </div>
    </form>
  </div>
</div>

<script type="module">

  // Escapes text before it's interpolated into an innerHTML template.

  // server-side validation — anything they type could otherwise
  // execute as a stored XSS payload the moment staff view it here.
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')

  const NAV = [{"group": "Overview", "items": [{"id": "dashboard", "label": "Dashboard", "built": true}]}, {"group": "My Work", "items": [{"id": "jobs", "label": "My Jobs", "built": true}, {"id": "schedule", "label": "Schedule", "built": true}, {"id": "availability", "label": "Availability", "built": true}, {"id": "diagnosis", "label": "Diagnosis", "built": true}]}, {"group": "Inventory", "items": [{"id": "sparebag", "label": "Spare Bag", "built": true}]}, {"group": "Finance", "items": [{"id": "claims", "label": "Claims", "built": true}, {"id": "earnings", "label": "Earnings", "built": true}]}, {"group": "Operations", "items": [{"id": "performance", "label": "Performance", "built": true}, {"id": "profile", "label": "Profile", "built": true}]}];

  function selectSection(id, label) {

    if (id === 'dashboard') {

  async function renderDashboard() {

      <div class="panel">
        <div class="panel-header"><h2>Getting started</h2></div>
        <div class="panel-body" style="font-size:13.5px;color:var(--stone);line-height:1.7;">
          <b style="color:var(--blue)">My Jobs</b> is fully working — log jobs as they come in and move them through
          Assigned → In Progress → Completed. Other sections in the sidebar will fill in module by module.
        </div>
      </div>`;
    if (!currentUser) return;
    try {
      // Same two-collection split as My Jobs (see note there) — a
      // center-assigned ticket's "assigned" status counts the same as
      // a serviceJobs "assigned" status for these tiles.
      const [sjAssigned, sjProgress, sjCompleted, crAssigned, crProgress, crCompleted] = await Promise.all([
        getDocs(query(collection(db, 'serviceJobs'), where('technicianUid', '==', currentUser.uid), where('status', '==', 'assigned'))),
        getDocs(query(collection(db, 'serviceJobs'), where('technicianUid', '==', currentUser.uid), where('status', '==', 'in_progress'))),
        getDocs(query(collection(db, 'serviceJobs'), where('technicianUid', '==', currentUser.uid), where('status', '==', 'completed'))),
        getDocs(query(collection(db, 'centerRequests'), where('technicianUid', '==', currentUser.uid), where('status', 'in', ['new', 'assigned']))),
        getDocs(query(collection(db, 'centerRequests'), where('technicianUid', '==', currentUser.uid), where('status', '==', 'in_progress'))),
        getDocs(query(collection(db, 'centerRequests'), where('technicianUid', '==', currentUser.uid), where('status', '==', 'completed'))),

      document.getElementById('stat-assigned').textContent = sjAssigned.size + crAssigned.size;

  // ---------------------------------------------------------------
  // My Jobs — Assigned → In Progress → Completed (or Cancelled).
  // Scoped to the signed-in technician's own uid — no dispatcher /
  // routing module exists yet, so technicians log their own jobs
  // for now; this collection is exactly what a future Routing
  // module would also write into.
  // ---------------------------------------------------------------

  const JOB_STATUS_LABELS = {
    assigned: 'Assigned', accepted: 'Accepted', on_the_way: 'On the Way', at_customer: 'At Customer',
    in_progress: 'In Progress', waiting_spare: 'Waiting for Spare', completed: 'Completed',
    verification: 'Verification', closed: 'Closed', reassignment_required: 'Reassignment Requested',
    cancelled: 'Cancelled', reopened: 'Reopened'
  };
  const JOB_STATUS_PILL_CLASS = {
    assigned: 'new', accepted: 'assigned', on_the_way: 'assigned', at_customer: 'assigned',
    in_progress: 'in_progress', waiting_spare: 'backorder', completed: 'ok', verification: 'ok',
    closed: 'ok', reassignment_required: 'out', cancelled: 'cancelled', reopened: 'new'
  };
  // What a technician can do from each status — a real state machine,
  // not free-form status editing. Verification/Closed happen outside
  // the technician's own screen (Service overview, by staff), since a
  // job being genuinely done shouldn't just be self-declared.
  const JOB_NEXT_ACTIONS = {
    assigned: [{ next: 'accepted', label: 'Accept Job' }, { next: 'reassignment_required', label: 'Request Reassignment', variant: 'danger' }],
    accepted: [{ next: 'on_the_way', label: "I'm On the Way" }],
    on_the_way: [{ next: 'at_customer', label: 'Arrived at Customer' }],
    at_customer: [{ next: 'in_progress', label: 'Start Work' }],
    in_progress: [{ next: 'waiting_spare', label: 'Waiting for Spare', variant: 'secondary' }, { next: 'completed', label: 'Mark Complete' }],
    waiting_spare: [{ next: 'in_progress', label: 'Resume Work' }],
  };
  const JOB_ACTIVE_STATUSES = ['assigned', 'accepted', 'on_the_way', 'at_customer', 'in_progress', 'waiting_spare'];
  let currentJobFilter = 'active'; // 'active' = assigned + in_progress

  async function generateJobId() {
    const d = new Date();
    const monthKey = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}`;
    const counterRef = doc(db, 'counters', `servicejob-${monthKey}`);
    const next = await runTransaction(db, async (transaction) => {
      const snap = await transaction.get(counterRef);
      const n = (snap.exists() ? snap.data().value : 0) + 1;
      if (snap.exists()) transaction.update(counterRef, { value: n });
      else transaction.set(counterRef, { value: n });
      return n;
    });
    const dateStr = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    return `PE-JOB-${dateStr}-${String(next).padStart(4, '0')}-Technician`;
  }

  // Uses the SAME shared counter key Warehouse's own spare request
  // creation uses (sparerequest-YYYYMM) so IDs stay globally
  // sequential regardless of which dashboard created the request.
  async function generateSpareRequestId() {
    const d = new Date();
    const monthKey = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}`;
    const counterRef = doc(db, 'counters', `sparerequest-${monthKey}`);
    const next = await runTransaction(db, async (transaction) => {
      const snap = await transaction.get(counterRef);
      const n = (snap.exists() ? snap.data().value : 0) + 1;
      if (snap.exists()) transaction.update(counterRef, { value: n });
      else transaction.set(counterRef, { value: n });
      return n;
    });
    const dateStr = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    return `PE-SR-${dateStr}-${String(next).padStart(4, '0')}-Technician`;
  }

  const SPARE_REQ_STATUS_LABELS = {
    new: 'Requested', approved: 'Approved', picking: 'Picking', packing: 'Packing',
    dispatched: 'Dispatched', intransit: 'In Transit', backorder: 'Back Order',
    fulfilled_by_center: 'Issued (Center Stock)', received: 'Received'
  };

  function renderMyJobs() {
    contentEl.innerHTML = `
      <div class="panel">
        <div class="panel-header">
          <h2>My Jobs</h2>
          <button class="btn-primary" id="open-job-request">+ Log Job</button>
        </div>
        <div class="panel-body" style="padding-bottom:0;">
          <div class="tab-toggle" id="job-tabs">
            <button data-filter="active" class="active">Active</button>
            <button data-filter="waiting_spare">Waiting for Spare</button>
            <button data-filter="completed">Completed</button>
            <button data-filter="closed">Closed</button>
            <button data-filter="all">All</button>
          </div>
        </div>
        <div class="panel-body" style="padding:0;">
          <table>
            <thead>
              <tr><th>Job ID</th><th>Customer</th><th>Phone</th><th>Product</th><th>Issue</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="jobs-tbody"><tr><td colspan="7" class="empty-row">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>`;
    document.getElementById('open-job-request').addEventListener('click', openJobModal);
    document.querySelectorAll('#job-tabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#job-tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentJobFilter = btn.dataset.filter;
        loadMyJobs();
      });
    });
    currentJobFilter = 'active';
    loadMyJobs();
  }

  // A technician's work shows up in TWO different collections:
  // serviceJobs (routed straight to them — the richer accept/on-the-way/
  // at-customer pipeline above) and centerRequests (assigned to them by
  // their OWN service center's roster — a simpler new/assigned/
  // in_progress/waiting_spare/completed pipeline, same one Service
  // Center's own "Center Requests" page uses). Previously this page only
  // ever queried serviceJobs, so anything a service center assigned
  // never showed up here at all.
  const CR_JOB_NEXT_ACTIONS = {
    assigned: [{ next: 'in_progress', label: 'Start Work' }],
    in_progress: [{ next: 'waiting_spare', label: 'Waiting for Spare', variant: 'secondary' }, { next: 'completed', label: 'Mark Complete' }],
    waiting_spare: [{ next: 'in_progress', label: 'Resume Work' }],
  };
  const CR_ACTIVE_STATUSES = ['new', 'assigned', 'in_progress', 'waiting_spare'];
  // Once a job lands in any of these, it's done — no more spare
  // requests should be raised against it from the job popup.
  const TERMINAL_JOB_STATUSES = ['completed', 'closed', 'cancelled'];

  async function loadMyJobs() {
    const tbody = document.getElementById('jobs-tbody');
    if (!currentUser) return;
    try {
      const [jobsSnap, centerReqSnap] = await Promise.all([
        getDocs(query(collection(db, 'serviceJobs'), where('technicianUid', '==', currentUser.uid))),
        getDocs(query(collection(db, 'centerRequests'), where('technicianUid', '==', currentUser.uid))),
      ]);
      let docs = [];
      jobsSnap.forEach(d => docs.push({ id: d.id, coll: 'serviceJobs', ...d.data() }));
      centerReqSnap.forEach(d => docs.push({ id: d.id, coll: 'centerRequests', ...d.data() }));
      docs.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      if (currentJobFilter === 'active') {
        docs = docs.filter(d => d.coll === 'serviceJobs'
          ? (JOB_ACTIVE_STATUSES.includes(d.status) && d.status !== 'waiting_spare')
          : (CR_ACTIVE_STATUSES.includes(d.status) && d.status !== 'waiting_spare'));
      } else if (currentJobFilter !== 'all') {
        docs = docs.filter(d => d.status === currentJobFilter);
      }
      if (docs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-row">No jobs here.</td></tr>`;
        return;
      }
      tbody.innerHTML = '';
      docs.forEach(d => {
        const actions = (d.coll === 'serviceJobs' ? JOB_NEXT_ACTIONS[d.status] : CR_JOB_NEXT_ACTIONS[d.status]) || [];
        let actionHtml = actions.length
          ? `<div class="row-actions">${actions.map(a => `<button class="${a.variant === 'danger' ? 'btn-danger' : a.variant === 'secondary' ? 'btn-secondary' : 'btn-primary'} job-action-btn" data-id="${d.id}" data-coll="${d.coll}" data-next="${a.next}">${a.label}</button>`).join('')}</div>`
          : '—';
        const tr = document.createElement('tr');
        tr.style.cursor = 'pointer';
        tr.dataset.id = d.id;
        tr.dataset.coll = d.coll;
        tr.innerHTML = `
          <td style="font-size:12px;color:var(--stone);">${d.jobId || d.requestId || d.id}${d.coll === 'centerRequests' ? ' <span style="color:var(--stone);">(via center)</span>' : ''}</td>
          <td>${escapeHtml(d.customerName || '—')}</td>
          <td>${escapeHtml(d.customerPhone || '—')}</td>
          <td>${escapeHtml(d.product || d.modelNo || '—')}</td>
          <td style="max-width:220px;">${escapeHtml(d.issue || '—')}</td>
          <td><span class="status-pill ${JOB_STATUS_PILL_CLASS[d.status] || ''}">${JOB_STATUS_LABELS[d.status] || d.status}</span></td>
          <td>${actionHtml}</td>`;
        tbody.appendChild(tr);
      });
      // Clicking anywhere on a row opens the full ticket popup; clicking
      // one of its inline action buttons still does that action directly
      // without also opening the popup underneath it.
      tbody.querySelectorAll('tr[data-id]').forEach(tr => {
        tr.addEventListener('click', (e) => {
          if (e.target.closest('.job-action-btn')) return;
          const jobDoc = docs.find(x => x.id === tr.dataset.id && x.coll === tr.dataset.coll);
          if (jobDoc) openJobDetailModal(jobDoc);
        });
      });
      tbody.querySelectorAll('.job-action-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.dataset.next === 'completed') {
            const jobDoc = docs.find(x => x.id === btn.dataset.id && x.coll === btn.dataset.coll);
            if (jobDoc) openClosureModal(jobDoc);
          } else {
            advanceJob(btn.dataset.id, btn.dataset.next, btn.dataset.coll);
          }
        });
      });
    } catch (err) {
      console.error('Load jobs failed:', err);
      tbody.innerHTML = `<tr><td colspan="7" class="empty-row" style="color:var(--err);">Couldn't load jobs. Check console for details.</td></tr>`;
    }
  }

  // Every status change writes one entry to this job's own statusLog
  // subcollection — an append-only timeline other portals (Warehouse,
  // Super Admin) read to show the ticket's full history. Non-blocking:
  // a failed log write never stops the real status change.
  async function logTicketStatus(coll, docId, status, note) {
    try {
      await addDoc(collection(db, coll, docId, 'statusLog'), {
        status, note: note || '',
        changedByEmail: currentUser ? currentUser.email : 'unknown',
        createdAt: serverTimestamp()
      });
    } catch (err) {
      console.warn('Status log write failed (non-blocking):', err.message);
    }
    if (coll === 'centerRequests' || coll === 'serviceJobs') await syncPublicTicketMirror(coll, docId, status);
  }

  // Keeps a narrow, public-safe mirror (publicTicketStatus) of this
  // CRM-raised ticket up to date, so the website's Track Service page
  // can look it up by its own ticket ID (PE-CR-.../PE-JOB-...) the
  // same way it already can for a website-raised request — without
  // ever giving the public query access to the real collection
  // (which carries the customer's address, closure notes, etc.).
  // Non-blocking: never stops the real update.
  async function syncPublicTicketMirror(coll, docId, statusOverride) {
    try {
      const snap = await getDoc(doc(db, coll, docId));
      if (!snap.exists()) return;
      const d = snap.data();
      const ticketId = d.requestId || d.jobId;
      if (!ticketId || !d.customerPhone) return;
      await setDoc(doc(db, 'publicTicketStatus', ticketId), {
        ticketId,
        source: coll,
        sourceDocId: docId,
        customerPhone: d.customerPhone,
        requestType: d.type === 'installation' ? 'installation' : 'repair',
        category: d.category || null,
        status: statusOverride || d.status || 'new',
        warrantyStatus: d.warrantyStatus || null,
        createdAt: d.createdAt || serverTimestamp(),
        updatedAt: serverTimestamp()
      }, { merge: true });
    } catch (err) {
      console.warn('Public ticket mirror sync failed (non-blocking):', err.message);
    }
  }

  async function advanceJob(id, nextStatus, coll) {
    coll = coll || 'serviceJobs';
    try {
      await updateDoc(doc(db, coll, id), { status: nextStatus, updatedAt: serverTimestamp() });
      await logTicketStatus(coll, id, nextStatus);
      loadMyJobs();
    } catch (err) {
      console.error('Update job failed:', err);
      alert('Could not update this job. Check the console for details.');
    }
  }

  // ---------------------------------------------------------------
  // Job detail popup — full ticket view + status actions + spare
  // request, opened from a My Jobs row. Works for both serviceJobs
  // and centerRequests tickets (jobDoc.coll tells which).
  // ---------------------------------------------------------------

  const jdOverlay = document.getElementById('job-detail-overlay');
  let jdJob = null;

  function jdRow(label, value) {
    if (value === null || value === undefined || value === '') return '';
    return `<div style="display:flex;gap:8px;"><b style="min-width:130px;color:var(--stone);font-weight:600;">${label}</b><span>${escapeHtml(String(value))}</span></div>`;
  }

  async function openJobDetailModal(jobDoc) {
    jdJob = jobDoc;
    document.getElementById('jd-title').textContent = jobDoc.jobId || jobDoc.requestId || jobDoc.id;
    const bodyEl = document.getElementById('jd-body');
    bodyEl.innerHTML = [
      jdRow('Customer', jobDoc.customerName),
      jdRow('Phone', jobDoc.customerPhone),
      jdRow('Address', jobDoc.address),
      jdRow('Product', jobDoc.product),
      jdRow('Brand', jobDoc.brand),
      jdRow('Model No.', jobDoc.modelNo),
      jdRow('Serial No.', jobDoc.serialNumber),
      jdRow('Purchased', jobDoc.purchaseDate ? `${jobDoc.purchaseDate}${jobDoc.purchasedFrom ? ' — ' + jobDoc.purchasedFrom : ''}` : ''),
      jdRow('Issue', jobDoc.issue),
      jdRow('Scheduled', jobDoc.scheduledDate ? `${jobDoc.scheduledDate}${jobDoc.scheduledStartTime ? ' ' + jobDoc.scheduledStartTime : ''}` : ''),
      `<div style="margin-top:6px;">Status: <span class="status-pill ${JOB_STATUS_PILL_CLASS[jobDoc.status] || ''}">${JOB_STATUS_LABELS[jobDoc.status] || jobDoc.status}</span>${jobDoc.coll === 'centerRequests' ? ' <span style="color:var(--stone);">(via center)</span>' : ''}</div>`
    ].filter(Boolean).join('');

    const actions = (jobDoc.coll === 'serviceJobs' ? JOB_NEXT_ACTIONS[jobDoc.status] : CR_JOB_NEXT_ACTIONS[jobDoc.status]) || [];
    const actionsEl = document.getElementById('jd-actions');
    actionsEl.innerHTML = actions.length
      ? actions.map(a => `<button type="button" class="${a.variant === 'danger' ? 'btn-danger' : a.variant === 'secondary' ? 'btn-secondary' : 'btn-primary'}" data-next="${a.next}">${a.label}</button>`).join('')
      : '<span style="color:var(--stone);font-size:12.5px;">No further action from here.</span>';
    actionsEl.querySelectorAll('button[data-next]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.next === 'completed') {
          closeJobDetailModal();
          openClosureModal(jobDoc);
        } else {
          advanceJob(jobDoc.id, btn.dataset.next, jobDoc.coll);
          closeJobDetailModal();
        }
      });
    });

    document.getElementById('jd-photo-error').classList.remove('show');
    renderJdSerialPhoto(jobDoc);
    renderJdPhotoThumbnails(document.getElementById('jd-before-photo-grid'), jobDoc.beforePhotos || [], jobDoc, 'beforePhotos');
    renderJdPhotoThumbnails(document.getElementById('jd-after-photo-grid'), jobDoc.afterPhotos || [], jobDoc, 'afterPhotos');

    // A closed job is done — no more spare requests should be raised
    // against it. The existing linked-requests list underneath still
    // shows (read-only) whatever was already requested, for a record.
    const isClosed = TERMINAL_JOB_STATUSES.includes(jobDoc.status);
    document.getElementById('jd-spare-request-form').style.display = isClosed ? 'none' : '';
    document.getElementById('jd-spare-closed-note').style.display = isClosed ? '' : 'none';
    if (!isClosed) {
      const spareErrEl = document.getElementById('jd-spare-error');
      spareErrEl.classList.remove('show');
      document.getElementById('jd-spare-qty').value = 1;
      await populatePartSelect(document.getElementById('jd-spare-part'));
    }

    await renderJdLinkedRequests(jobDoc);
    await renderJdServiceHistory(jobDoc);

    jdOverlay.classList.add('show');
  }

  // A completed job for the same appliance shouldn't be a blank slate
  // if the complaint comes back — this surfaces the technician's own
  // past tickets against the same serial number so they can see what
  // was already tried/replaced before starting the new one. Scoped to
  // tickets THIS technician can already read under existing rules (a
  // full cross-center history would need a much wider read grant).
  async function renderJdServiceHistory(jobDoc) {
    const section = document.getElementById('jd-history-section');
    const listEl = document.getElementById('jd-history-list');
    if (!jobDoc.serialNumber) { section.style.display = 'none'; return; }
    try {
      const [sjSnap, crSnap] = await Promise.all([
        getDocs(query(collection(db, 'serviceJobs'), where('technicianUid', '==', currentUser.uid), where('serialNumber', '==', jobDoc.serialNumber))),
        getDocs(query(collection(db, 'centerRequests'), where('technicianUid', '==', currentUser.uid), where('serialNumber', '==', jobDoc.serialNumber))),
      ]);
      let history = [];
      sjSnap.forEach(d => { if (d.id !== jobDoc.id) history.push({ id: d.id, coll: 'serviceJobs', ...d.data() }); });
      crSnap.forEach(d => { if (d.id !== jobDoc.id) history.push({ id: d.id, coll: 'centerRequests', ...d.data() }); });
      if (history.length === 0) { section.style.display = 'none'; return; }
      history.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      section.style.display = '';
      listEl.innerHTML = history.map(h => {
        const dateStr = h.createdAt && h.createdAt.toDate ? h.createdAt.toDate().toLocaleDateString() : '—';
        return `<div style="font-size:12.5px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--hairline);">
          <div><b>${escapeHtml(h.jobId || h.requestId || h.id)}</b> — ${dateStr} — <span class="status-pill ${JOB_STATUS_PILL_CLASS[h.status] || ''}">${JOB_STATUS_LABELS[h.status] || h.status}</span></div>
          <div style="color:var(--stone);">${escapeHtml(h.issue || '—')}</div>
          ${h.closureCode ? `<div style="color:var(--stone);">Closure: ${escapeHtml(h.closureCode)}${h.actionTaken ? ' — ' + escapeHtml(h.actionTaken) : ''}</div>` : ''}
        </div>`;
      }).join('');
    } catch (err) {
      console.warn('Could not load service history:', err.message);
      section.style.display = 'none';
    }
  }

  // ---------------------------------------------------------------
  // Job popup photos — serial number plate, before/after repair
  // shots. Same idea as the older Diagnosis page's before/after
  // photos, but reachable from the popup for EITHER ticket type
  // (serviceJobs or centerRequests), and with a serial number photo

  // ---------------------------------------------------------------

  function jdPhotoStoragePrefix(jobDoc) {
    return jobDoc.coll === 'centerRequests'
      ? `centerRequests/${jobDoc.id}/attachments`
      : `serviceJobs/${jobDoc.id}/diagnosis`;
  }

  function renderJdPhotoThumbnails(gridEl, urls, jobDoc, field) {
    gridEl.innerHTML = '';
    (urls || []).forEach(url => {
      const thumb = document.createElement('div');
      thumb.style.cssText = 'position:relative;width:56px;height:56px;';
      thumb.innerHTML = `
        <img src="${url}" style="width:100%;height:100%;object-fit:cover;border-radius:2px;border:1px solid var(--hairline);">
        <button type="button" style="position:absolute;top:-6px;right:-6px;background:var(--err);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1;cursor:pointer;">&times;</button>`;
      thumb.querySelector('button').addEventListener('click', async () => {
        if (!confirm('Remove this photo?')) return;
        try {
          await updateDoc(doc(db, jobDoc.coll, jobDoc.id), { [field]: arrayRemove(url) });
          jobDoc[field] = (jobDoc[field] || []).filter(u => u !== url);
          thumb.remove();
        } catch (err) {
          console.error('Remove photo failed:', err);
          alert('Could not remove this photo. Check the console for details.');
        }
      });
      gridEl.appendChild(thumb);
    });
  }

  async function handleJdPhotoUpload(e, gridEl, errEl, jobDoc, subfolder, field) {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    errEl.classList.remove('show');
    for (const file of files) {
      if (!file.type.startsWith('image/')) continue;
      if (file.size > 10 * 1024 * 1024) {
        errEl.textContent = `"${file.name}" is over 10MB and was skipped.`;
        errEl.classList.add('show');
        continue;
      }
      const placeholder = document.createElement('div');
      placeholder.style.cssText = 'width:56px;height:56px;background:var(--paper-deep);border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--stone);';
      placeholder.textContent = 'Uploading…';
      gridEl.appendChild(placeholder);
      try {
        const filePath = `${jdPhotoStoragePrefix(jobDoc)}/${subfolder}/${Date.now()}_${file.name}`;
        const fileRef = storageRef(storage, filePath);
        await uploadBytes(fileRef, file);
        const url = await getDownloadURL(fileRef);
        await updateDoc(doc(db, jobDoc.coll, jobDoc.id), { [field]: arrayUnion(url) });
        jobDoc[field] = [...(jobDoc[field] || []), url];
        placeholder.remove();
        const thumb = document.createElement('div');
        thumb.style.cssText = 'position:relative;width:56px;height:56px;';
        thumb.innerHTML = `
          <img src="${url}" style="width:100%;height:100%;object-fit:cover;border-radius:2px;border:1px solid var(--hairline);">
          <button type="button" style="position:absolute;top:-6px;right:-6px;background:var(--err);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1;cursor:pointer;">&times;</button>`;
        thumb.querySelector('button').addEventListener('click', async () => {
          if (!confirm('Remove this photo?')) return;
          try {
            await updateDoc(doc(db, jobDoc.coll, jobDoc.id), { [field]: arrayRemove(url) });
            jobDoc[field] = (jobDoc[field] || []).filter(u => u !== url);
            thumb.remove();
          } catch (err) {
            console.error('Remove photo failed:', err);
            alert('Could not remove this photo. Check the console for details.');
          }
        });
        gridEl.appendChild(thumb);
      } catch (err) {
        console.error('Photo upload failed:', err);
        placeholder.remove();
        errEl.textContent = `Could not upload "${file.name}". Check console for details.`;
        errEl.classList.add('show');
      }
    }
  }

  function renderJdSerialPhoto(jobDoc) {
    const wrap = document.getElementById('jd-serial-photo-wrap');
    if (jobDoc.serialNumberPhoto) {
      wrap.innerHTML = `<div style="position:relative;width:56px;height:56px;">
        <img src="${jobDoc.serialNumberPhoto}" style="width:100%;height:100%;object-fit:cover;border-radius:2px;border:1px solid var(--hairline);">
        <button type="button" id="jd-serial-photo-remove" style="position:absolute;top:-6px;right:-6px;background:var(--err);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1;cursor:pointer;">&times;</button>
      </div>`;
      document.getElementById('jd-serial-photo-remove').addEventListener('click', async () => {
        if (!confirm('Remove the serial number photo?')) return;
        try {
          await updateDoc(doc(db, jobDoc.coll, jobDoc.id), { serialNumberPhoto: null, updatedAt: serverTimestamp() });
          jobDoc.serialNumberPhoto = null;

          console.error('Remove serial photo failed:', err);

  document.getElementById('jd-serial-photo-input').addEventListener('change', (e) => { if (jdJob) handleJdSerialPhotoUpload(e, jdJob); });
  document.getElementById('jd-before-photo-input').addEventListener('change', (e) => {
    if (jdJob) handleJdPhotoUpload(e, document.getElementById('jd-before-photo-grid'), document.getElementById('jd-photo-error'), jdJob, 'before', 'beforePhotos');
  });
  document.getElementById('jd-after-photo-input').addEventListener('change', (e) => {
    if (jdJob) handleJdPhotoUpload(e, document.getElementById('jd-after-photo-grid'), document.getElementById('jd-photo-error'), jdJob, 'after', 'afterPhotos');
  });

  // Renders the linked spare requests for the open ticket, with the
  // right action for each one's current stage — kept as its own
  // function (not inlined into openJobDetailModal) so Mark Received
  // and Consume can both re-render the list in place after acting,
  // without closing and reopening the whole popup.
  async function renderJdLinkedRequests(jobDoc) {
    const linkedEl = document.getElementById('jd-linked-requests');
    linkedEl.innerHTML = '<span style="font-size:12.5px;color:var(--stone);">Loading spare requests…</span>';
    try {
      const linkedSnap = await getDocs(query(collection(db, 'spareRequests'), where('sourceJobId', '==', jobDoc.id)));
      const linked = [];
      linkedSnap.forEach(ld => linked.push({ id: ld.id, ...ld.data() }));
      if (linked.length === 0) { linkedEl.innerHTML = ''; return; }
      linkedEl.innerHTML = linked.map(l => {
        let actionHtml = '';
        if ((l.status === 'dispatched' || l.status === 'intransit') && l.requestedByUid === currentUser.uid) {
          actionHtml = `<button type="button" class="btn-secondary jd-sr-receive-btn" data-id="${l.id}" style="font-size:11.5px;padding:3px 8px;margin-left:8px;">Mark Received</button>`;
        } else if ((l.status === 'received' || l.status === 'fulfilled_by_center') && !l.consumedAt) {
          actionHtml = `<button type="button" class="btn-secondary jd-sr-consume-btn" data-id="${l.id}" style="font-size:11.5px;padding:3px 8px;margin-left:8px;">Consume (mark installed)</button>`;
        } else if (l.consumedAt) {
          actionHtml = `<span style="font-size:11px;color:var(--stone);margin-left:8px;">Installed</span>`;
        }
        return `<div style="font-size:12.5px;margin-bottom:6px;display:flex;align-items:center;flex-wrap:wrap;">
          <span>${escapeHtml(l.item || '—')} × ${l.quantity ?? 1} — <span class="status-pill ${l.status}">${SPARE_REQ_STATUS_LABELS[l.status] || l.status}</span></span>
          ${actionHtml}
        </div>`;
      }).join('');
      linkedEl.querySelectorAll('.jd-sr-receive-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const l = linked.find(x => x.id === btn.dataset.id);
          if (l) markLinkedSpareReceived(l, jobDoc);
        });
      });
      linkedEl.querySelectorAll('.jd-sr-consume-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const l = linked.find(x => x.id === btn.dataset.id);
          if (l) consumeLinkedSpare(l, jobDoc);
        });
      });
    } catch (err) {
      console.warn('Could not load linked spare requests:', err.message);
      linkedEl.innerHTML = '';
    }
  }

  // Confirms physical receipt of a dispatched/in-transit spare — a
  // status-only step, not a second stock movement: Warehouse already
  // credited the technician's own Spare Bag the moment it dispatched
  // the part (same pattern as Service Center's own Mark Received,
  // just reachable from the job popup instead of a separate page).
  async function markLinkedSpareReceived(l, jobDoc) {
    if (!confirm('Mark this spare as received? Your Spare Bag already reflects this stock from when it was dispatched.')) return;
    try {
      await updateDoc(doc(db, 'spareRequests', l.id), {
        status: 'received', receivedAt: serverTimestamp(), updatedAt: serverTimestamp()
      });
      if (jobDoc.status === 'waiting_spare') {
        await updateDoc(doc(db, jobDoc.coll, jobDoc.id), { status: 'in_progress', updatedAt: serverTimestamp() });
        await logTicketStatus(jobDoc.coll, jobDoc.id, 'in_progress', `Spare received — ${l.requestId || l.id}`);
        jobDoc.status = 'in_progress';
      }
      await renderJdLinkedRequests(jobDoc);
      loadMyJobs();
    } catch (err) {
      console.error('Mark received failed:', err);
      alert(err.code === 'permission-denied' || /permission/i.test(err.message || '')
        ? 'Could not mark this as received — the Firestore rules for this may not be published yet.'
        : 'Could not mark this as received. Check console for details.');
    }
  }

  // Marks a received (or already center-fulfilled) spare as actually
  // installed — deducts it from the technician's own Spare Bag right
  // now, instead of only being able to log parts used at final job
  // closure.
  async function consumeLinkedSpare(l, jobDoc) {
    const qty = Number(l.quantity) || 1;
    if (!confirm(`Consume ${qty} × ${l.item || 'this part'} from your Spare Bag now?`)) return;
    const invRef = doc(db, 'inventory', `technician_${currentUser.uid}_${l.partId}`);
    try {
      await runTransaction(db, async (transaction) => {
        const snap = await transaction.get(invRef);
        const current = snap.exists() ? (snap.data().quantity || 0) : 0;
        if (current < qty) throw new Error(`Only ${current} of that part in your Spare Bag.`);
        transaction.set(invRef, {
          partId: l.partId, location: 'technician', technicianUid: currentUser.uid,
          quantity: current - qty, updatedAt: serverTimestamp()
        }, { merge: true });
      });
      await updateDoc(doc(db, 'spareRequests', l.id), {
        consumedAt: serverTimestamp(), consumedQty: qty, updatedAt: serverTimestamp()
      });
      await renderJdLinkedRequests(jobDoc);
    } catch (err) {
      console.error('Consume spare failed:', err);
      alert(err.message && err.message.includes('Spare Bag')
        ? err.message
        : 'Could not consume this part. Check console for details.');
    }
  }

  function closeJobDetailModal() {
    jdOverlay.classList.remove('show');
    jdJob = null;
  }

  document.getElementById('jd-close-btn').addEventListener('click', closeJobDetailModal);
  jdOverlay.addEventListener('click', (e) => { if (e.target === jdOverlay) closeJobDetailModal(); });

  // Cached lookup of the technician's own service center (the center
  // that linked this technician account to its roster) — undefined
  // means "not looked up yet", null means "not linked to any center".
  let cachedLinkedCenterUid;
  // Warranty check used by job closure's automatic billing — mirrors
  // the same logic used on the Service Center side, matching the
  // specific part(s) just replaced against the product's per-
  // component warranty terms before falling back to its overall
  // warranty, then to the ticket's own captured purchase date.
  function computeWarrantyStatusTech(purchaseDate, warrantyMonths) {
    if (!purchaseDate) return { inWarranty: null };
    const purchase = new Date(purchaseDate);
    const expiry = new Date(purchase);
    expiry.setMonth(expiry.getMonth() + (warrantyMonths || 12));
    return { inWarranty: expiry >= new Date() };
  }

  async function getJobWarrantyInfo(jobData, partNames) {
    let reg = null;
    if (jobData.serialNumber) {
      try {
        const snap = await getDocs(query(collection(db, 'productRegistrations'), where('serialNumber', '==', jobData.serialNumber)));
        if (!snap.empty) reg = snap.docs[0].data();
      } catch (err) {
        console.warn('Warranty lookup by serial failed:', err.message);
      }
    }
    if (reg && Array.isArray(reg.warrantyComponents) && reg.warrantyComponents.length && partNames && partNames.length) {
      for (const partName of partNames) {
        const pn = partName.toLowerCase();
        const comp = reg.warrantyComponents.find(c => c.componentName &&
          (c.componentName.toLowerCase().includes(pn) || pn.includes(c.componentName.toLowerCase())));
        if (comp) return computeWarrantyStatusTech(reg.purchaseDate, (comp.durationYears || 0) * 12);
      }
    }
    if (reg) return computeWarrantyStatusTech(reg.purchaseDate, reg.warrantyMonths);
    if (jobData.purchaseDate) return computeWarrantyStatusTech(jobData.purchaseDate, 12);
    return { inWarranty: null };
  }

  // Looks up the warranty service-charge rate CARD — never a number
  // this technician sets themselves. Keyed by product category +
  // service type (installation, or repair for everything else). A
  // service center's own override for that combo wins; otherwise
  // falls back to Head Office's default for it; otherwise 0 (no
  // credit — the rate simply hasn't been set up yet for that combo).
  function rateCardKey(scope, centerUid, category, rateType, bucket) {
    const safeCat = (category || 'other').toLowerCase().replace(/[^a-z0-9]+/g, '_');
    const safeBucket = (bucket || 'flat').toLowerCase().replace(/[^a-z0-9]+/g, '_');
    return scope === 'center' ? `center_${centerUid}_${safeCat}_${rateType}_${safeBucket}` : `default_${safeCat}_${rateType}_${safeBucket}`;
  }

  async function resolveServiceChargeRate(jobData, centerUid) {
    const rateType = jobData.type === 'installation' ? 'installation' : 'repair';
    const category = jobData.category || 'Other';
    const bucket = jobData.sizeBucket || null;
    try {
      if (centerUid) {
        const centerRateSnap = await getDoc(doc(db, 'serviceChargeRates', rateCardKey('center', centerUid, category, rateType, bucket)));
        if (centerRateSnap.exists()) return Number(centerRateSnap.data().amount) || 0;
      }
      const defaultRateSnap = await getDoc(doc(db, 'serviceChargeRates', rateCardKey('default', null, category, rateType, bucket)));
      if (defaultRateSnap.exists()) return Number(defaultRateSnap.data().amount) || 0;
      // Fall back to the flat (no-bucket) rate row in case this
      // ticket predates size/model bundles being set up for its
      // category, or the category has since had its bundles removed.
      if (bucket) {
        if (centerUid) {
          const centerFlatSnap = await getDoc(doc(db, 'serviceChargeRates', rateCardKey('center', centerUid, category, rateType, null)));
          if (centerFlatSnap.exists()) return Number(centerFlatSnap.data().amount) || 0;
        }
        const defaultFlatSnap = await getDoc(doc(db, 'serviceChargeRates', rateCardKey('default', null, category, rateType, null)));
        if (defaultFlatSnap.exists()) return Number(defaultFlatSnap.data().amount) || 0;
      }
    } catch (err) {
      console.warn('Could not resolve service charge rate:', err.message);
    }
    return 0;
  }

  async function getLinkedServiceCenterUid() {
    if (cachedLinkedCenterUid !== undefined) return cachedLinkedCenterUid;
    try {
      const snap = await getDoc(doc(db, 'users', currentUser.uid));
      cachedLinkedCenterUid = snap.exists() ? (snap.data().linkedServiceCenterUid || null) : null;
    } catch (err) {
      console.warn('Could not resolve linked service center:', err.message);
      cachedLinkedCenterUid = null;
    }
    return cachedLinkedCenterUid;
  }

  document.getElementById('jd-spare-request-btn').addEventListener('click', async () => {
    if (!jdJob) return;
    const btn = document.getElementById('jd-spare-request-btn');
    const errEl = document.getElementById('jd-spare-error');
    errEl.classList.remove('show');
    const select = document.getElementById('jd-spare-part');
    const partId = select.value;
    const partName = select.selectedOptions[0]?.dataset.name || '';
    const qty = Number(document.getElementById('jd-spare-qty').value) || 1;
    if (!partId) {
      errEl.textContent = 'Select a part first.';
      errEl.classList.add('show');
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Requesting…';
    try {
      const jobLabel = jdJob.jobId || jdJob.requestId || jdJob.id;

      // A roster technician's request is filled from their OWN service
      // center's shelf first, if the center already has enough — no
      // reason to wait on Head Office for stock that's already in the
      // building. Only when the center can't cover it does this become
      // a real spareRequests ticket that Warehouse/Super Admin can see
      // and fulfill centrally (same as before this change).
      const centerUid = jdJob.serviceCenterUid || await getLinkedServiceCenterUid();
      let fulfilledLocally = false;
      if (centerUid) {
        const centerInvRef = doc(db, 'inventory', `servicecenter_${centerUid}_${partId}`);
        const centerSnap = await getDoc(centerInvRef);
        const centerQty = centerSnap.exists() ? (centerSnap.data().quantity || 0) : 0;
        if (centerQty >= qty) {
          const techInvRef = doc(db, 'inventory', `technician_${currentUser.uid}_${partId}`);
          await runTransaction(db, async (transaction) => {
            const centerNow = await transaction.get(centerInvRef);
            const techNow = await transaction.get(techInvRef);
            const centerCurrent = centerNow.exists() ? (centerNow.data().quantity || 0) : 0;
            if (centerCurrent < qty) throw new Error('Stock at the center changed just now — try again.');
            const techCurrent = techNow.exists() ? (techNow.data().quantity || 0) : 0;
            transaction.set(centerInvRef, {
              partId, location: 'servicecenter', serviceCenterUid: centerUid,
              quantity: centerCurrent - qty, updatedAt: serverTimestamp(), lastSourceJobId: jdJob.id
            }, { merge: true });
            transaction.set(techInvRef, {
              partId, location: 'technician', technicianUid: currentUser.uid,
              quantity: techCurrent + qty, updatedAt: serverTimestamp(), lastSourceJobId: jdJob.id
            }, { merge: true });
          });
          await addDoc(collection(db, 'stockMovements'), {
            partId, type: 'transfer', location: 'servicecenter', serviceCenterUid: centerUid,
            technicianUid: currentUser.uid, quantity: qty,
            reason: `Issued to ${currentUser.email} — ${jobLabel}`,
            createdAt: serverTimestamp()
          });
          const requestId = await generateSpareRequestId();
          await addDoc(collection(db, 'spareRequests'), {
            requestId,
            serviceCenter: currentUser.email,
            item: partName,
            partId,
            quantity: qty,
            priority: 'normal',
            notes: `Issued from the service center's own stock — ${jobLabel}`,
            sourceJobId: jdJob.id,
            sourceJobLabel: `${jobLabel} — ${jdJob.customerName || 'customer'} (${jdJob.product || jdJob.modelNo || 'product'})`,
            sourceJobCollection: jdJob.coll,
            requestedByUid: currentUser.uid,
            status: 'fulfilled_by_center',
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });
          fulfilledLocally = true;
        }
      }

      if (!fulfilledLocally) {
        const requestId = await generateSpareRequestId();
        await addDoc(collection(db, 'spareRequests'), {
          requestId,
          serviceCenter: currentUser.email,
          item: partName,
          partId,
          quantity: qty,
          priority: 'normal',
          notes: `Requested from job — ${jobLabel}`,
          sourceJobId: jdJob.id,
          sourceJobLabel: `${jobLabel} — ${jdJob.customerName || 'customer'} (${jdJob.product || jdJob.modelNo || 'product'})`,
          sourceJobCollection: jdJob.coll,
          requestedByUid: currentUser.uid,
          status: 'new',
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });
        // Same link between a spare request and the job's own state
        // machine as the Diagnosis page uses — the job moves to
        // Waiting for Spare so it's visibly blocked until it arrives.
        await updateDoc(doc(db, jdJob.coll, jdJob.id), { status: 'waiting_spare', updatedAt: serverTimestamp() });
        await logTicketStatus(jdJob.coll, jdJob.id, 'waiting_spare', `Spare requested — ${requestId}`);
      }

      btn.textContent = fulfilledLocally ? 'Issued from center stock' : 'Requested';
      loadMyJobs();
      setTimeout(closeJobDetailModal, 900);
    } catch (err) {
      console.error('Request spare failed:', err);
      errEl.textContent = err.message && err.message.includes('try again')
        ? err.message
        : 'Could not request this part. Check console for details.';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Request Spare';
    }
  });

  // Closure requires real evidence — closure code, what was done, and
  // parts used — before a job can move to Completed. Previously this
  // was a single click with nothing recorded, so a completed job had
  // no proof of what actually happened during the visit.
  const closureOverlay = document.getElementById('closure-overlay');
  const closureForm = document.getElementById('closure-form');
  const closureError = document.getElementById('closure-error');
  const closureSuccess = document.getElementById('closure-success');
  const closureSubmitBtn = document.getElementById('submit-closure');
  let closureJobColl = 'serviceJobs';

  async function populatePartSelect(selectEl) {
    selectEl.innerHTML = '<option value="">— Select part —</option>';
    try {
      const parts = await getSparePartsListCache();
      parts.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.dataset.name = p.name;
        opt.textContent = `${p.partCode} — ${p.name}`;
        selectEl.appendChild(opt);
      });

  async function generateReturnId() {
    const d = new Date();
    const monthKey = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}`;
    const counterRef = doc(db, 'counters', `return-${monthKey}`);
    const next = await runTransaction(db, async (transaction) => {
      const snap = await transaction.get(counterRef);
      const n = (snap.exists() ? snap.data().value : 0) + 1;
      if (snap.exists()) transaction.update(counterRef, { value: n });
      else transaction.set(counterRef, { value: n });
      return n;
    });
    const dateStr = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    return `PE-RT-${dateStr}-${String(next).padStart(4, '0')}-Technician`;
  }

  async function openClosureModal(jobDoc) {
    closureForm.reset();
    closureError.classList.remove('show');
    closureSuccess.classList.remove('show');
    closureSubmitBtn.disabled = false;
    closureSubmitBtn.textContent = 'Mark Complete';
    closureJobColl = jobDoc.coll || 'serviceJobs';
    document.getElementById('closure-job-id').value = jobDoc.id;
    document.getElementById('closure-job-label').textContent = `${jobDoc.jobId || jobDoc.requestId || jobDoc.id} — ${jobDoc.customerName || 'customer'}`;
    const linkedEl = document.getElementById('closure-linked-parts');
    linkedEl.textContent = 'Checking linked spare requests…';
    await Promise.all([
      populatePartSelect(document.getElementById('closure-part-1')),
      populatePartSelect(document.getElementById('closure-part-2')),
      populatePartSelect(document.getElementById('closure-part-3')),
    ]);
    try {
      const snap = await getDocs(query(collection(db, 'spareRequests'), where('sourceJobId', '==', jobDoc.id)));
      if (snap.empty) {
        linkedEl.textContent = 'No spare parts were requested through the system for this job.';
      } else {
        const items = [];
        snap.forEach(d => items.push(`${escapeHtml(d.data().item)} (${d.data().status})`));
        linkedEl.textContent = `Requested through the system: ${items.join(', ')}`;
      }
    } catch (err) {
      linkedEl.textContent = '';
    }
    closureOverlay.classList.add('show');

  function closeClosureModal() { closureOverlay.classList.remove('show'); }
  document.getElementById('cancel-closure').addEventListener('click', closeClosureModal);
  closureOverlay.addEventListener('click', (e) => { if (e.target === closureOverlay) closeClosureModal(); });

  closureForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    closureError.classList.remove('show');
    closureSuccess.classList.remove('show');
    const jobId = document.getElementById('closure-job-id').value;
    const closureCode = document.getElementById('closure-code').value;
    const notes = document.getElementById('closure-notes').value.trim();
    const partsNotes = document.getElementById('closure-parts-notes').value.trim();
    if (!closureCode || !notes || !partsNotes) {
      closureError.textContent = 'Closure code, action taken, and parts used are all required — type "None" if no parts were used.';
      closureError.classList.add('show');
      return;
    }
    // Up to 3 part+qty lines: each one consumes that quantity from this
    // technician's own Spare Bag and logs the same quantity into Head
    // Office's Returns queue as "defective" — the old part that came
    // out of the appliance — same behavior as Service Center's own
    // closure form, just against the technician's own stock instead.
    const partLines = [1, 2, 3].map(i => ({
      partId: document.getElementById(`closure-part-${i}`).value,
      qty: Number(document.getElementById(`closure-partqty-${i}`).value) || 0
    })).filter(l => l.partId && l.qty > 0);

    closureSubmitBtn.disabled = true;
    closureSubmitBtn.textContent = 'Saving…';
    try {
      const jobSnapForReturn = await getDoc(doc(db, closureJobColl, jobId));
      const jobData = jobSnapForReturn.exists() ? jobSnapForReturn.data() : {};
      const jobRequestId = jobData.jobId || jobData.requestId || jobId;
      const partsCatalog = partLines.length ? await getSparePartsListCache() : [];
      const partNamesUsed = partLines
        .map(l => (partsCatalog.find(p => p.id === l.partId) || {}).name)
        .filter(Boolean);

      if (partLines.length) {
        for (const line of partLines) {
          const invRef = doc(db, 'inventory', `technician_${currentUser.uid}_${line.partId}`);
          await runTransaction(db, async (transaction) => {
            const snap = await transaction.get(invRef);
            const current = snap.exists() ? (snap.data().quantity || 0) : 0;
            if (current < line.qty) throw new Error(`Only ${current} of that part in your Spare Bag — reduce the quantity or add stock first.`);
            transaction.set(invRef, {
              partId: line.partId, location: 'technician', technicianUid: currentUser.uid,
              quantity: current - line.qty, updatedAt: serverTimestamp()
            }, { merge: true });
          });
        }
        // A technician's defective part is handed back to their OWN
        // service center first, exactly like a center sends its own
        // returns on to Head Office — it doesn't skip straight to
        // Warehouse's queue. Only a technician with no center at all
        // (not linked to one, ticket has no serviceCenterUid) falls
        // back to going straight to Warehouse, since there's no
        // center to route it through.
        const returnCenterUid = jobData.serviceCenterUid || await getLinkedServiceCenterUid();
        for (const line of partLines) {
          const returnId = await generateReturnId();
          await addDoc(collection(db, 'returns'), {
            returnId,
            partId: line.partId,
            quantity: line.qty,
            source: `Technician - ${currentUser.email}`,
            technicianUid: currentUser.uid,
            ...(returnCenterUid ? { serviceCenterUid: returnCenterUid } : {}),
            reason: `Replaced during job closure — ${jobRequestId}`,
            sourceJobId: jobId,
            // With no service center to route through, this goes
            // straight into Head Office's queue as 'requested' — never
            // 'defective' directly. Only Head Office can mark a part
            // actually received/inspected once it's physically there.
            status: returnCenterUid ? 'sent_to_center' : 'requested',
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });
        }
      }
      await updateDoc(doc(db, closureJobColl, jobId), {
        status: 'completed',
        closureCode,
        actionTaken: notes,
        partsUsedNotes: partsNotes,
        closedByUid: currentUser.uid,
        closedAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      await logTicketStatus(closureJobColl, jobId, 'completed', `Closure code: ${closureCode}`);

      // Warranty-aware auto billing: check warranty against the exact
      // part(s) just replaced first (per-component cover can outlast
      // the appliance's own overall warranty), falling back to the
      // product's overall warranty. If in-warranty, the rate CARD's
      // amount for this job's product category + service type is
      // credited straight to this technician's wallet — never a
      // number the technician sets themselves. A center-managed
      // ticket is also flagged ready for the center to claim its own
      // spare/other-cost portion.
      try {
        const warrantyInfo = await getJobWarrantyInfo(jobData, partNamesUsed);
        if (warrantyInfo.inWarranty === true) {
          const centerUidForRate = jobData.serviceCenterUid || await getLinkedServiceCenterUid();
          const rate = await resolveServiceChargeRate(jobData, centerUidForRate);
          const jobBillingUpdate = { warrantyStatus: 'in_warranty', updatedAt: serverTimestamp() };
          if (rate > 0) {
            jobBillingUpdate.serviceCharge = rate;
            await addDoc(collection(db, 'walletTransactions'), {
              technicianUid: currentUser.uid,
              amount: rate,
              type: 'service_charge_credit',
              sourceJobId: jobId,
              sourceJobCollection: closureJobColl,
              sourceJobLabel: jobRequestId,
              serialNumber: jobData.serialNumber || null,
              status: 'unclaimed',
              createdAt: serverTimestamp(),
              updatedAt: serverTimestamp()
            });
            if (closureJobColl === 'centerRequests') {
              jobBillingUpdate.billingType = 'claim';
              jobBillingUpdate.billingStatus = 'ready_to_claim';
              jobBillingUpdate.billingTotal = 0;
              jobBillingUpdate.billedAt = serverTimestamp();
            }
          }
          await updateDoc(doc(db, closureJobColl, jobId), jobBillingUpdate);
        } else if (warrantyInfo.inWarranty === false) {
          await updateDoc(doc(db, closureJobColl, jobId), { warrantyStatus: 'out_of_warranty', updatedAt: serverTimestamp() });
        }
      } catch (warrantyErr) {
        console.warn('Automatic warranty billing failed (non-blocking):', warrantyErr.message);
      }
      // Re-sync the public mirror now that warrantyStatus is settled —
      // the earlier logTicketStatus() sync above ran before this block
      // and would have missed it.
      await syncPublicTicketMirror(closureJobColl, jobId, 'completed');

      closureSuccess.textContent = 'Completed.';
      closureSuccess.classList.add('show');
      closureSubmitBtn.textContent = 'Done';
      loadMyJobs();
      setTimeout(closeClosureModal, 800);
    } catch (err) {
      console.error('Close job failed:', err);
      closureError.textContent = err.message && err.message.includes('Spare Bag')
        ? err.message
        : 'Could not complete this job. Check the console for details.';
      closureError.classList.add('show');
      closureSubmitBtn.disabled = false;
      closureSubmitBtn.textContent = 'Mark Complete';
    }
  });

  async function renderAvailability() {

        <div class="panel-header"><h2>Your availability</h2></div>

  async function loadAvailability() {
    if (!currentUser) return;
    try {
      const snap = await getDoc(doc(db, 'technicianAvailability', currentUser.uid));
      const data = snap.exists() ? snap.data() : {};
      const current = data.status || null;
      const suspended = data.suspended === true;
      const currentOpt = AVAILABILITY_OPTIONS.find(o => o.value === current);
      if (suspended) {
        document.getElementById('availability-current').innerHTML =
          `<span class="status-pill cancelled">Suspended</span> — contact your Service Center or Warehouse. You can't change your own status while suspended.`;
      } else {
        document.getElementById('availability-current').innerHTML = current
          ? `Current status: <span class="status-pill ${currentOpt ? currentOpt.pillClass : 'cancelled'}">${currentOpt ? currentOpt.label : current}</span>`
          : 'You haven\'t set your availability yet.';
      }
      document.querySelectorAll('#availability-options button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.value === current);
        btn.disabled = suspended;
        btn.style.opacity = suspended ? '0.5' : '1';
        btn.style.cursor = suspended ? 'not-allowed' : 'pointer';
      });
    } catch (err) {
      console.error('Load availability failed:', err);
    }
  }

  async function setAvailability(status) {
    if (!currentUser) return;
    try {
      const existing = await getDoc(doc(db, 'technicianAvailability', currentUser.uid));
      if (existing.exists() && existing.data().suspended === true) {
        alert('Your account is suspended — you can\'t change your own status. Contact your Service Center or Warehouse.');
        return;
      }
      await setDoc(doc(db, 'technicianAvailability', currentUser.uid), {
        status, technicianEmail: currentUser.email, updatedAt: serverTimestamp()
