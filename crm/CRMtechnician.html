    } catch (err) {
      console.error('Set availability failed:', err);
      alert('Could not update availability. Check the console for details.');
    }
  }

  let sparePartsListCache = null;
  async function getSparePartsListCache() {
    if (sparePartsListCache) return sparePartsListCache;
    const snap = await getDocs(collection(db, 'spareParts'));
    sparePartsListCache = [];
    snap.forEach(d => sparePartsListCache.push({ id: d.id, ...d.data() }));
    return sparePartsListCache;
  }

  // The real Category Master (productCategories, set up under Super
  // Admin's Categories) — same source of truth as product
  // registration and the Warehouse/Service Center rate cards, not a
  // hardcoded guess list. Categories are stored per brand, but a
  // repair/installation rate doesn't care which brand a "Geyser" is,
  // so this just dedupes by name across every brand.
  let categoryMetaCache = null;
  async function getCategoryMetaCache() {
    if (categoryMetaCache) return categoryMetaCache;
    categoryMetaCache = new Map();
    try {
      const snap = await getDocs(collection(db, 'productCategories'));
      snap.forEach(d => {
        const data = d.data();
        if (data.status === 'inactive' || !data.name) return;
        const name = data.name.trim();
        const existing = categoryMetaCache.get(name) || { needsService: false, needsInstallation: false, sizeBuckets: [] };
        existing.needsService = existing.needsService || data.needsService !== false;
        existing.needsInstallation = existing.needsInstallation || data.needsInstallation !== false;
        (data.sizeBuckets || []).forEach(b => { if (b && !existing.sizeBuckets.includes(b)) existing.sizeBuckets.push(b); });
        categoryMetaCache.set(name, existing);
      });
    } catch (err) {
      console.warn('Could not load product categories:', err.message);
    }
    return categoryMetaCache;
  }
  async function getActiveCategoryNamesCache() {
    const meta = await getCategoryMetaCache();
    return Array.from(meta.keys()).sort((a, b) => a.localeCompare(b));
  }
  async function populateCategorySelect(selectEl) {
    const names = await getActiveCategoryNamesCache();
    selectEl.innerHTML = (names.length ? names.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('')
      : '<option value="">No categories set up yet</option>') + '<option value="Other">Other</option>';
  }
  async function populateSizeBucketSelect(selectEl, category) {
    const meta = await getCategoryMetaCache();
    const entry = meta.get(category);
    const buckets = (entry && entry.sizeBuckets) || [];
    if (!buckets.length) {
      selectEl.innerHTML = '<option value="">N/A</option>';
      return false;
    }
    selectEl.innerHTML = '<option value="">Select size / model</option>' +
      buckets.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join('');
    return true;
  }

  function renderPhotoThumbnails(gridEl, urls, jobId, field) {
    gridEl.innerHTML = '';
    urls.forEach(url => {
      const thumb = document.createElement('div');

      thumb.innerHTML = `
        <img src="${url}" style="width:100%;height:100%;object-fit:cover;border-radius:2px;border:1px solid var(--hairline);">
        <button type="button" style="position:absolute;top:-6px;right:-6px;background:var(--err);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1;cursor:pointer;">&times;</button>`;
      thumb.querySelector('button').addEventListener('click', async () => {

        try {
          await updateDoc(doc(db, 'serviceJobs', jobId), { [field]: arrayRemove(url) });
          thumb.remove();
        } catch (err) {
          console.error('Remove photo failed:', err);
          alert('Could not remove this photo. Check the console for details.');
        }
      });
      gridEl.appendChild(thumb);

  async function handlePhotoUpload(e, card, jobId, subfolder, field) {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    const gridEl = card.querySelector(subfolder === 'before' ? '.before-photo-grid' : '.after-photo-grid');
    const errEl = card.querySelector('.modal-error');
    errEl.classList.remove('show');
    for (const file of files) {
      if (!file.type.startsWith('image/')) continue;
      if (file.size > 10 * 1024 * 1024) {
        errEl.textContent = `"${file.name}" is over 10MB and was skipped.`;
        errEl.classList.add('show');
        continue;
      }
      const placeholder = document.createElement('div');
      placeholder.style.cssText = 'width:64px;height:64px;background:var(--paper-deep);border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--stone);';
      placeholder.textContent = 'Uploading…';
      gridEl.appendChild(placeholder);
      try {
        const filePath = `serviceJobs/${jobId}/diagnosis/${subfolder}/${Date.now()}_${file.name}`;
        const fileRef = storageRef(storage, filePath);
        await uploadBytes(fileRef, file);
        const url = await getDownloadURL(fileRef);
        await updateDoc(doc(db, 'serviceJobs', jobId), { [field]: arrayUnion(url) });
        placeholder.remove();
        const thumb = document.createElement('div');
        thumb.style.cssText = 'position:relative;width:64px;height:64px;';
        thumb.innerHTML = `
          <img src="${url}" style="width:100%;height:100%;object-fit:cover;border-radius:2px;border:1px solid var(--hairline);">
          <button type="button" style="position:absolute;top:-6px;right:-6px;background:var(--err);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1;cursor:pointer;">&times;</button>`;
        thumb.querySelector('button').addEventListener('click', async () => {
          if (!confirm('Remove this photo?')) return;
          try {
            await updateDoc(doc(db, 'serviceJobs', jobId), { [field]: arrayRemove(url) });
            thumb.remove();
          } catch (err) {
            console.error('Remove photo failed:', err);
            alert('Could not remove this photo. Check the console for details.');
          }
        });
        gridEl.appendChild(thumb);
      } catch (err) {
        console.error('Upload photo failed:', err);
        placeholder.textContent = 'Failed';
        errEl.textContent = `Could not upload "${file.name}". Check console for details.`;
        errEl.classList.add('show');
      }
    }
    e.target.value = '';
  }

  function openBagModal() {
    bagForm.reset();
    bagError.classList.remove('show');
    bagSuccess.classList.remove('show');
    bagSubmitBtn.disabled = false;
    bagSubmitBtn.textContent = 'Save';

  function closeBagModal() { bagOverlay.classList.remove('show'); }

  bagForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    bagError.classList.remove('show');
    bagSuccess.classList.remove('show');
    if (!bagPartSelect.value || !currentUser) {
      bagError.textContent = 'Select a part.';
      bagError.classList.add('show');
      return;
    }
    const partId = bagPartSelect.value;
    const type = document.getElementById('bag-type').value;
    const qty = Number(document.getElementById('bag-qty').value) || 0;
    if (qty <= 0) {
      bagError.textContent = 'Enter a quantity greater than 0.';
      bagError.classList.add('show');
      return;
    }
    bagSubmitBtn.disabled = true;
    bagSubmitBtn.textContent = 'Saving…';
    const invRef = doc(db, 'inventory', `technician_${currentUser.uid}_${partId}`);
    try {
      await runTransaction(db, async (transaction) => {
        const snap = await transaction.get(invRef);
        const current = snap.exists() ? (snap.data().quantity || 0) : 0;
        const delta = type === 'add' ? qty : -qty;
        const next = Math.max(0, current + delta);
        transaction.set(invRef, {
          partId, location: 'technician', technicianUid: currentUser.uid, quantity: next, updatedAt: serverTimestamp()
        }, { merge: true });
      });
      await addDoc(collection(db, 'stockMovements'), {
        partId, type: type === 'add' ? 'receive' : 'issue', location: 'technician',
        technicianUid: currentUser.uid, quantity: qty,
        reason: document.getElementById('bag-notes').value.trim(),
        createdAt: serverTimestamp()
      });
      bagSuccess.textContent = 'Spare bag updated.';
      bagSuccess.classList.add('show');
      bagSubmitBtn.disabled = false;
      bagSubmitBtn.textContent = 'Save';
      if (document.getElementById('bag-tbody')) loadSpareBag();
      setTimeout(closeBagModal, 800);
    } catch (err) {
      console.error('Update spare bag failed:', err);
      bagError.textContent = 'Could not update spare bag. Check console for details.';
      bagError.classList.add('show');
      bagSubmitBtn.disabled = false;
      bagSubmitBtn.textContent = 'Save';

  // ---------------------------------------------------------------
  // Claims — a technician's own reimbursement claims. Writes into
  // the SAME `claims` collection Head Office's Claims module reads,
  // tagged claimantType: 'technician' and scoped by claimantUid.
  // ---------------------------------------------------------------

  const CLAIM_STATUS_LABELS_T = { submitted: 'Submitted', verified: 'Verified', settled: 'Settled', rejected: 'Rejected' };

  async function generateClaimId() {
    const d = new Date();
    const monthKey = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}`;
    const counterRef = doc(db, 'counters', `claim-${monthKey}`);
    const next = await runTransaction(db, async (transaction) => {
      const snap = await transaction.get(counterRef);
      const n = (snap.exists() ? snap.data().value : 0) + 1;
      if (snap.exists()) transaction.update(counterRef, { value: n });
      else transaction.set(counterRef, { value: n });
      return n;
    });
    const dateStr = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    return `PE-CL-${dateStr}-${String(next).padStart(4, '0')}-Technician`;
  }

  let walletTxnCache = [];

  function updateWalletClaimBtn() {
    const anyChecked = !!document.querySelector('.wallet-select-cb:checked');
    const btn = document.getElementById('submit-wallet-claim');
    if (btn) btn.disabled = !anyChecked;
  }

  async function loadWallet() {
    const tbody = document.getElementById('wallet-tbody');
    if (!currentUser) return;
    try {
      const snap = await getDocs(query(collection(db, 'walletTransactions'),
        where('technicianUid', '==', currentUser.uid), where('status', '==', 'unclaimed')));
      const docs = [];
      snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
      docs.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      walletTxnCache = docs;
      const total = docs.reduce((sum, d) => sum + (d.amount || 0), 0);
      document.getElementById('wallet-unclaimed-total').textContent = `₹${total}`;
      tbody.innerHTML = docs.length === 0 ? `<tr><td colspan="5" class="empty-row">Nothing unclaimed right now.</td></tr>` : '';
      docs.forEach(d => {
        const dateStr = d.createdAt && d.createdAt.toDate ? d.createdAt.toDate().toLocaleDateString() : '—';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><input type="checkbox" class="wallet-select-cb" data-id="${d.id}"></td>
          <td style="font-size:12px;color:var(--stone);">${d.sourceJobLabel || d.sourceJobId || '—'}</td>
          <td>${d.serialNumber || '—'}</td>
          <td>₹${d.amount ?? 0}</td>
          <td>${dateStr}</td>`;
        tbody.appendChild(tr);
      });
      tbody.querySelectorAll('.wallet-select-cb').forEach(cb => cb.addEventListener('change', updateWalletClaimBtn));
      updateWalletClaimBtn();
    } catch (err) {
      console.error('Load wallet failed:', err);
      tbody.innerHTML = `<tr><td colspan="5" class="empty-row" style="color:var(--err);">Couldn't load your wallet. Check console for details.</td></tr>`;
    }
  }

  async function submitWalletClaim() {
    const selected = Array.from(document.querySelectorAll('.wallet-select-cb:checked')).map(cb => cb.dataset.id);
    if (selected.length === 0 || !currentUser) return;
    const btn = document.getElementById('submit-wallet-claim');
    btn.disabled = true;
    btn.textContent = 'Submitting…';
    try {
      const txns = walletTxnCache.filter(t => selected.includes(t.id));
      const lineItems = txns.map(t => ({
        sourceJobId: t.sourceJobId,
        sourceJobCollection: t.sourceJobCollection,
        sourceJobLabel: t.sourceJobLabel,
        serialNumber: t.serialNumber || null,
        total: t.amount || 0
      }));
      const amount = lineItems.reduce((sum, li) => sum + li.total, 0);
      const claimId = await generateClaimId();
      await addDoc(collection(db, 'claims'), {
        claimId,
        claimantType: 'technician',
        claimantUid: currentUser.uid,
        claimantName: currentUser.email,
        description: `Warranty service-charge claim — ${txns.length} job${txns.length > 1 ? 's' : ''} (${txns.map(t => t.sourceJobLabel || t.sourceJobId).join(', ')})`,
        amount,
        lineItems,
        walletTxnIds: selected,
        notes: '',
        status: 'submitted',
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      await Promise.all(txns.map(t => updateDoc(doc(db, 'walletTransactions', t.id), {
        status: 'claimed',
        claimId,
        updatedAt: serverTimestamp()
      })));
      try {
        await addDoc(collection(db, 'notifications'), {
          recipientType: 'role', recipientValue: 'warehouse',
          title: 'New claim submitted', message: `Technician ${currentUser.email} — ₹${amount} across ${txns.length} job(s) (${claimId})`,
          read: false, createdAt: serverTimestamp()
        });
      } catch (notifErr) {
        console.warn('Notification write failed (non-blocking):', notifErr.message);
      }
      alert(`Claim submitted — ${claimId}`);
      loadWallet();
      if (document.getElementById('tclaims-tbody')) loadTechnicianClaims();
    } catch (err) {
      console.error('Submit wallet claim failed:', err);
      alert('Could not submit claim. Check console for details.');
    }
    btn.textContent = 'Submit selected as claim';
    updateWalletClaimBtn();
  }

  async function loadTechnicianClaims() {

          <td>${d.description || '—'}</td>
          <td>₹${d.amount ?? '—'}</td>
          <td><span class="status-pill ${pillClass}">${CLAIM_STATUS_LABELS_T[d.status] || d.status}</span></td>`;
        tbody.appendChild(tr);
      });
    } catch (err) {
      console.error('Load claims failed:', err);
      tbody.innerHTML = `<tr><td colspan="4" class="empty-row" style="color:var(--err);">Couldn't load claims. Check console for details.</td></tr>`;
    }
  }

  const tclaimOverlay = document.getElementById('tclaim-overlay');
  const tclaimForm = document.getElementById('tclaim-form');
  const tclaimError = document.getElementById('tclaim-error');
  const tclaimSuccess = document.getElementById('tclaim-success');
  const tclaimSubmitBtn = document.getElementById('submit-tclaim');

  function openTClaimModal() {
    tclaimForm.reset();
    tclaimError.classList.remove('show');
    tclaimSuccess.classList.remove('show');
    tclaimSubmitBtn.disabled = false;
    tclaimSubmitBtn.textContent = 'Submit claim';
    tclaimOverlay.classList.add('show');
  }
  function closeTClaimModal() { tclaimOverlay.classList.remove('show'); }
  document.getElementById('cancel-tclaim').addEventListener('click', closeTClaimModal);
  tclaimOverlay.addEventListener('click', (e) => { if (e.target === tclaimOverlay) closeTClaimModal(); });

  tclaimForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    tclaimError.classList.remove('show');
    tclaimSuccess.classList.remove('show');
    if (!currentUser) return;
    tclaimSubmitBtn.disabled = true;
    tclaimSubmitBtn.textContent = 'Submitting…';
    try {
      const claimId = await generateClaimId();
      await addDoc(collection(db, 'claims'), {
        claimId,
        claimantType: 'technician',
        claimantUid: currentUser.uid,
        claimantName: currentUser.email,
        description: document.getElementById('tclaim-description').value.trim(),
        amount: Number(document.getElementById('tclaim-amount').value) || 0,
        notes: document.getElementById('tclaim-notes').value.trim(),
        status: 'submitted',
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      try {
        await addDoc(collection(db, 'notifications'), {
          recipientType: 'role', recipientValue: 'warehouse',
          title: 'New claim submitted', message: `Technician ${currentUser.email} — ₹${document.getElementById('tclaim-amount').value} (${claimId})`,
          read: false, createdAt: serverTimestamp()
        });
      } catch (notifErr) {
        console.warn('Notification write failed (non-blocking):', notifErr.message);
      }
      tclaimSuccess.textContent = `Submitted — ${claimId}`;
      tclaimSuccess.classList.add('show');
      tclaimSubmitBtn.disabled = false;
      tclaimSubmitBtn.textContent = 'Submit claim';
      if (document.getElementById('tclaims-tbody')) loadTechnicianClaims();
      setTimeout(closeTClaimModal, 1000);
    } catch (err) {
      console.error('Submit claim failed:', err);
      tclaimError.textContent = 'Could not submit claim. Check console for details.';
      tclaimError.classList.add('show');
      tclaimSubmitBtn.disabled = false;
      tclaimSubmitBtn.textContent = 'Submit claim';
    }
  });

  // ---------------------------------------------------------------
  // Earnings — real total of settled reimbursement claims. Job-based
  // commission isn't shown since no commission-rate configuration
  // exists yet anywhere in the CRM — showing a made-up number here
  // would be worse than admitting it's not calculated yet.
  // ---------------------------------------------------------------

  async function renderEarnings() {
    contentEl.innerHTML = `
      <div class="stat-grid">
        <div class="stat-card">
          <div class="label">Reimbursements Received</div>
          <div class="value" id="earnings-total">…</div>
          <div class="hint">Sum of settled claims</div>
        </div>
        <div class="stat-card">
          <div class="label">Job Commission</div>
          <div class="value">—</div>
          <div class="hint">Not set up yet</div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header"><h2>Settled claims</h2></div>
        <div class="panel-body" style="padding:0;">
          <table>
            <thead><tr><th>Claim ID</th><th>Description</th><th>Amount</th></tr></thead>
            <tbody id="earnings-tbody"><tr><td colspan="3" class="empty-row">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>`;
    const tbody = document.getElementById('earnings-tbody');
    if (!currentUser) return;
    try {
      const snap = await getDocs(query(
        collection(db, 'claims'),
        where('claimantUid', '==', currentUser.uid),
        where('status', '==', 'settled')
      ));
      let total = 0;
      if (snap.empty) {
        tbody.innerHTML = `<tr><td colspan="3" class="empty-row">No settled claims yet.</td></tr>`;
      } else {
        let docs = [];
        snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
        docs.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
        tbody.innerHTML = '';
        docs.forEach(d => {
          total += Number(d.amount) || 0;
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="font-size:12px;color:var(--stone);">${d.claimId || d.id}</td>
            <td>${d.description || '—'}</td>
            <td>₹${d.amount ?? '—'}</td>`;
          tbody.appendChild(tr);
        });
      }
      document.getElementById('earnings-total').textContent = '₹' + total;
    } catch (err) {
      console.error('Load earnings failed:', err);
      tbody.innerHTML = `<tr><td colspan="3" class="empty-row" style="color:var(--err);">Couldn't load earnings. Check console for details.</td></tr>`;
    }
  }

  // ---------------------------------------------------------------
  // Performance — real stats computed from this technician's own
  // serviceJobs history.
  // ---------------------------------------------------------------

  async function renderPerformance() {
    contentEl.innerHTML = `
      <div class="stat-grid">
        <div class="stat-card"><div class="label">Completed</div><div class="value" id="perf-completed">…</div><div class="hint">All time</div></div>
        <div class="stat-card"><div class="label">Cancelled</div><div class="value" id="perf-cancelled">…</div><div class="hint">All time</div></div>
        <div class="stat-card"><div class="label">Completion Rate</div><div class="value" id="perf-rate">…</div><div class="hint">Completed vs. cancelled</div></div>
        <div class="stat-card"><div class="label">Total Jobs</div><div class="value" id="perf-total">…</div><div class="hint">All time</div></div>
      </div>`;
    if (!currentUser) return;
    try {
      const [snap, crSnap] = await Promise.all([
        getDocs(query(collection(db, 'serviceJobs'), where('technicianUid', '==', currentUser.uid))),
        getDocs(query(collection(db, 'centerRequests'), where('technicianUid', '==', currentUser.uid))),
      ]);
      let completed = 0, cancelled = 0, total = 0;
      snap.forEach(d => {
        total++;
        if (d.data().status === 'completed') completed++;
        if (d.data().status === 'cancelled') cancelled++;
      });
      crSnap.forEach(d => {
        total++;
        if (d.data().status === 'completed') completed++;
        if (d.data().status === 'cancelled') cancelled++;
      });
      const denom = completed + cancelled;
      const rate = denom > 0 ? Math.round((completed / denom) * 100) + '%' : '—';
      document.getElementById('perf-completed').textContent = completed;
      document.getElementById('perf-cancelled').textContent = cancelled;
      document.getElementById('perf-rate').textContent = rate;
      document.getElementById('perf-total').textContent = total;
    } catch (err) {
      console.error('Load performance failed:', err);
    }
  }

  // ---------------------------------------------------------------
  // Profile — self-editable name/phone/skills/brand authorization,
  // stored on the technician's own users/{uid} doc. Role itself is
  // never editable here (rules enforce this server-side too).
  // ---------------------------------------------------------------

  async function renderProfile() {
    contentEl.innerHTML = `
      <div class="panel">
        <div class="panel-header"><h2>Your profile</h2></div>
        <div class="panel-body">
          <div class="form-row"><label>Name</label><input type="text" id="profile-name"></div>
          <div class="form-row"><label>Email</label><input type="text" id="profile-email" disabled style="opacity:0.6;"></div>
          <div class="form-row"><label>Phone</label><input type="text" id="profile-phone"></div>
          <div class="form-row"><label>Address <span style="font-weight:400;color:var(--stone);">(where Warehouse should ship spares to)</span></label><input type="text" id="profile-address"></div>
          <div class="form-row"><label>Skills</label><input type="text" id="profile-skills" placeholder="e.g. Geyser repair, electrical wiring"></div>
          <div class="form-row"><label>Brand authorization</label><input type="text" id="profile-brands" placeholder="e.g. MakWell, Flyvision"></div>
          <div class="modal-error" id="profile-error"></div>
          <div class="modal-success" id="profile-success"></div>
          <button class="btn-primary" id="save-profile" style="margin-top:8px;">Save changes</button>
        </div>
      </div>`;
    if (!currentUser) return;
    try {
      const snap = await getDoc(doc(db, 'users', currentUser.uid));
      const d = snap.exists() ? snap.data() : {};
      document.getElementById('profile-name').value = d.name || '';
      document.getElementById('profile-email').value = currentUser.email || '';
      document.getElementById('profile-phone').value = d.phone || '';
      document.getElementById('profile-address').value = d.address || '';
      document.getElementById('profile-skills').value = d.skills || '';
      document.getElementById('profile-brands').value = d.brandAuthorization || '';
    } catch (err) {
      console.error('Load profile failed:', err);
    }
    document.getElementById('save-profile').addEventListener('click', async () => {
      const btn = document.getElementById('save-profile');
      const errEl = document.getElementById('profile-error');
      const okEl = document.getElementById('profile-success');
      errEl.classList.remove('show');
      okEl.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Saving…';
      try {
        await setDoc(doc(db, 'users', currentUser.uid), {
          name: document.getElementById('profile-name').value.trim(),
          phone: document.getElementById('profile-phone').value.trim(),
          address: document.getElementById('profile-address').value.trim(),
          skills: document.getElementById('profile-skills').value.trim(),
          brandAuthorization: document.getElementById('profile-brands').value.trim(),
        }, { merge: true });
        okEl.textContent = 'Saved.';
        okEl.classList.add('show');
      } catch (err) {
        console.error('Save profile failed:', err);
        errEl.textContent = 'Could not save your profile. Check console for details.';
        errEl.classList.add('show');
      }
      btn.disabled = false;
      btn.textContent = 'Save changes';
    });
  }

  // ---------------------------------------------------------------
  // Notifications — uid-targeted, personal to the signed-in technician. Achievable slice of "Communication"
  // without a real WhatsApp/SMS/Email provider connected.
  // ---------------------------------------------------------------

  let notifUnsubscribeTimer = null;

  function notifQueryConfig() {
    if (!currentUser) return null;
    return { type: 'uid', value: currentUser.uid };
  }

  async function loadNotifications() {
    const cfg = notifQueryConfig();
    if (!cfg) return;
    const listEl = document.getElementById('notif-list');
    const badgeEl = document.getElementById('notif-badge');
    try {
      // No orderBy here on purpose — combining it with the two where()
      // clauses needs a composite index that doesn't exist by default
      // in Firestore. Sorting client-side avoids that requirement
      // entirely; a person's notification list is small enough that
      // this costs nothing in practice.
      const snap = await getDocs(query(
        collection(db, 'notifications'),
        where('recipientType', '==', cfg.type),
        where('recipientValue', '==', cfg.value)
      ));
      const items = [];
      snap.forEach(d => items.push({ id: d.id, ...d.data() }));
      items.sort((a, b) => {
        const at = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
        const bt = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
        return bt - at;
      });
      const unreadCount = items.filter(n => !n.read).length;
      if (unreadCount > 0) {
        badgeEl.textContent = unreadCount > 9 ? '9+' : unreadCount;
        badgeEl.style.display = 'block';
      } else {
        badgeEl.style.display = 'none';
      }
      if (items.length === 0) {
        listEl.innerHTML = '<div class="notif-empty">No notifications yet.</div>';
        return;
      }
      listEl.innerHTML = '';
      items.slice(0, 25).forEach(n => {
        const el = document.createElement('div');
        el.className = 'notif-item' + (n.read ? '' : ' unread');
        const dateStr = n.createdAt && n.createdAt.toDate ? n.createdAt.toDate().toLocaleString() : '';
        el.innerHTML = `<div class="title">${n.title || 'Notification'}</div><div class="msg">${escapeHtml(n.message || '')}</div><div class="time">${dateStr}</div>`;
        el.addEventListener('click', async () => {
          if (!n.read) {
            try { await updateDoc(doc(db, 'notifications', n.id), { read: true }); n.read = true; loadNotifications(); } catch (err) { console.error('Mark read failed:', err); }
          }
        });
        listEl.appendChild(el);
      });
    } catch (err) {
      console.error('Load notifications failed:', err);
      listEl.innerHTML = '<div class="notif-empty">Couldn\'t load notifications.</div>';
    }
  }

  const notifBellBtn = document.getElementById('notif-bell-btn');
  const notifPanel = document.getElementById('notif-panel');
  if (notifBellBtn) {
    notifBellBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      notifPanel.classList.toggle('show');
      if (notifPanel.classList.contains('show')) loadNotifications();
    });
    document.addEventListener('click', (e) => {
      if (!notifPanel.contains(e.target) && e.target !== notifBellBtn) notifPanel.classList.remove('show');
    });
    document.getElementById('notif-mark-all').addEventListener('click', async (e) => {
      e.stopPropagation();
      const cfg = notifQueryConfig();
      if (!cfg) return;
      try {
        const snap = await getDocs(query(collection(db, 'notifications'), where('recipientType', '==', cfg.type), where('recipientValue', '==', cfg.value), where('read', '==', false)));
        await Promise.all(snap.docs.map(d => updateDoc(doc(db, 'notifications', d.id), { read: true })));
        loadNotifications();
      } catch (err) { console.error('Mark all read failed:', err); }
    });
  }

  if (notifUnsubscribeTimer) clearInterval(notifUnsubscribeTimer);
  notifUnsubscribeTimer = setInterval(loadNotifications, 60000);

  renderNav();
  setActiveNav('dashboard');
</script>
</body>
</html>
