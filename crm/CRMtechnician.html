<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technician — Pushpak Enterprises CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
    --ink:#25292E;--paper:#F5EFE0;--paper-deep:#EDE3CC;--stone:#7A7565;--hairline:#E0D6BC;
    --blue:#1C6FBA;--blue-deep:#0F4C88;
    --err:#B3261E;--ok:#1C7A46;--sidebar-w:264px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}

  #gate{
    position:fixed;inset:0;background:var(--paper);z-index:100;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--stone);
  }
  #app{display:none;}

  .layout{display:flex;min-height:100vh;}
  .sidebar{
    width:var(--sidebar-w);flex-shrink:0;background:var(--blue-deep);color:var(--paper);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .sidebar-header{padding:22px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.1);}
  .sidebar-header img{width:30px;height:30px;flex-shrink:0;}
  .sidebar-header .name{font-size:13px;font-weight:700;}
  .sidebar-header .role{font-size:11px;color:#C9D6E4;}
  .nav-group{padding:14px 10px 4px;}
  .nav-group-label{font-size:10.5px;font-weight:700;letter-spacing:0.05em;color:#9FB4C8;padding:6px 12px;text-transform:uppercase;}
  .nav-item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:9px 12px;border-radius:3px;font-size:13px;font-weight:500;color:#E3EAF1;
    cursor:pointer;transition:background .15s;
  }
  .nav-item:hover{background:rgba(255,255,255,0.08);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,0.16);color:#fff;font-weight:600;}
  .nav-badge{font-size:9.5px;background:rgba(255,255,255,0.12);color:#C9D6E4;padding:2px 6px;border-radius:20px;}
  .sidebar-footer{margin-top:auto;padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);}
  .sidebar-footer .email{font-size:11.5px;color:#C9D6E4;margin-bottom:10px;word-break:break-all;}
  .logout-btn{
    width:100%;background:transparent;border:1px solid rgba(255,255,255,0.25);color:#E3EAF1;
    padding:9px;border-radius:3px;font-size:12.5px;font-weight:600;
  }
  .logout-btn:hover{background:rgba(255,255,255,0.1);}

  .main{flex:1;min-width:0;}
  .topbar{
    padding:18px 32px;border-bottom:1px solid var(--hairline);
    display:flex;align-items:center;justify-content:space-between;
  }
  .topbar h1{font-size:20px;font-weight:800;letter-spacing:-0.01em;}
  .topbar .sub{font-size:13px;color:var(--stone);margin-top:2px;}
  .content{padding:32px;}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hairline);border:1px solid var(--hairline);margin-bottom:32px;}
  .stat-card{background:var(--paper);padding:22px 20px;}
  .stat-card .label{font-size:12px;color:var(--stone);font-weight:600;margin-bottom:8px;}
  .stat-card .value{font-size:28px;font-weight:800;letter-spacing:-0.01em;}
  .stat-card .hint{font-size:11.5px;color:var(--stone);margin-top:4px;}
  @media (max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}

  .panel{border:1px solid var(--hairline);border-radius:2px;}
  .panel-header{padding:18px 22px;border-bottom:1px solid var(--hairline);display:flex;justify-content:space-between;align-items:center;}
  .panel-header h2{font-size:15px;font-weight:700;}
  .panel-body{padding:22px;}

  .coming-soon{
    border:1px dashed var(--hairline);border-radius:2px;padding:60px 30px;text-align:center;color:var(--stone);
  }
  .coming-soon .big{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px;}
  .coming-soon .small{font-size:13px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11.5px;font-weight:700;color:var(--stone);text-transform:uppercase;letter-spacing:0.03em;padding:10px 14px;border-bottom:1px solid var(--hairline);}
  td{padding:12px 14px;border-bottom:1px solid var(--hairline);vertical-align:top;}
  tr:last-child td{border-bottom:none;}

  .btn-primary{background:var(--blue);color:#fff;font-weight:600;font-size:13.5px;padding:10px 18px;border:none;border-radius:2px;}
  .btn-primary:disabled{opacity:0.6;cursor:default;}
  .btn-secondary{background:transparent;border:1px solid var(--hairline);font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:2px;}
  .btn-danger{background:transparent;border:1px solid var(--err);color:var(--err);font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:2px;}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .status-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .status-pill.assigned{background:#DCEAF6;color:var(--blue-deep);}
  .status-pill.in_progress{background:#FBEAD2;color:#9A6A15;}
  .status-pill.completed{background:#D9EEE0;color:var(--ok);}
  .status-pill.cancelled{background:#F6DCDC;color:var(--err);}
  .status-pill.new{background:#DCEAF6;color:var(--blue-deep);}
  .status-pill.approved{background:#DCEAF6;color:var(--blue-deep);}
  .status-pill.picking{background:var(--paper-deep);color:var(--ink);}
  .status-pill.packing{background:var(--paper-deep);color:var(--ink);}
  .status-pill.dispatched{background:#D9EEE0;color:var(--ok);}
  .status-pill.intransit{background:#D9EEE0;color:var(--ok);}
  .status-pill.ok{background:#D9EEE0;color:var(--ok);}
  .status-pill.backorder{background:#FBEAD2;color:#9A6A15;}
  .status-pill.out{background:#F6DCDC;color:var(--err);}

  .tab-toggle{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .tab-toggle button{
    background:var(--paper);border:1px solid var(--hairline);font-weight:600;font-size:12.5px;
    padding:8px 16px;border-radius:20px;color:var(--stone);
  }
  .tab-toggle button.active{background:var(--blue);border-color:var(--blue);color:#fff;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,21,26,0.5);display:none;
    align-items:center;justify-content:center;z-index:50;
  }
  .modal-overlay.show{display:flex;}
  .modal{background:var(--paper);width:100%;max-width:440px;border-radius:3px;padding:28px;max-height:88vh;overflow-y:auto;}
  .modal h3{font-size:16px;font-weight:800;margin-bottom:18px;}
  .form-row{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
  .form-row label{font-size:12px;font-weight:600;color:var(--stone);}
  .form-row input,.form-row select,.form-row textarea{border:1px solid var(--hairline);padding:10px 12px;font-size:13.5px;border-radius:2px;font-family:inherit;background:#fff;}
  .form-row textarea{resize:vertical;min-height:70px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
  .modal-error{font-size:12.5px;color:var(--err);margin-top:6px;display:none;}
  .modal-error.show{display:block;}
  .modal-success{font-size:12.5px;color:var(--ok);margin-top:6px;display:none;}
  .modal-success.show{display:block;}
  .empty-row{text-align:center;color:var(--stone);padding:32px;}

  .notif-bell{position:relative;background:none;border:1px solid var(--hairline);border-radius:2px;padding:9px 12px;cursor:pointer;font-size:15px;}
  .notif-badge{position:absolute;top:-6px;right:-6px;background:var(--err);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 5px;min-width:16px;text-align:center;}
  .notif-panel{
    position:absolute;top:100%;right:0;margin-top:8px;width:340px;max-height:400px;overflow-y:auto;
    background:var(--paper);border:1px solid var(--hairline);border-radius:2px;box-shadow:0 8px 24px rgba(0,0,0,0.12);
    z-index:60;display:none;
  }
  .notif-panel.show{display:block;}
  .notif-panel-header{padding:12px 16px;border-bottom:1px solid var(--hairline);display:flex;justify-content:space-between;align-items:center;}
  .notif-panel-header h4{font-size:13px;font-weight:700;}
  .notif-panel-header button{background:none;border:none;font-size:11.5px;color:var(--blue);cursor:pointer;font-weight:600;}
  .notif-item{padding:12px 16px;border-bottom:1px solid var(--hairline);cursor:pointer;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item.unread{background:var(--paper-deep);}
  .notif-item .title{font-size:12.5px;font-weight:700;margin-bottom:3px;}
  .notif-item .msg{font-size:12px;color:var(--stone);}
  .notif-item .time{font-size:10.5px;color:var(--stone);margin-top:4px;}
  .notif-empty{padding:24px 16px;text-align:center;font-size:12.5px;color:var(--stone);}
</style>
</head>
<body>

<div id="gate">Checking your session…</div>

<div id="app">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../assets/logos/pushpak-enterprises-icon.png" alt="">
        <div>
          <div class="name">Pushpak Enterprises</div>
          <div class="role">Technician</div>
        </div>
      </div>

      <div id="nav-container"></div>

      <div class="sidebar-footer">
        <div class="email" id="user-email"></div>
        <button class="logout-btn" id="logout-btn">Sign out</button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div>
          <h1 id="page-title">Dashboard</h1>
          <div class="sub" id="page-sub">Welcome back</div>
        </div>
        <div style="position:relative;">
          <button class="notif-bell" id="notif-bell-btn">🔔<span class="notif-badge" id="notif-badge" style="display:none;">0</span></button>
          <div class="notif-panel" id="notif-panel">
            <div class="notif-panel-header"><h4>Notifications</h4><button id="notif-mark-all">Mark all read</button></div>
            <div id="notif-list"><div class="notif-empty">Loading…</div></div>
          </div>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<!-- New Job modal -->
<!-- Job closure modal — required before a job can be marked complete -->
<div class="modal-overlay" id="closure-overlay">
  <div class="modal">
    <h3>Complete job</h3>
    <div id="closure-job-label" style="font-size:12.5px;color:var(--stone);margin-bottom:14px;"></div>
    <form id="closure-form">
      <input type="hidden" id="closure-job-id">
      <div class="form-row">
        <label>Closure code</label>
        <select id="closure-code" required>
          <option value="">Select…</option>
          <option value="repaired">Repaired</option>
          <option value="replaced">Part(s) Replaced</option>
          <option value="no_fault_found">No Fault Found</option>
          <option value="unable_to_repair">Unable to Repair — Escalated</option>
          <option value="customer_cancelled">Customer Cancelled</option>
        </select>
      </div>
      <div class="form-row">
        <label>Action taken</label>
        <textarea id="closure-notes" rows="3" placeholder="What was actually done during this visit" required></textarea>
      </div>
      <div class="form-row">
        <label>Parts used</label>
        <div id="closure-linked-parts" style="font-size:12.5px;color:var(--stone);margin-bottom:8px;"></div>
        <input type="text" id="closure-parts-notes" placeholder="Any parts used that weren't requested through the system, or type 'None'">
      </div>
      <div class="modal-error" id="closure-error"></div>
      <div class="modal-success" id="closure-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-closure">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-closure">Mark Complete</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="job-overlay">
  <div class="modal">
    <h3>Log a new job</h3>
    <form id="job-form">
      <div class="form-row">
        <label>Customer name</label>
        <input type="text" id="job-customer-name" required>
      </div>
      <div class="form-row">
        <label>Customer phone</label>
        <input type="tel" id="job-customer-phone" required>
      </div>
      <div class="form-row">
        <label>Address</label>
        <input type="text" id="job-address" placeholder="e.g. area, city">
      </div>
      <div class="form-row">
        <label>Pincode <span class="hint">(needed for SLA territory rules)</span></label>
        <input type="text" id="job-pincode" inputmode="numeric" maxlength="6" placeholder="e.g. 580020">
      </div>
      <div class="form-row">
        <label>Service type</label>
        <select id="job-type">
          <option value="repair">Repair</option>
          <option value="installation">Installation</option>
          <option value="warranty">Warranty Repair</option>
          <option value="paid">Paid Repair</option>
        </select>
      </div>
      <div class="form-row">
        <label>Product / brand</label>
        <input type="text" id="job-product" placeholder="e.g. MakWell geyser 15L">
      </div>
      <div class="form-row">
        <label>Issue description</label>
        <textarea id="job-issue" placeholder="What's wrong / what's needed" required></textarea>
      </div>
      <div class="form-row">
        <label>Scheduled date (optional)</label>
        <input type="date" id="job-scheduled-date">
      </div>
      <div class="form-row" style="display:flex;gap:12px;">
        <div style="flex:1;"><label>Start time</label><input type="time" id="job-scheduled-start"></div>
        <div style="flex:1;"><label>End time</label><input type="time" id="job-scheduled-end"></div>
      </div>
      <div class="modal-error" id="job-error"></div>
      <div class="modal-success" id="job-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-job">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-job">Save job</button>
      </div>
    </form>
  </div>
</div>

<!-- Spare Bag adjust modal -->
<div class="modal-overlay" id="bag-overlay">
  <div class="modal">
    <h3 id="bag-modal-title">Update spare bag</h3>
    <form id="bag-form">
      <div class="form-row">
        <label>Part</label>
        <select id="bag-part-id" required>
          <option value="">Select a part…</option>
        </select>
      </div>
      <div class="form-row">
        <label>Action</label>
        <select id="bag-type">
          <option value="add">Received from Head Office</option>
          <option value="use">Used on a job</option>
        </select>
      </div>
      <div class="form-row">
        <label>Quantity</label>
        <input type="number" id="bag-qty" min="1" value="1" required>
      </div>
      <div class="form-row">
        <label>Notes (optional)</label>
        <input type="text" id="bag-notes" placeholder="e.g. job ID, or dispatch reference">
      </div>
      <div class="modal-error" id="bag-error"></div>
      <div class="modal-success" id="bag-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-bag">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-bag">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- New Claim modal -->
<div class="modal-overlay" id="tclaim-overlay">
  <div class="modal">
    <h3>Submit a claim</h3>
    <form id="tclaim-form">
      <div class="form-row">
        <label>Description</label>
        <input type="text" id="tclaim-description" placeholder="e.g. Travel expense for on-site repair" required>
      </div>
      <div class="form-row">
        <label>Amount (₹)</label>
        <input type="number" id="tclaim-amount" min="0" step="0.01" required>
      </div>
      <div class="form-row">
        <label>Notes (optional)</label>
        <textarea id="tclaim-notes" placeholder="Any additional context…"></textarea>
      </div>
      <div class="modal-error" id="tclaim-error"></div>
      <div class="modal-success" id="tclaim-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-tclaim">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-tclaim">Submit claim</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, collection, getDocs, query, where, orderBy, runTransaction, serverTimestamp, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCRqUdrKe2U2wF_4LI-6Yl7zdgmE5YhvQY",
    authDomain: "makwell-websiteandcrm.firebaseapp.com",
    projectId: "makwell-websiteandcrm",
    storageBucket: "makwell-websiteandcrm.firebasestorage.app",
    messagingSenderId: "673518655103",
    appId: "1:673518655103:web:1805d10de3c63eca23914a",
    measurementId: "G-YLM91W3YF1"
  };

  // Escapes text before it's interpolated into an innerHTML template.
  // Public-facing forms (Book a Service, Register a Product, Contact,
  // Dealer Enquiry) accept free text from anonymous visitors with no
  // server-side validation — anything they type could otherwise
  // execute as a stored XSS payload the moment staff view it here.
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const storage = getStorage(app);

  const gate = document.getElementById('gate');
  const appEl = document.getElementById('app');
  const userEmailEl = document.getElementById('user-email');

  const ALLOWED_ROLE = 'technician';

  let currentUser = null;

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }
    try {
      const roleSnap = await getDoc(doc(db, 'users', user.uid));
      if (!roleSnap.exists() || roleSnap.data().role !== ALLOWED_ROLE) {
        await signOut(auth);
        window.location.href = 'login.html';
        return;
      }
    } catch (err) {
      console.error('Role check failed:', err);
      window.location.href = 'login.html';
      return;
    }
    currentUser = user;
    userEmailEl.textContent = user.email;
    gate.style.display = 'none';
    appEl.style.display = 'block';
    renderDashboard();
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = 'login.html';
  });

  const NAV = [{"group": "Overview", "items": [{"id": "dashboard", "label": "Dashboard", "built": true}]}, {"group": "My Work", "items": [{"id": "jobs", "label": "My Jobs", "built": true}, {"id": "schedule", "label": "Schedule", "built": true}, {"id": "availability", "label": "Availability", "built": true}, {"id": "diagnosis", "label": "Diagnosis", "built": true}]}, {"group": "Inventory", "items": [{"id": "sparebag", "label": "Spare Bag", "built": true}]}, {"group": "Finance", "items": [{"id": "claims", "label": "Claims", "built": true}, {"id": "earnings", "label": "Earnings", "built": true}]}, {"group": "Operations", "items": [{"id": "performance", "label": "Performance", "built": true}, {"id": "profile", "label": "Profile", "built": true}]}];

  const navContainer = document.getElementById('nav-container');
  const pageTitle = document.getElementById('page-title');
  const pageSub = document.getElementById('page-sub');
  const contentEl = document.getElementById('content');

  function renderNav() {
    navContainer.innerHTML = '';
    NAV.forEach(group => {
      const groupEl = document.createElement('div');
      groupEl.className = 'nav-group';
      const label = document.createElement('div');
      label.className = 'nav-group-label';
      label.textContent = group.group;
      groupEl.appendChild(label);
      group.items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'nav-item';
        el.dataset.id = item.id;
        el.innerHTML = `<span>${item.label}</span>` + (!item.built ? '<span class="nav-badge">soon</span>' : '');
        el.addEventListener('click', () => selectSection(item.id, item.label));
        groupEl.appendChild(el);
      });
      navContainer.appendChild(groupEl);
    });
  }

  function setActiveNav(id) {
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.id === id);
    });
  }

  function selectSection(id, label) {
    setActiveNav(id);
    pageTitle.textContent = label;
    if (id === 'dashboard') {
      pageSub.textContent = 'Welcome back';
      renderDashboard();
    } else if (id === 'jobs') {
      pageSub.textContent = 'Jobs assigned to you';
      renderMyJobs();
    } else if (id === 'schedule') {
      pageSub.textContent = 'Upcoming scheduled jobs';
      renderSchedule();
    } else if (id === 'availability') {
      pageSub.textContent = 'Let dispatch know your status';
      renderAvailability();
    } else if (id === 'diagnosis') {
      pageSub.textContent = 'Diagnosis notes on active jobs';
      renderDiagnosis();
    } else if (id === 'sparebag') {
      pageSub.textContent = 'Parts you\'re currently carrying';
      renderSpareBag();
    } else if (id === 'claims') {
      pageSub.textContent = 'Your reimbursement claims';
      renderTechnicianClaims();
    } else if (id === 'earnings') {
      pageSub.textContent = 'Reimbursements received';
      renderEarnings();
    } else if (id === 'performance') {
      pageSub.textContent = 'Your job completion stats';
      renderPerformance();

  // ---------------------------------------------------------------
  // My Jobs — Assigned → In Progress → Completed (or Cancelled).
  // Scoped to the signed-in technician's own uid — no dispatcher /
  // routing module exists yet, so technicians log their own jobs
  // for now; this collection is exactly what a future Routing
  // module would also write into.
  // ---------------------------------------------------------------

  const JOB_STATUS_LABELS = {
    assigned: 'Assigned', accepted: 'Accepted', on_the_way: 'On the Way', at_customer: 'At Customer',
    in_progress: 'In Progress', waiting_spare: 'Waiting for Spare', completed: 'Completed',
    verification: 'Verification', closed: 'Closed', reassignment_required: 'Reassignment Requested',
    cancelled: 'Cancelled', reopened: 'Reopened'
  };
  const JOB_STATUS_PILL_CLASS = {
    assigned: 'new', accepted: 'assigned', on_the_way: 'assigned', at_customer: 'assigned',
    in_progress: 'in_progress', waiting_spare: 'backorder', completed: 'ok', verification: 'ok',
    closed: 'ok', reassignment_required: 'out', cancelled: 'cancelled', reopened: 'new'
  };
  // What a technician can do from each status — a real state machine,
  // not free-form status editing. Verification/Closed happen outside
  // the technician's own screen (Service overview, by staff), since a
  // job being genuinely done shouldn't just be self-declared.
  const JOB_NEXT_ACTIONS = {
    assigned: [{ next: 'accepted', label: 'Accept Job' }, { next: 'reassignment_required', label: 'Request Reassignment', variant: 'danger' }],
    accepted: [{ next: 'on_the_way', label: "I'm On the Way" }],
    on_the_way: [{ next: 'at_customer', label: 'Arrived at Customer' }],
    at_customer: [{ next: 'in_progress', label: 'Start Work' }],
    in_progress: [{ next: 'waiting_spare', label: 'Waiting for Spare', variant: 'secondary' }, { next: 'completed', label: 'Mark Complete' }],
    waiting_spare: [{ next: 'in_progress', label: 'Resume Work' }],
  };
  const JOB_ACTIVE_STATUSES = ['assigned', 'accepted', 'on_the_way', 'at_customer', 'in_progress', 'waiting_spare'];
  let currentJobFilter = 'active'; // 'active' = assigned + in_progress

  async function generateJobId() {
    const d = new Date();
    const monthKey = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}`;
    const counterRef = doc(db, 'counters', `servicejob-${monthKey}`);
    const next = await runTransaction(db, async (transaction) => {
      const snap = await transaction.get(counterRef);
      const n = (snap.exists() ? snap.data().value : 0) + 1;
      if (snap.exists()) transaction.update(counterRef, { value: n });
      else transaction.set(counterRef, { value: n });
      return n;
    });
    const dateStr = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    return `PE-JOB-${dateStr}-${String(next).padStart(4, '0')}-Technician`;
  }

  // Uses the SAME shared counter key Warehouse's own spare request
  // creation uses (sparerequest-YYYYMM) so IDs stay globally
  // sequential regardless of which dashboard created the request.
  async function generateSpareRequestId() {
    const d = new Date();
    const monthKey = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}`;
    const counterRef = doc(db, 'counters', `sparerequest-${monthKey}`);
    const next = await runTransaction(db, async (transaction) => {
      const snap = await transaction.get(counterRef);
      const n = (snap.exists() ? snap.data().value : 0) + 1;
      if (snap.exists()) transaction.update(counterRef, { value: n });
      else transaction.set(counterRef, { value: n });
      return n;
    });
    const dateStr = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    return `PE-SR-${dateStr}-${String(next).padStart(4, '0')}-Technician`;
  }

  const SPARE_REQ_STATUS_LABELS = {
    new: 'Requested', approved: 'Approved', picking: 'Picking', packing: 'Packing',
    dispatched: 'Dispatched', intransit: 'In Transit', backorder: 'Back Order'
  };

  function renderMyJobs() {
    contentEl.innerHTML = `
      <div class="panel">
        <div class="panel-header">

          <button class="btn-primary" id="open-job-request">+ Log Job</button>
        </div>

          <div class="tab-toggle" id="job-tabs">

          <table>
            <thead>
              <tr><th>Job ID</th><th>Customer</th><th>Phone</th><th>Product</th><th>Issue</th><th>Status</th><th>Actions</th></tr>

          </table>

    document.querySelectorAll('#job-tabs button').forEach(btn => {

  async function loadMyJobs() {
    const tbody = document.getElementById('jobs-tbody');
    if (!currentUser) return;
    try {
      const snap = await getDocs(query(
        collection(db, 'serviceJobs'),
        where('technicianUid', '==', currentUser.uid)
      ));
      let docs = [];
      snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
      docs.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      if (currentJobFilter === 'active') {
        docs = docs.filter(d => JOB_ACTIVE_STATUSES.includes(d.status) && d.status !== 'waiting_spare');
      } else if (currentJobFilter !== 'all') {
        docs = docs.filter(d => d.status === currentJobFilter);
      }
      if (docs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-row">No jobs here.</td></tr>`;
        return;
      }
      tbody.innerHTML = '';
      docs.forEach(d => {
        const actions = JOB_NEXT_ACTIONS[d.status] || [];
        let actionHtml = actions.length
          ? `<div class="row-actions">${actions.map(a => `<button class="${a.variant === 'danger' ? 'btn-danger' : a.variant === 'secondary' ? 'btn-secondary' : 'btn-primary'} job-action-btn" data-id="${d.id}" data-next="${a.next}">${a.label}</button>`).join('')}</div>`
          : '—';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-size:12px;color:var(--stone);">${d.jobId || d.id}</td>
          <td>${escapeHtml(d.customerName || '—')}</td>
          <td>${escapeHtml(d.customerPhone || '—')}</td>
          <td>${escapeHtml(d.product || '—')}</td>
          <td style="max-width:220px;">${escapeHtml(d.issue || '—')}</td>
          <td><span class="status-pill ${JOB_STATUS_PILL_CLASS[d.status] || ''}">${JOB_STATUS_LABELS[d.status] || d.status}</span></td>
          <td>${actionHtml}</td>`;
        tbody.appendChild(tr);
      });
      tbody.querySelectorAll('.job-action-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.dataset.next === 'completed') {
            const jobDoc = docs.find(x => x.id === btn.dataset.id);
            if (jobDoc) openClosureModal(jobDoc);
          } else {
            advanceJob(btn.dataset.id, btn.dataset.next);
          }
        });
      });
    } catch (err) {
      console.error('Load jobs failed:', err);
      tbody.innerHTML = `<tr><td colspan="7" class="empty-row" style="color:var(--err);">Couldn't load jobs. Check console for details.</td></tr>`;
    }
  }

  async function advanceJob(id, nextStatus) {
    try {
      await updateDoc(doc(db, 'serviceJobs', id), { status: nextStatus, updatedAt: serverTimestamp() });

  // Closure requires real evidence — closure code, what was done, and
  // parts used — before a job can move to Completed. Previously this
  // was a single click with nothing recorded, so a completed job had
  // no proof of what actually happened during the visit.
  const closureOverlay = document.getElementById('closure-overlay');
  const closureForm = document.getElementById('closure-form');
  const closureError = document.getElementById('closure-error');
  const closureSuccess = document.getElementById('closure-success');
  const closureSubmitBtn = document.getElementById('submit-closure');

  async function openClosureModal(jobDoc) {
    closureForm.reset();
    closureError.classList.remove('show');
    closureSuccess.classList.remove('show');
    closureSubmitBtn.disabled = false;
    closureSubmitBtn.textContent = 'Mark Complete';
    document.getElementById('closure-job-id').value = jobDoc.id;
    document.getElementById('closure-job-label').textContent = `${jobDoc.jobId || jobDoc.id} — ${jobDoc.customerName || 'customer'}`;
    const linkedEl = document.getElementById('closure-linked-parts');
    linkedEl.textContent = 'Checking linked spare requests…';
    try {
      const snap = await getDocs(query(collection(db, 'spareRequests'), where('sourceJobId', '==', jobDoc.id)));
      if (snap.empty) {
        linkedEl.textContent = 'No spare parts were requested through the system for this job.';
      } else {
        const items = [];
        snap.forEach(d => items.push(`${escapeHtml(d.data().item)} (${d.data().status})`));
        linkedEl.textContent = `Requested through the system: ${items.join(', ')}`;
      }
    } catch (err) {
      linkedEl.textContent = '';
    }
    closureOverlay.classList.add('show');
  }
  function closeClosureModal() { closureOverlay.classList.remove('show'); }
  document.getElementById('cancel-closure').addEventListener('click', closeClosureModal);
  closureOverlay.addEventListener('click', (e) => { if (e.target === closureOverlay) closeClosureModal(); });

  closureForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    closureError.classList.remove('show');
    closureSuccess.classList.remove('show');
    const jobId = document.getElementById('closure-job-id').value;
    const closureCode = document.getElementById('closure-code').value;
    const notes = document.getElementById('closure-notes').value.trim();
    const partsNotes = document.getElementById('closure-parts-notes').value.trim();
    if (!closureCode || !notes || !partsNotes) {
      closureError.textContent = 'Closure code, action taken, and parts used are all required — type "None" if no parts were used.';
      closureError.classList.add('show');
      return;
    }
    closureSubmitBtn.disabled = true;
    closureSubmitBtn.textContent = 'Saving…';
    try {
      await updateDoc(doc(db, 'serviceJobs', jobId), {
        status: 'completed',
        closureCode,
        actionTaken: notes,
        partsUsedNotes: partsNotes,
        closedByUid: currentUser.uid,
        closedAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      closureSuccess.textContent = 'Completed.';
      closureSuccess.classList.add('show');
      closureSubmitBtn.textContent = 'Done';
      loadMyJobs();
      setTimeout(closeClosureModal, 800);
    } catch (err) {
      console.error('Close job failed:', err);
      closureError.textContent = 'Could not complete this job. Check the console for details.';
      closureError.classList.add('show');
      closureSubmitBtn.disabled = false;
      closureSubmitBtn.textContent = 'Mark Complete';
    }
  });

  const jobOverlay = document.getElementById('job-overlay');
  const jobForm = document.getElementById('job-form');

  function closeJobModal() { jobOverlay.classList.remove('show'); }

  jobOverlay.addEventListener('click', (e) => { if (e.target === jobOverlay) closeJobModal(); });

  jobForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!currentUser) return;
    jobSubmitBtn.disabled = true;
    jobSubmitBtn.textContent = 'Saving…';

      const jobId = await generateJobId();

      if (document.getElementById('jobs-tbody')) loadMyJobs();

      console.error('Save job failed:', err);

      jobError.classList.add('show');

  const AVAILABILITY_OPTIONS = [

    { value: 'on_the_way', label: 'On the Way', desc: 'Heading to a customer for an active job.', pillClass: 'assigned' },
    { value: 'at_customer', label: 'At Customer', desc: 'On-site, working the job.', pillClass: 'assigned' },

  async function renderAvailability() {
    contentEl.innerHTML = `
      <div class="panel">
        <div class="panel-header"><h2>Your availability</h2></div>

          <div id="availability-current" style="margin-bottom:20px;font-size:13.5px;color:var(--stone);">Loading…</div>
          <div class="tab-toggle" id="availability-options"></div>
        </div>
      </div>`;
    const optionsEl = document.getElementById('availability-options');
    AVAILABILITY_OPTIONS.forEach(opt => {
      const btn = document.createElement('button');
      btn.textContent = opt.label;
      btn.title = opt.desc;
      btn.dataset.value = opt.value;
      btn.addEventListener('click', () => setAvailability(opt.value));
      optionsEl.appendChild(btn);
    });
    loadAvailability();

  async function loadAvailability() {
    if (!currentUser) return;
    try {
      const snap = await getDoc(doc(db, 'technicianAvailability', currentUser.uid));
      const data = snap.exists() ? snap.data() : {};
      const current = data.status || null;
      const suspended = data.suspended === true;
      const currentOpt = AVAILABILITY_OPTIONS.find(o => o.value === current);
      if (suspended) {
        document.getElementById('availability-current').innerHTML =
          `<span class="status-pill cancelled">Suspended</span> — contact your Service Center or Warehouse. You can't change your own status while suspended.`;
      } else {
        document.getElementById('availability-current').innerHTML = current
          ? `Current status: <span class="status-pill ${currentOpt ? currentOpt.pillClass : 'cancelled'}">${currentOpt ? currentOpt.label : current}</span>`
          : 'You haven\'t set your availability yet.';
      }
      document.querySelectorAll('#availability-options button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.value === current);
        btn.disabled = suspended;
        btn.style.opacity = suspended ? '0.5' : '1';
        btn.style.cursor = suspended ? 'not-allowed' : 'pointer';
      });
    } catch (err) {
      console.error('Load availability failed:', err);
    }
  }

  async function setAvailability(status) {
    if (!currentUser) return;
    try {
      const existing = await getDoc(doc(db, 'technicianAvailability', currentUser.uid));
      if (existing.exists() && existing.data().suspended === true) {
        alert('Your account is suspended — you can\'t change your own status. Contact your Service Center or Warehouse.');
        return;
      }
      await setDoc(doc(db, 'technicianAvailability', currentUser.uid), {
        status, technicianEmail: currentUser.email, updatedAt: serverTimestamp()
      }, { merge: true });
      loadAvailability();
    } catch (err) {
      console.error('Set availability failed:', err);
      alert('Could not update availability. Check the console for details.');
    }
  }

  // ---------------------------------------------------------------
  // Diagnosis — add/edit diagnosis notes and parts-needed directly
  // on active jobs. Saves back onto the same serviceJobs document.
  // ---------------------------------------------------------------

  let sparePartsListCache = null;
  async function getSparePartsListCache() {
    if (sparePartsListCache) return sparePartsListCache;
    const snap = await getDocs(collection(db, 'spareParts'));
    sparePartsListCache = [];
    snap.forEach(d => sparePartsListCache.push({ id: d.id, ...d.data() }));
    return sparePartsListCache;
  }

  async function renderDiagnosis() {
    contentEl.innerHTML = `<div id="diagnosis-cards"><div class="empty-row">Loading…</div></div>`;
    const container = document.getElementById('diagnosis-cards');
    if (!currentUser) return;
    try {
      const [snap, parts] = await Promise.all([
        getDocs(query(
          collection(db, 'serviceJobs'),
          where('technicianUid', '==', currentUser.uid),
          where('status', 'in', ['assigned', 'accepted', 'on_the_way', 'at_customer', 'in_progress', 'waiting_spare'])
        )),
        getSparePartsListCache(),
      ]);
      const docs = [];
      snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
      if (docs.length === 0) {
        container.innerHTML = `<div class="empty-row">No active jobs to diagnose right now.</div>`;
        return;
      }
      container.innerHTML = '';
      for (const d of docs) {
        container.appendChild(await buildDiagnosisCard(d, parts));
      }
    } catch (err) {
      console.error('Load diagnosis failed:', err);
      container.innerHTML = `<div class="empty-row" style="color:var(--err);">Couldn't load jobs. Check console for details.</div>`;
    }
  }

  async function buildDiagnosisCard(d, parts) {
    const card = document.createElement('div');
    card.className = 'panel';
    card.style.marginBottom = '16px';
    card.dataset.jobId = d.id;

    // Any spare requests already linked to this job — shown so the
    // technician can see where a requested part actually stands,
    // instead of a note nobody else can see.
    let linkedRequestsHtml = '';
    try {
      const linkedSnap = await getDocs(query(collection(db, 'spareRequests'), where('sourceJobId', '==', d.id)));
      const linked = [];
      linkedSnap.forEach(ld => linked.push({ id: ld.id, ...ld.data() }));

        linkedRequestsHtml = `<div style="margin-top:10px;font-size:12.5px;">
          ${linked.map(l => `<div style="margin-bottom:4px;">${l.item || '—'} × ${l.quantity ?? 1} — <span class="status-pill ${l.status}">${SPARE_REQ_STATUS_LABELS[l.status] || l.status}</span></div>`).join('')}

      console.warn('Could not load linked spare requests:', err.message);
    }

    const partOptions = '<option value="">Select part…</option>' + parts.map(p => `<option value="${p.id}" data-name="${p.name}">${p.partCode ? p.partCode + ' — ' : ''}${p.name}</option>`).join('');

    card.innerHTML = `
      <div class="panel-header">
        <h2 style="font-size:14px;">${d.jobId || d.id} — ${escapeHtml(d.customerName || '—')}</h2>
      </div>
      <div class="panel-body">
        <div style="font-size:12.5px;color:var(--stone);margin-bottom:14px;">${escapeHtml(d.issue || '—')}</div>
        <div class="form-row"><label>Diagnosis notes</label><textarea class="diag-notes"></textarea></div>
        <div class="form-grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px;">
          <div>
            <label style="font-size:12px;font-weight:600;color:var(--stone);">Before photos</label>
            <div class="photo-grid before-photo-grid" style="display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;"></div>
            <input type="file" class="before-photo-input" accept="image/*" multiple style="font-size:12px;">
          </div>
          <div>
            <label style="font-size:12px;font-weight:600;color:var(--stone);">After photos</label>
            <div class="photo-grid after-photo-grid" style="display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;"></div>
            <input type="file" class="after-photo-input" accept="image/*" multiple style="font-size:12px;">
          </div>
        </div>
        <div class="modal-error" style="margin-top:10px;"></div>
        <button class="btn-secondary diag-save-btn" style="margin-top:14px;">Save</button>
        <hr style="margin:18px 0;border:none;border-top:1px solid var(--hairline);">
        <label style="font-size:12px;font-weight:600;color:var(--stone);">Request a spare part</label>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <select class="spare-part-select" style="flex:1;border:1px solid var(--hairline);padding:8px 10px;border-radius:2px;font-size:13px;">${partOptions}</select>
          <input type="number" class="spare-qty-input" min="1" value="1" style="width:70px;border:1px solid var(--hairline);padding:8px 10px;border-radius:2px;font-size:13px;">
          <button class="btn-secondary spare-request-btn">Request Spare</button>
        </div>
        <div class="modal-error spare-request-error" style="margin-top:8px;"></div>

    card.querySelector('.diag-notes').value = d.diagnosisNotes || '';

    renderPhotoThumbnails(card.querySelector('.before-photo-grid'), d.beforePhotos || [], d.id, 'beforePhotos');
    renderPhotoThumbnails(card.querySelector('.after-photo-grid'), d.afterPhotos || [], d.id, 'afterPhotos');

    card.querySelector('.before-photo-input').addEventListener('change', (e) =>
      handlePhotoUpload(e, card, d.id, 'before', 'beforePhotos'));
    card.querySelector('.after-photo-input').addEventListener('change', (e) =>
      handlePhotoUpload(e, card, d.id, 'after', 'afterPhotos'));

    card.querySelector('.diag-save-btn').addEventListener('click', async () => {
      const btn = card.querySelector('.diag-save-btn');
      const errEl = card.querySelector('.modal-error');
      errEl.classList.remove('show');
      btn.textContent = 'Saving…';
      btn.disabled = true;
      try {
        await updateDoc(doc(db, 'serviceJobs', d.id), {
          diagnosisNotes: card.querySelector('.diag-notes').value,
          updatedAt: serverTimestamp()
        });
        btn.textContent = 'Saved';
        setTimeout(() => { btn.textContent = 'Save'; btn.disabled = false; }, 1200);

        console.error('Save diagnosis failed:', err);
        errEl.textContent = 'Could not save. Check console for details.';
        errEl.classList.add('show');
        btn.textContent = 'Save';
        btn.disabled = false;
      }
    });

    card.querySelector('.spare-request-btn').addEventListener('click', async () => {
      const btn = card.querySelector('.spare-request-btn');
      const errEl = card.querySelector('.spare-request-error');
      errEl.classList.remove('show');
      const select = card.querySelector('.spare-part-select');

      const partName = select.selectedOptions[0]?.dataset.name || '';

        errEl.textContent = 'Select a part first.';
        errEl.classList.add('show');

      btn.disabled = true;
      btn.textContent = 'Requesting…';
      try {
        const requestId = await generateSpareRequestId();

          requestId,
          serviceCenter: currentUser.email,
          item: partName,
          partId,
          quantity: qty,
          priority: 'normal',
          notes: `Requested from diagnosis — ${d.jobId || d.id}`,
          sourceJobId: d.id,
          sourceJobLabel: `${d.jobId || d.id} — ${escapeHtml(d.customerName || 'customer')} (${escapeHtml(d.product || 'product')})`,
          sourceJobCollection: 'serviceJobs',
          requestedByUid: currentUser.uid,
          status: 'new',
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });
        // Job moves to Waiting for Spare — this is the real link
        // between diagnosis and the job's own state machine.
        await updateDoc(doc(db, 'serviceJobs', d.id), { status: 'waiting_spare', updatedAt: serverTimestamp() });
        btn.textContent = 'Requested';
        setTimeout(() => renderDiagnosis(), 900);
      } catch (err) {
        console.error('Request spare failed:', err);
        errEl.textContent = 'Could not request this part. Check console for details.';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Request Spare';

  function renderPhotoThumbnails(gridEl, urls, jobId, field) {
    gridEl.innerHTML = '';
    urls.forEach(url => {
      const thumb = document.createElement('div');
      thumb.style.cssText = 'position:relative;width:64px;height:64px;';
      thumb.innerHTML = `
        <img src="${url}" style="width:100%;height:100%;object-fit:cover;border-radius:2px;border:1px solid var(--hairline);">
        <button type="button" style="position:absolute;top:-6px;right:-6px;background:var(--err);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1;cursor:pointer;">&times;</button>`;
      thumb.querySelector('button').addEventListener('click', async () => {
        if (!confirm('Remove this photo?')) return;
        try {
          await updateDoc(doc(db, 'serviceJobs', jobId), { [field]: arrayRemove(url) });
          thumb.remove();
        } catch (err) {
          console.error('Remove photo failed:', err);
          alert('Could not remove this photo. Check the console for details.');
        }
      });
      gridEl.appendChild(thumb);
    });
  }

  async function handlePhotoUpload(e, card, jobId, subfolder, field) {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    const gridEl = card.querySelector(subfolder === 'before' ? '.before-photo-grid' : '.after-photo-grid');
    const errEl = card.querySelector('.modal-error');
    errEl.classList.remove('show');
    for (const file of files) {
      if (!file.type.startsWith('image/')) continue;
      if (file.size > 10 * 1024 * 1024) {
        errEl.textContent = `"${file.name}" is over 10MB and was skipped.`;
        errEl.classList.add('show');
        continue;
      }
      const placeholder = document.createElement('div');
      placeholder.style.cssText = 'width:64px;height:64px;background:var(--paper-deep);border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--stone);';
      placeholder.textContent = 'Uploading…';
      gridEl.appendChild(placeholder);
      try {
        const filePath = `serviceJobs/${jobId}/diagnosis/${subfolder}/${Date.now()}_${file.name}`;
        const fileRef = storageRef(storage, filePath);
        await uploadBytes(fileRef, file);
        const url = await getDownloadURL(fileRef);
        await updateDoc(doc(db, 'serviceJobs', jobId), { [field]: arrayUnion(url) });
        placeholder.remove();
        const thumb = document.createElement('div');
        thumb.style.cssText = 'position:relative;width:64px;height:64px;';
        thumb.innerHTML = `
          <img src="${url}" style="width:100%;height:100%;object-fit:cover;border-radius:2px;border:1px solid var(--hairline);">
          <button type="button" style="position:absolute;top:-6px;right:-6px;background:var(--err);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1;cursor:pointer;">&times;</button>`;
        thumb.querySelector('button').addEventListener('click', async () => {
          if (!confirm('Remove this photo?')) return;
          try {
            await updateDoc(doc(db, 'serviceJobs', jobId), { [field]: arrayRemove(url) });
            thumb.remove();
          } catch (err) {
            console.error('Remove photo failed:', err);
            alert('Could not remove this photo. Check the console for details.');
          }
        });
        gridEl.appendChild(thumb);
      } catch (err) {
        console.error('Upload photo failed:', err);
        placeholder.textContent = 'Failed';
        errEl.textContent = `Could not upload "${file.name}". Check console for details.`;
        errEl.classList.add('show');
      }
    }
    e.target.value = '';
  }

  async function loadSpareBag() {
    const tbody = document.getElementById('bag-tbody');
    if (!currentUser) return;
    try {
      const [invSnap, partsSnap] = await Promise.all([
        getDocs(query(collection(db, 'inventory'), where('location', '==', 'technician'), where('technicianUid', '==', currentUser.uid))),
        getDocs(collection(db, 'spareParts'))
      ]);
      const partMap = {};
      partsSnap.forEach(d => { partMap[d.id] = d.data(); });
      const rows = [];
      invSnap.forEach(d => rows.push(d.data()));
      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="empty-row">Your spare bag is empty — log parts as you receive them.</td></tr>`;
        return;
      }
      tbody.innerHTML = '';
      rows.forEach(r => {
        const part = partMap[r.partId];
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-size:12px;color:var(--stone);">${part ? part.partCode : r.partId}</td>
          <td>${part ? part.name : '—'}</td>
          <td><b>${r.quantity ?? 0}</b></td>`;
        tbody.appendChild(tr);
      });
    } catch (err) {
      console.error('Load spare bag failed:', err);
      tbody.innerHTML = `<tr><td colspan="3" class="empty-row" style="color:var(--err);">Couldn't load your spare bag. Check console for details.</td></tr>`;
    }
  }

  const bagOverlay = document.getElementById('bag-overlay');
  const bagForm = document.getElementById('bag-form');
  const bagError = document.getElementById('bag-error');
  const bagSuccess = document.getElementById('bag-success');
  const bagSubmitBtn = document.getElementById('submit-bag');
  const bagPartSelect = document.getElementById('bag-part-id');

  async function populateBagPartOptions() {
    if (bagPartSelect.dataset.loaded === 'true') return;
    try {
      const snap = await getDocs(collection(db, 'spareParts'));
      snap.forEach(docSnap => {

        const opt = document.createElement('option');
        opt.value = docSnap.id;

        bagPartSelect.appendChild(opt);

      console.error('Load parts for spare bag failed:', err);

  function openBagModal() {
    bagForm.reset();
    bagError.classList.remove('show');
    bagSuccess.classList.remove('show');
    bagSubmitBtn.disabled = false;
    bagSubmitBtn.textContent = 'Save';
    populateBagPartOptions();
    bagOverlay.classList.add('show');
  }
  function closeBagModal() { bagOverlay.classList.remove('show'); }
  document.getElementById('cancel-bag').addEventListener('click', closeBagModal);
  bagOverlay.addEventListener('click', (e) => { if (e.target === bagOverlay) closeBagModal(); });

  bagForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    bagError.classList.remove('show');
    bagSuccess.classList.remove('show');
    if (!bagPartSelect.value || !currentUser) {
      bagError.textContent = 'Select a part.';
      bagError.classList.add('show');
      return;
    }
    const partId = bagPartSelect.value;
    const type = document.getElementById('bag-type').value;
    const qty = Number(document.getElementById('bag-qty').value) || 0;
    if (qty <= 0) {
      bagError.textContent = 'Enter a quantity greater than 0.';
      bagError.classList.add('show');
      return;
    }
    bagSubmitBtn.disabled = true;
    bagSubmitBtn.textContent = 'Saving…';
    const invRef = doc(db, 'inventory', `technician_${currentUser.uid}_${partId}`);
    try {
      await runTransaction(db, async (transaction) => {
        const snap = await transaction.get(invRef);
        const current = snap.exists() ? (snap.data().quantity || 0) : 0;
        const delta = type === 'add' ? qty : -qty;
        const next = Math.max(0, current + delta);
        transaction.set(invRef, {
          partId, location: 'technician', technicianUid: currentUser.uid, quantity: next, updatedAt: serverTimestamp()
        }, { merge: true });
      });
      await addDoc(collection(db, 'stockMovements'), {
        partId, type: type === 'add' ? 'receive' : 'issue', location: 'technician',
        technicianUid: currentUser.uid, quantity: qty,
        reason: document.getElementById('bag-notes').value.trim(),
        createdAt: serverTimestamp()
      });
      bagSuccess.textContent = 'Spare bag updated.';
      bagSuccess.classList.add('show');
      bagSubmitBtn.disabled = false;
      bagSubmitBtn.textContent = 'Save';
      if (document.getElementById('bag-tbody')) loadSpareBag();
      setTimeout(closeBagModal, 800);
    } catch (err) {
      console.error('Update spare bag failed:', err);
      bagError.textContent = 'Could not update spare bag. Check console for details.';
      bagError.classList.add('show');
      bagSubmitBtn.disabled = false;
      bagSubmitBtn.textContent = 'Save';
    }
  });

  // ---------------------------------------------------------------
  // Claims — a technician's own reimbursement claims. Writes into
  // the SAME `claims` collection Head Office's Claims module reads,
  // tagged claimantType: 'technician' and scoped by claimantUid.
  // ---------------------------------------------------------------

  const CLAIM_STATUS_LABELS_T = { submitted: 'Submitted', verified: 'Verified', settled: 'Settled', rejected: 'Rejected' };

  async function generateClaimId() {
    const d = new Date();
    const monthKey = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}`;
    const counterRef = doc(db, 'counters', `claim-${monthKey}`);
    const next = await runTransaction(db, async (transaction) => {
      const snap = await transaction.get(counterRef);
      const n = (snap.exists() ? snap.data().value : 0) + 1;
      if (snap.exists()) transaction.update(counterRef, { value: n });
      else transaction.set(counterRef, { value: n });
      return n;
    });
    const dateStr = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    return `PE-CL-${dateStr}-${String(next).padStart(4, '0')}-Technician`;
  }

    contentEl.innerHTML = `
      <div class="panel">

        </div>
        <div class="panel-body" style="padding:0;">
          <table>

          </table>
        </div>
      </div>`;
    document.getElementById('open-tclaim').addEventListener('click', openTClaimModal);

  async function loadTechnicianClaims() {
    const tbody = document.getElementById('tclaims-tbody');
    if (!currentUser) return;
    try {
      const snap = await getDocs(query(
        collection(db, 'claims'),
        where('claimantUid', '==', currentUser.uid)
      ));
      if (snap.empty) {
        tbody.innerHTML = `<tr><td colspan="4" class="empty-row">You haven't submitted any claims yet.</td></tr>`;
        return;
      }
      let docs = [];
      snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
      docs.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      tbody.innerHTML = '';
      docs.forEach(d => {
        const tr = document.createElement('tr');
        const pillClass = d.status === 'settled' ? 'completed' : d.status === 'verified' ? 'in_progress' : d.status === 'rejected' ? 'cancelled' : 'assigned';
        tr.innerHTML = `
          <td style="font-size:12px;color:var(--stone);">${d.claimId || d.id}</td>
          <td>${d.description || '—'}</td>
          <td>₹${d.amount ?? '—'}</td>
          <td><span class="status-pill ${pillClass}">${CLAIM_STATUS_LABELS_T[d.status] || d.status}</span></td>`;
        tbody.appendChild(tr);
      });
    } catch (err) {
      console.error('Load claims failed:', err);
      tbody.innerHTML = `<tr><td colspan="4" class="empty-row" style="color:var(--err);">Couldn't load claims. Check console for details.</td></tr>`;
    }
  }

    contentEl.innerHTML = `
      <div class="stat-grid">
        <div class="stat-card"><div class="label">Completed</div><div class="value" id="perf-completed">…</div><div class="hint">All time</div></div>
        <div class="stat-card"><div class="label">Cancelled</div><div class="value" id="perf-cancelled">…</div><div class="hint">All time</div></div>
        <div class="stat-card"><div class="label">Completion Rate</div><div class="value" id="perf-rate">…</div><div class="hint">Completed vs. cancelled</div></div>
        <div class="stat-card"><div class="label">Total Jobs</div><div class="value" id="perf-total">…</div><div class="hint">All time</div></div>
      </div>`;
    if (!currentUser) return;
    try {
      const snap = await getDocs(query(collection(db, 'serviceJobs'), where('technicianUid', '==', currentUser.uid)));
      let completed = 0, cancelled = 0, total = 0;
      snap.forEach(d => {
        total++;
        if (d.data().status === 'completed') completed++;
        if (d.data().status === 'cancelled') cancelled++;
      });
      const denom = completed + cancelled;
      const rate = denom > 0 ? Math.round((completed / denom) * 100) + '%' : '—';
      document.getElementById('perf-completed').textContent = completed;
      document.getElementById('perf-cancelled').textContent = cancelled;
      document.getElementById('perf-rate').textContent = rate;
      document.getElementById('perf-total').textContent = total;
    } catch (err) {
      console.error('Load performance failed:', err);
    }
  }

  // ---------------------------------------------------------------
  // Profile — self-editable name/phone/skills/brand authorization,
  // stored on the technician's own users/{uid} doc. Role itself is
  // never editable here (rules enforce this server-side too).
  // ---------------------------------------------------------------

  async function renderProfile() {
    contentEl.innerHTML = `
      <div class="panel">
        <div class="panel-header"><h2>Your profile</h2></div>
        <div class="panel-body">
          <div class="form-row"><label>Name</label><input type="text" id="profile-name"></div>
          <div class="form-row"><label>Email</label><input type="text" id="profile-email" disabled style="opacity:0.6;"></div>
          <div class="form-row"><label>Phone</label><input type="text" id="profile-phone"></div>
          <div class="form-row"><label>Skills</label><input type="text" id="profile-skills" placeholder="e.g. Geyser repair, electrical wiring"></div>
          <div class="form-row"><label>Brand authorization</label><input type="text" id="profile-brands" placeholder="e.g. MakWell, Flyvision"></div>
          <div class="modal-error" id="profile-error"></div>
          <div class="modal-success" id="profile-success"></div>
          <button class="btn-primary" id="save-profile" style="margin-top:8px;">Save changes</button>
        </div>
      </div>`;
    if (!currentUser) return;
    try {
      const snap = await getDoc(doc(db, 'users', currentUser.uid));
      const d = snap.exists() ? snap.data() : {};
      document.getElementById('profile-name').value = d.name || '';
      document.getElementById('profile-email').value = currentUser.email || '';
      document.getElementById('profile-phone').value = d.phone || '';
      document.getElementById('profile-skills').value = d.skills || '';
      document.getElementById('profile-brands').value = d.brandAuthorization || '';
    } catch (err) {
      console.error('Load profile failed:', err);
    }
    document.getElementById('save-profile').addEventListener('click', async () => {
      const btn = document.getElementById('save-profile');
      const errEl = document.getElementById('profile-error');
      const okEl = document.getElementById('profile-success');
      errEl.classList.remove('show');
      okEl.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Saving…';
      try {
        await setDoc(doc(db, 'users', currentUser.uid), {
          name: document.getElementById('profile-name').value.trim(),
          phone: document.getElementById('profile-phone').value.trim(),
          skills: document.getElementById('profile-skills').value.trim(),
          brandAuthorization: document.getElementById('profile-brands').value.trim(),
        }, { merge: true });
        okEl.textContent = 'Saved.';
        okEl.classList.add('show');
      } catch (err) {
        console.error('Save profile failed:', err);
        errEl.textContent = 'Could not save your profile. Check console for details.';
        errEl.classList.add('show');
      }
      btn.disabled = false;
      btn.textContent = 'Save changes';
    });
  }

  // ---------------------------------------------------------------
  // Notifications — uid-targeted, personal to the signed-in technician. Achievable slice of "Communication"
  // without a real WhatsApp/SMS/Email provider connected.
  // ---------------------------------------------------------------

  let notifUnsubscribeTimer = null;

  function notifQueryConfig() {
    if (!currentUser) return null;
    return { type: 'uid', value: currentUser.uid };
  }

  async function loadNotifications() {
    const cfg = notifQueryConfig();
    if (!cfg) return;
    const listEl = document.getElementById('notif-list');
    const badgeEl = document.getElementById('notif-badge');
    try {
      // No orderBy here on purpose — combining it with the two where()
      // clauses needs a composite index that doesn't exist by default
      // in Firestore. Sorting client-side avoids that requirement
      // entirely; a person's notification list is small enough that
      // this costs nothing in practice.
      const snap = await getDocs(query(
        collection(db, 'notifications'),
        where('recipientType', '==', cfg.type),
        where('recipientValue', '==', cfg.value)
      ));
      const items = [];
      snap.forEach(d => items.push({ id: d.id, ...d.data() }));
      items.sort((a, b) => {
        const at = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
        const bt = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
        return bt - at;
      });
      const unreadCount = items.filter(n => !n.read).length;
      if (unreadCount > 0) {
        badgeEl.textContent = unreadCount > 9 ? '9+' : unreadCount;
        badgeEl.style.display = 'block';
      } else {
        badgeEl.style.display = 'none';
      }
      if (items.length === 0) {
        listEl.innerHTML = '<div class="notif-empty">No notifications yet.</div>';
        return;
      }
      listEl.innerHTML = '';
      items.slice(0, 25).forEach(n => {
        const el = document.createElement('div');
        el.className = 'notif-item' + (n.read ? '' : ' unread');
        const dateStr = n.createdAt && n.createdAt.toDate ? n.createdAt.toDate().toLocaleString() : '';
        el.innerHTML = `<div class="title">${n.title || 'Notification'}</div><div class="msg">${escapeHtml(n.message || '')}</div><div class="time">${dateStr}</div>`;
        el.addEventListener('click', async () => {
          if (!n.read) {
            try { await updateDoc(doc(db, 'notifications', n.id), { read: true }); n.read = true; loadNotifications(); } catch (err) { console.error('Mark read failed:', err); }
          }
        });
        listEl.appendChild(el);
      });
    } catch (err) {
      console.error('Load notifications failed:', err);
      listEl.innerHTML = '<div class="notif-empty">Couldn\'t load notifications.</div>';
    }
  }

  const notifBellBtn = document.getElementById('notif-bell-btn');
  const notifPanel = document.getElementById('notif-panel');
  if (notifBellBtn) {
    notifBellBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      notifPanel.classList.toggle('show');
      if (notifPanel.classList.contains('show')) loadNotifications();
    });
    document.addEventListener('click', (e) => {
      if (!notifPanel.contains(e.target) && e.target !== notifBellBtn) notifPanel.classList.remove('show');
    });
    document.getElementById('notif-mark-all').addEventListener('click', async (e) => {
      e.stopPropagation();
      const cfg = notifQueryConfig();
      if (!cfg) return;
      try {
        const snap = await getDocs(query(collection(db, 'notifications'), where('recipientType', '==', cfg.type), where('recipientValue', '==', cfg.value), where('read', '==', false)));
        await Promise.all(snap.docs.map(d => updateDoc(doc(db, 'notifications', d.id), { read: true })));
        loadNotifications();
      } catch (err) { console.error('Mark all read failed:', err); }
    });
  }

  if (notifUnsubscribeTimer) clearInterval(notifUnsubscribeTimer);
  notifUnsubscribeTimer = setInterval(loadNotifications, 60000);

  renderNav();
  setActiveNav('dashboard');
</script>
</body>
</html>
