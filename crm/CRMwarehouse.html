<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Head Office / Warehouse — Pushpak Enterprises CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#25292E;--paper:#F5EFE0;--paper-deep:#EDE3CC;--stone:#7A7565;--hairline:#E0D6BC;
    --blue:#1C6FBA;--blue-deep:#0F4C88;
    --err:#B3261E;--ok:#1C7A46;--sidebar-w:264px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}

  #gate{
    position:fixed;inset:0;background:var(--paper);z-index:100;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--stone);
  }
  #app{display:none;}

  .layout{display:flex;min-height:100vh;}
  .sidebar{
    width:var(--sidebar-w);flex-shrink:0;background:var(--blue-deep);color:var(--paper);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .sidebar-header{padding:22px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.1);}
  .sidebar-header img{width:30px;height:30px;flex-shrink:0;}
  .sidebar-header .name{font-size:13px;font-weight:700;}
  .sidebar-header .role{font-size:11px;color:#C9D6E4;}
  .nav-group{padding:14px 10px 4px;}
  .nav-group-label{font-size:10.5px;font-weight:700;letter-spacing:0.05em;color:#9FB4C8;padding:6px 12px;text-transform:uppercase;}
  .nav-item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:9px 12px;border-radius:3px;font-size:13px;font-weight:500;color:#E3EAF1;
    cursor:pointer;transition:background .15s;
  }
  .nav-item:hover{background:rgba(255,255,255,0.08);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,0.16);color:#fff;font-weight:600;}
  .nav-badge{font-size:9.5px;background:rgba(255,255,255,0.12);color:#C9D6E4;padding:2px 6px;border-radius:20px;}
  .sidebar-footer{margin-top:auto;padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);}
  .sidebar-footer .email{font-size:11.5px;color:#C9D6E4;margin-bottom:10px;word-break:break-all;}
  .logout-btn{
    width:100%;background:transparent;border:1px solid rgba(255,255,255,0.25);color:#E3EAF1;
    padding:9px;border-radius:3px;font-size:12.5px;font-weight:600;
  }
  .logout-btn:hover{background:rgba(255,255,255,0.1);}

  .main{flex:1;min-width:0;}
  .topbar{
    padding:18px 32px;border-bottom:1px solid var(--hairline);
    display:flex;align-items:center;justify-content:space-between;
  }
  .topbar h1{font-size:20px;font-weight:800;letter-spacing:-0.01em;}
  .topbar .sub{font-size:13px;color:var(--stone);margin-top:2px;}
  .content{padding:32px;}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hairline);border:1px solid var(--hairline);margin-bottom:32px;}
  .stat-card{background:var(--paper);padding:22px 20px;}
  .stat-card .label{font-size:12px;color:var(--stone);font-weight:600;margin-bottom:8px;}
  .stat-card .value{font-size:28px;font-weight:800;letter-spacing:-0.01em;}
  .stat-card .hint{font-size:11.5px;color:var(--stone);margin-top:4px;}
  @media (max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}

  .panel{border:1px solid var(--hairline);border-radius:2px;}
  .panel-header{padding:18px 22px;border-bottom:1px solid var(--hairline);display:flex;justify-content:space-between;align-items:center;}
  .panel-header h2{font-size:15px;font-weight:700;}
  .panel-body{padding:22px;}

  .coming-soon{
    border:1px dashed var(--hairline);border-radius:2px;padding:60px 30px;text-align:center;color:var(--stone);
  }
  .coming-soon .big{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px;}
  .coming-soon .small{font-size:13px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11.5px;font-weight:700;color:var(--stone);text-transform:uppercase;letter-spacing:0.03em;padding:10px 14px;border-bottom:1px solid var(--hairline);}
  td{padding:12px 14px;border-bottom:1px solid var(--hairline);vertical-align:top;}
  tr:last-child td{border-bottom:none;}

  .btn-primary{background:var(--blue);color:#fff;font-weight:600;font-size:13.5px;padding:10px 18px;border:none;border-radius:2px;}
  .btn-primary:disabled{opacity:0.6;cursor:default;}
  .btn-secondary{background:transparent;border:1px solid var(--hairline);font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:2px;}
  .btn-danger{background:transparent;border:1px solid var(--err);color:var(--err);font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:2px;}

  .status-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .status-pill.new{background:#DCEAF6;color:var(--blue-deep);}
  .status-pill.approved{background:#DCEAF6;color:var(--blue-deep);}
  .status-pill.picking{background:var(--paper-deep);color:var(--ink);}
  .status-pill.packing{background:var(--paper-deep);color:var(--ink);}
  .status-pill.dispatched{background:#D9EEE0;color:var(--ok);}
  .status-pill.intransit{background:#D9EEE0;color:var(--ok);}
  .status-pill.received{background:#D9EEE0;color:var(--ok);}
  .status-pill.backorder{background:#F6DCDC;color:var(--err);}
  .status-pill.ok{background:#D9EEE0;color:var(--ok);}
  .status-pill.low{background:#FBEAD2;color:#9A6A15;}
  .status-pill.out{background:#F6DCDC;color:var(--err);}

  .priority-tag{font-size:10.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;}
  .priority-tag.urgent{color:var(--err);}
  .priority-tag.normal{color:var(--stone);}

  .row-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,21,26,0.5);display:none;
    align-items:center;justify-content:center;z-index:50;
  }
  .modal-overlay.show{display:flex;}
  .modal{background:var(--paper);width:100%;max-width:440px;border-radius:3px;padding:28px;max-height:88vh;overflow-y:auto;}
  .modal h3{font-size:16px;font-weight:800;margin-bottom:18px;}
  .form-row{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
  .form-row label{font-size:12px;font-weight:600;color:var(--stone);}
  .form-row input,.form-row select,.form-row textarea{border:1px solid var(--hairline);padding:10px 12px;font-size:13.5px;border-radius:2px;font-family:inherit;background:#fff;}
  .form-row textarea{resize:vertical;min-height:70px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
  .modal-error{font-size:12.5px;color:var(--err);margin-top:6px;display:none;}
  .modal-error.show{display:block;}
  .modal-success{font-size:12.5px;color:var(--ok);margin-top:6px;display:none;}
  .modal-success.show{display:block;}
  .empty-row{text-align:center;color:var(--stone);padding:32px;}
</style>
</head>
<body>

<div id="gate">Checking your session…</div>

<div id="app">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../assets/logos/pushpak-enterprises-icon.png" alt="">
        <div>
          <div class="name">Pushpak Enterprises</div>
          <div class="role">Head Office / Warehouse</div>
        </div>
      </div>

      <div id="nav-container"></div>

      <div class="sidebar-footer">
        <div class="email" id="user-email"></div>
        <button class="logout-btn" id="logout-btn">Sign out</button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div>
          <h1 id="page-title">Dashboard</h1>
          <div class="sub" id="page-sub">Welcome back</div>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<!-- New Spare Request modal -->
<div class="modal-overlay" id="new-request-overlay">
  <div class="modal">
    <h3>New spare request</h3>
    <form id="new-request-form">
      <div class="form-row">
        <label>Requesting Service Center</label>
        <input type="text" id="req-center" placeholder="e.g. Hubli Service Center" required>
      </div>
      <div class="form-row">
        <label>Part / item</label>
        <input type="text" id="req-item" placeholder="e.g. Geyser thermostat, 15L" required>
      </div>
      <div class="form-row">
        <label>Quantity</label>
        <input type="number" id="req-qty" min="1" value="1" required>
      </div>
      <div class="form-row">
        <label>Priority</label>
        <select id="req-priority">
          <option value="normal">Normal</option>
          <option value="urgent">Urgent</option>
        </select>
      </div>
      <div class="form-row">
        <label>Notes (optional)</label>
        <textarea id="req-notes" placeholder="Any additional context…"></textarea>
      </div>
      <div class="modal-error" id="new-request-error"></div>
      <div class="modal-success" id="new-request-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-new-request">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-new-request">Create request</button>
      </div>
    </form>
  </div>
</div>

<!-- Add/Edit Spare Part modal -->
<div class="modal-overlay" id="part-overlay">
  <div class="modal">
    <h3 id="part-modal-title">Add spare part</h3>
    <form id="part-form">
      <input type="hidden" id="part-editing-id">
      <div class="form-row">
        <label>Part name</label>
        <input type="text" id="part-name" placeholder="e.g. Geyser thermostat, 15L" required>
      </div>
      <div class="form-row">
        <label>Category</label>
        <input type="text" id="part-category" placeholder="e.g. Thermostat, Heating Element, Valve">
      </div>
      <div class="form-row">
        <label>Brand compatibility</label>
        <select id="part-brand">
          <option value="All">All brands</option>
          <option value="MakWell">MakWell</option>
          <option value="Flyvision">Flyvision</option>
          <option value="Skevia">Skevia</option>
        </select>
      </div>
      <div class="form-row">
        <label>Price (₹)</label>
        <input type="number" id="part-price" min="0" step="0.01">
      </div>
      <div class="form-row">
        <label>Reorder level</label>
        <input type="number" id="part-reorder" min="0" value="5">
      </div>
      <div class="modal-error" id="part-error"></div>
      <div class="modal-success" id="part-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-part">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-part">Save part</button>
      </div>
    </form>
  </div>
</div>

<!-- Adjust Stock modal -->
<div class="modal-overlay" id="adjust-overlay">
  <div class="modal">
    <h3>Adjust Head Office stock</h3>
    <div style="font-size:13px;color:var(--stone);margin-bottom:16px;" id="adjust-part-label"></div>
    <form id="adjust-form">
      <input type="hidden" id="adjust-part-id">
      <div class="form-row">
        <label>Action</label>
        <select id="adjust-type">
          <option value="add">Add stock (received)</option>
          <option value="remove">Remove stock (issued/used)</option>
        </select>
      </div>
      <div class="form-row">
        <label>Quantity</label>
        <input type="number" id="adjust-qty" min="1" value="1" required>
      </div>
      <div class="form-row">
        <label>Reason / notes (optional)</label>
        <input type="text" id="adjust-reason" placeholder="e.g. Purchased from supplier, or issued to SC-Hubli">
      </div>
      <div class="modal-error" id="adjust-error"></div>
      <div class="modal-success" id="adjust-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-adjust">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-adjust">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- New Local Purchase modal -->
<div class="modal-overlay" id="lp-overlay">
  <div class="modal">
    <h3>New local purchase request</h3>
    <form id="lp-form">
      <div class="form-row">
        <label>Item / part needed</label>
        <input type="text" id="lp-item" placeholder="e.g. Geyser thermostat, 15L" required>
      </div>
      <div class="form-row">
        <label>Quantity</label>
        <input type="number" id="lp-qty" min="1" value="1" required>
      </div>
      <div class="form-row">
        <label>Estimated amount (₹)</label>
        <input type="number" id="lp-amount" min="0" step="0.01" required>
      </div>
      <div class="form-row">
        <label>Requested by</label>
        <input type="text" id="lp-requestedby" placeholder="e.g. your name or center name" required>
      </div>
      <div class="form-row">
        <label style="display:flex;align-items:center;gap:8px;font-weight:600;">
          <input type="checkbox" id="lp-emergency-flag" style="width:auto;">
          This is an emergency purchase
        </label>
      </div>
      <div class="form-row">
        <label>Notes (optional)</label>
        <textarea id="lp-notes" placeholder="Why this is needed, vendor info, etc."></textarea>
      </div>
      <div class="modal-error" id="lp-error"></div>
      <div class="modal-success" id="lp-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-lp">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-lp">Create request</button>
      </div>
    </form>
  </div>
</div>

<!-- Invoice submission modal -->
<div class="modal-overlay" id="lp-invoice-overlay">
  <div class="modal">
    <h3>Submit invoice</h3>
    <div style="font-size:13px;color:var(--stone);margin-bottom:16px;" id="lp-invoice-label"></div>
    <form id="lp-invoice-form">
      <input type="hidden" id="lp-invoice-doc-id">
      <div class="form-row">
        <label>Vendor name</label>
        <input type="text" id="lp-vendor" required>
      </div>
      <div class="form-row">
        <label>Invoice number</label>
        <input type="text" id="lp-invoice-number" required>
      </div>
      <div class="form-row">
        <label>Actual amount (₹)</label>
        <input type="number" id="lp-actual-amount" min="0" step="0.01" required>
      </div>
      <div class="modal-error" id="lp-invoice-error"></div>
      <div class="modal-success" id="lp-invoice-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-lp-invoice">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-lp-invoice">Submit invoice</button>
      </div>
    </form>
  </div>
</div>

<!-- New Claim modal -->
<div class="modal-overlay" id="claim-overlay">
  <div class="modal">
    <h3>New claim</h3>
    <form id="claim-form">
      <div class="form-row">
        <label>Claimant type</label>
        <select id="claim-type" required>
          <option value="technician">Technician</option>
          <option value="servicecenter">Service Center</option>
        </select>
      </div>
      <div class="form-row">
        <label>Claimant name</label>
        <input type="text" id="claim-name" placeholder="e.g. Ramesh K., or Hubli Service Center" required>
      </div>
      <div class="form-row">
        <label>Description</label>
        <input type="text" id="claim-description" placeholder="e.g. Travel expense for on-site repair" required>
      </div>
      <div class="form-row">
        <label>Amount (₹)</label>
        <input type="number" id="claim-amount" min="0" step="0.01" required>
      </div>
      <div class="form-row">
        <label>Notes (optional)</label>
        <textarea id="claim-notes" placeholder="Any additional context…"></textarea>
      </div>
      <div class="modal-error" id="claim-error"></div>
      <div class="modal-success" id="claim-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-claim">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-claim">Create claim</button>
      </div>
    </form>
  </div>
</div>

<!-- New Return modal -->
<div class="modal-overlay" id="return-overlay">
  <div class="modal">
    <h3>Log a return</h3>
    <form id="return-form">
      <div class="form-row">
        <label>Part</label>
        <select id="return-part-id" required>
          <option value="">Select a part…</option>
        </select>
      </div>
      <div class="form-row">
        <label>Quantity</label>
        <input type="number" id="return-qty" min="1" value="1" required>
      </div>
      <div class="form-row">
        <label>Returned from</label>
        <input type="text" id="return-source" placeholder="e.g. Service Center - Hubli, or Technician - Ramesh" required>
      </div>
      <div class="form-row">
        <label>Reason</label>
        <input type="text" id="return-reason" placeholder="e.g. Damaged in transit, excess stock, wrong part" required>
      </div>
      <div class="form-row">
        <label>Notes (optional)</label>
        <textarea id="return-notes" placeholder="Any additional context…"></textarea>
      </div>
      <div class="modal-error" id="return-error"></div>
      <div class="modal-success" id="return-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-return">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-return">Log return</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, collection, getDocs, query, where, orderBy, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCRqUdrKe2U2wF_4LI-6Yl7zdgmE5YhvQY",
    authDomain: "makwell-websiteandcrm.firebaseapp.com",
    projectId: "makwell-websiteandcrm",
    storageBucket: "makwell-websiteandcrm.firebasestorage.app",
    messagingSenderId: "673518655103",
    appId: "1:673518655103:web:1805d10de3c63eca23914a",
    measurementId: "G-YLM91W3YF1"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const gate = document.getElementById('gate');
  const appEl = document.getElementById('app');
  const userEmailEl = document.getElementById('user-email');

  const ALLOWED_ROLE = 'headoffice';

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }
    try {
      const roleSnap = await getDoc(doc(db, 'users', user.uid));
      if (!roleSnap.exists() || roleSnap.data().role !== ALLOWED_ROLE) {
        await signOut(auth);
        window.location.href = 'login.html';
        return;
      }
    } catch (err) {
      console.error('Role check failed:', err);
      window.location.href = 'login.html';
      return;
    }
    userEmailEl.textContent = user.email;
    gate.style.display = 'none';
    appEl.style.display = 'block';
    renderDashboard();
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = 'login.html';
  });

  const NAV = [{"group": "Overview", "items": [{"id": "dashboard", "label": "Dashboard", "built": true}]}, {"group": "Spare Requests", "items": [{"id": "requests-new", "label": "New Requests"}, {"id": "requests-approved", "label": "Approved"}, {"id": "requests-picking", "label": "Picking"}, {"id": "requests-packing", "label": "Packing"}, {"id": "requests-dispatch", "label": "Dispatch"}, {"id": "requests-transit", "label": "In Transit"}, {"id": "requests-backorder", "label": "Back Order"}]}, {"group": "Inventory", "items": [{"id": "inv-headoffice", "label": "Head Office Stock"}, {"id": "inv-servicecenter", "label": "Service Center Stock"}, {"id": "inv-technician", "label": "Technician Stock"}, {"id": "inv-summary", "label": "Stock Summary"}, {"id": "inv-lowstock", "label": "Low / Out of Stock"}, {"id": "inv-damaged", "label": "Damaged / Returned"}]}, {"group": "Stock Movement", "items": [{"id": "move-receive", "label": "Receive"}, {"id": "move-issue", "label": "Issue"}, {"id": "move-transfer", "label": "Transfer"}, {"id": "move-adjust", "label": "Adjustment"}, {"id": "move-history", "label": "Movement History"}]}, {"group": "Parts & Purchase", "items": [{"id": "spareparts", "label": "Spare Parts"}, {"id": "lp-new", "label": "New Requests"}, {"id": "lp-emergency", "label": "Emergency Purchase"}, {"id": "lp-invoice", "label": "Invoice Verification"}, {"id": "lp-claims", "label": "Claim Processing"}, {"id": "lp-history", "label": "Local Purchase History"}, {"id": "claims-technician", "label": "Technician Claims"}, {"id": "claims-servicecenter", "label": "Service Center Claims"}, {"id": "claims-verification", "label": "Claims Verification"}, {"id": "claims-history", "label": "Claims History"}, {"id": "returns-intake", "label": "Returns"}, {"id": "returns-defective", "label": "Defective Parts"}, {"id": "returns-supplier", "label": "Supplier Returns"}, {"id": "returns-disposal", "label": "Disposal"}]}, {"group": "Operations", "items": [{"id": "servicevis", "label": "Service Visibility"}, {"id": "masterdata", "label": "Master Data"}, {"id": "reports", "label": "Reports"}, {"id": "auditlogs", "label": "Audit Logs"}, {"id": "profile", "label": "Profile"}]}];

  const navContainer = document.getElementById('nav-container');
  const pageTitle = document.getElementById('page-title');
  const pageSub = document.getElementById('page-sub');
  const contentEl = document.getElementById('content');

  function renderNav() {
    navContainer.innerHTML = '';
    NAV.forEach(group => {
      const groupEl = document.createElement('div');
      groupEl.className = 'nav-group';
      const label = document.createElement('div');
      label.className = 'nav-group-label';
      label.textContent = group.group;

  // Request ID format matches the site's ticket convention:
  // PE-SR-{YYYYMMDD}-{Serial}-{Mode}. Serial resets monthly via an
  // atomic Firestore transaction (counters/sparerequest-{YYYYMM}),
  // same collision-safe pattern used for public enquiry tickets.
  function todayYYYYMMDD() {
    const d = new Date();
    return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  }
  function currentYYYYMM() {
    const d = new Date();
    return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}`;
  }
  async function nextMonthlySerial(counterKey) {
    const counterRef = doc(db, 'counters', counterKey);
    return runTransaction(db, async (transaction) => {
      const snap = await transaction.get(counterRef);
      const next = (snap.exists() ? snap.data().value : 0) + 1;
      if (snap.exists()) transaction.update(counterRef, { value: next });
      else transaction.set(counterRef, { value: next });
      return next;
    });
  }
  async function generateRequestId() {
    const serial = await nextMonthlySerial(`sparerequest-${currentYYYYMM()}`);
    return `PE-SR-${todayYYYYMMDD()}-${String(serial).padStart(4, '0')}-Warehouse`;
  }

  async function generatePartCode() {
    const counterRef = doc(db, 'counters', 'sparepart-master');
    const next = await runTransaction(db, async (transaction) => {
      const snap = await transaction.get(counterRef);
      const n = (snap.exists() ? snap.data().value : 0) + 1;
      if (snap.exists()) transaction.update(counterRef, { value: n });
      else transaction.set(counterRef, { value: n });
      return n;
    });
    return `SP-${String(next).padStart(4, '0')}`;
  }

  // ---------------------------------------------------------------
  // Inventory — Head Office stock, Stock Summary, Low/Out of Stock.
  // One inventory doc per part at Head Office, id = `headoffice_{partId}`,
  // so adjustments upsert cleanly. Each adjustment also logs a
  // stockMovements entry — groundwork for the future Stock Movement /
  // Movement History module.
  // ---------------------------------------------------------------

  async function getHeadOfficeInventoryMap() {
    const snap = await getDocs(query(collection(db, 'inventory'), where('location', '==', 'headoffice')));
    const map = {};
    snap.forEach(d => { map[d.data().partId] = { id: d.id, ...d.data() }; });
    return map;
  }

  function stockStatus(qty, reorderLevel) {
    if (qty <= 0) return { cls: 'out', label: 'Out of stock' };
    if (qty <= reorderLevel) return { cls: 'low', label: 'Low' };
    return { cls: 'ok', label: 'OK' };
  }

  async function renderInventory(view) {

      headoffice: 'Head Office stock',

  async function loadInventory(view) {
    const tbody = document.getElementById('inventory-tbody');
    try {
      const [partsSnap, invMap] = await Promise.all([
        getDocs(query(collection(db, 'spareParts'), orderBy('createdAt', 'desc'))),
        getHeadOfficeInventoryMap()
      ]);
      let rows = [];
      partsSnap.forEach(docSnap => {
        const part = { id: docSnap.id, ...docSnap.data() };
        const inv = invMap[part.id];
        const qty = inv ? inv.quantity : 0;
        rows.push({ part, qty });
      });
      if (view === 'low') {
        rows = rows.filter(r => r.qty <= (r.part.reorderLevel || 0));
      }
      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-row">${sparePartsCache.length === 0 && rows.length === 0 ? 'No parts in the master list yet — add parts first.' : 'Nothing to show here.'}</td></tr>`;
        return;
      }
      tbody.innerHTML = '';
      rows.forEach(({ part, qty }) => {
        const status = stockStatus(qty, part.reorderLevel || 0);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-size:12px;color:var(--stone);">${part.partCode || part.id}</td>
          <td>${part.name || '—'}</td>
          <td>${part.category || '—'}</td>

          <td>${part.reorderLevel ?? 0}</td>

          tr.querySelector('.adjust-btn').addEventListener('click', (e) => {
            openAdjustModal(e.target.dataset.id, e.target.dataset.name, e.target.dataset.code);

      console.error('Load inventory failed:', err);
      tbody.innerHTML = `<tr><td colspan="7" class="empty-row" style="color:var(--err);">Couldn't load inventory. Check console for details.</td></tr>`;
    }

  function closeAdjustModal() { adjustOverlay.classList.remove('show'); }
  document.getElementById('cancel-adjust').addEventListener('click', closeAdjustModal);
  adjustOverlay.addEventListener('click', (e) => { if (e.target === adjustOverlay) closeAdjustModal(); });

  adjustForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    adjustError.classList.remove('show');
    adjustSuccess.classList.remove('show');
    const partId = document.getElementById('adjust-part-id').value;
    const type = document.getElementById('adjust-type').value;
    const qty = Number(document.getElementById('adjust-qty').value) || 0;
    const reason = document.getElementById('adjust-reason').value.trim();

    adjustSubmitBtn.disabled = true;
    adjustSubmitBtn.textContent = 'Saving…';
    const invRef = doc(db, 'inventory', `headoffice_${partId}`);
    try {
      await runTransaction(db, async (transaction) => {
        const snap = await transaction.get(invRef);
        const current = snap.exists() ? (snap.data().quantity || 0) : 0;
        const delta = type === 'add' ? qty : -qty;
        const next = Math.max(0, current + delta);
        transaction.set(invRef, {
          partId, location: 'headoffice', quantity: next, updatedAt: serverTimestamp()
        }, { merge: true });
      });
      await addDoc(collection(db, 'stockMovements'), {
        partId, type: type === 'add' ? 'receive' : 'issue',
        location: 'headoffice', quantity: qty, reason,
        createdAt: serverTimestamp()
      });
      adjustSuccess.textContent = 'Stock updated.';
      adjustSuccess.classList.add('show');
      adjustSubmitBtn.disabled = false;
      adjustSubmitBtn.textContent = 'Save';
      const activeItem = document.querySelector('.nav-item.active');
      const activeId = activeItem ? activeItem.dataset.id : null;
      const viewMap = { 'inv-headoffice': 'headoffice', 'inv-summary': 'summary', 'inv-lowstock': 'low' };
      if (activeId && viewMap[activeId]) loadInventory(viewMap[activeId]);
      setTimeout(closeAdjustModal, 800);
    } catch (err) {
      console.error('Adjust stock failed:', err);
      adjustError.textContent = 'Could not update stock. Check console for details.';
      adjustError.classList.add('show');
      adjustSubmitBtn.disabled = false;
      adjustSubmitBtn.textContent = 'Save';
    }
  });

        </div>
      </div>`;
    loadMovementHistory(typeFilter);

  async function loadMovementHistory(typeFilter) {
    const tbody = document.getElementById('movement-tbody');
    try {
      const baseQuery = typeFilter
        ? query(collection(db, 'stockMovements'), where('type', '==', typeFilter), orderBy('createdAt', 'desc'))
        : query(collection(db, 'stockMovements'), orderBy('createdAt', 'desc'));
      const [movementsSnap, partsSnap] = await Promise.all([
        getDocs(baseQuery),
        getDocs(collection(db, 'spareParts'))
      ]);
      const partMap = {};
      partsSnap.forEach(d => { partMap[d.id] = d.data(); });

      if (movementsSnap.empty) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty-row">No movements recorded yet.</td></tr>`;
        return;
      }
      tbody.innerHTML = '';

        const part = partMap[d.partId];
        const dateStr = d.createdAt && d.createdAt.toDate ? d.createdAt.toDate().toLocaleString() : '—';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-size:12px;color:var(--stone);white-space:nowrap;">${dateStr}</td>

          <td><b>${d.quantity ?? '—'}</b></td>

          <td style="color:var(--stone);">${d.reason || '—'}</td>`;
        tbody.appendChild(tr);

    } catch (err) {
      console.error('Load movement history failed:', err);

  // Reimbursed, plus an Emergency cross-filter and a full History log.

  const LOCAL_PURCHASE_TABS = {
    'lp-new': 'requested',

    'lp-invoice': 'invoice_submitted',
    'lp-claims': 'verified',

  };

  async function generateLocalPurchaseId() {
    const counterKey = `localpurchase-${currentYYYYMM()}`;
    const counterRef = doc(db, 'counters', counterKey);
    const next = await runTransaction(db, async (transaction) => {
      const snap = await transaction.get(counterRef);
      const n = (snap.exists() ? snap.data().value : 0) + 1;
      if (snap.exists()) transaction.update(counterRef, { value: n });
      else transaction.set(counterRef, { value: n });
      return n;
    });
    return `PE-LP-${todayYYYYMMDD()}-${String(next).padStart(4, '0')}-Warehouse`;
  }

  async function renderLocalPurchase(filterValue, tabId, label) {
    const showActions = tabId !== 'lp-history';
    contentEl.innerHTML = `
      <div class="panel">
        <div class="panel-header">
          <h2>${label}</h2>
          <button class="btn-primary" id="open-lp-request">+ New Request</button>
        </div>
        <div class="panel-body" style="padding:0;">
          <table>
            <thead>
              <tr><th>Request ID</th><th>Item</th><th>Qty</th><th>Requested By</th><th>Amount</th><th>Emergency</th><th>Status</th>${showActions ? '<th>Actions</th>' : ''}</tr>

  async function loadLocalPurchases(filterValue, tabId, showActions) {
    const tbody = document.getElementById('lp-tbody');
    try {
      let snap;
      if (filterValue === 'ALL') {
        snap = await getDocs(query(collection(db, 'localPurchases'), orderBy('createdAt', 'desc')));
      } else if (filterValue === 'EMERGENCY') {
        snap = await getDocs(query(collection(db, 'localPurchases'), where('emergency', '==', true), orderBy('createdAt', 'desc')));
      } else {
        snap = await getDocs(query(collection(db, 'localPurchases'), where('status', '==', filterValue), orderBy('createdAt', 'desc')));
      }
      let docs = [];
      snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
      if (filterValue === 'EMERGENCY') {
        docs = docs.filter(d => d.status !== 'reimbursed');
      }
      if (docs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="empty-row">Nothing here.</td></tr>`;
        return;

      tbody.innerHTML = '';
      docs.forEach(d => {

        let actionHtml = '—';
        if (showActions) {
          if (d.status === 'requested') {
            actionHtml = `<button class="btn-secondary lp-invoice-btn" data-id="${d.id}" data-item="${(d.item || '').replace(/"/g, '&quot;')}" data-requestid="${d.requestId || ''}">Submit Invoice</button>`;
          } else if (d.status === 'invoice_submitted') {
            actionHtml = `<button class="btn-secondary lp-verify-btn" data-id="${d.id}">Verify Invoice</button>`;
          } else if (d.status === 'verified') {
            actionHtml = `<button class="btn-primary lp-reimburse-btn" data-id="${d.id}">Mark Reimbursed</button>`;
          } else {
            actionHtml = '—';

        tr.innerHTML = `
          <td style="font-size:12px;color:var(--stone);">${d.requestId || d.id}</td>
          <td>${d.item || '—'}</td>
          <td>${d.quantity ?? '—'}</td>
          <td>${d.requestedBy || '—'}</td>

          <td><span class="status-pill ${LP_STATUS_PILL_CLASS[d.status] || ''}">${LP_STATUS_LABELS[d.status] || d.status}</span></td>

        tbody.appendChild(tr);

      tbody.innerHTML = `<tr><td colspan="8" class="empty-row" style="color:var(--err);">Couldn't load requests. Check console for details.</td></tr>`;
    }
  }

  async function loadClaims(filterValue, tabId) {

    try {

      if (filterValue === 'ALL') {

        snap = await getDocs(query(collection(db, 'claims'), where('status', '==', 'submitted'), orderBy('createdAt', 'desc')));

      snap.forEach(d => docs.push({ id: d.id, ...d.data() }));

  async function renderReturns(filterValue, tabId, label) {

          </table>
        </div>
      </div>`;
    document.getElementById('open-return-request').addEventListener('click', openReturnModal);
    loadReturns(filterValue, tabId);
  }

  async function loadReturns(filterValue, tabId) {
    const tbody = document.getElementById('returns-tbody');
    try {
      const [returnsSnap, partsSnap] = await Promise.all([
        getDocs(query(collection(db, 'returns'), where('status', '==', filterValue), orderBy('createdAt', 'desc'))),
        getDocs(collection(db, 'spareParts'))
      ]);
      const partMap = {};
      partsSnap.forEach(d => { partMap[d.id] = d.data(); });

      if (returnsSnap.empty) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-row">Nothing here.</td></tr>`;
        return;
      }
      tbody.innerHTML = '';
      returnsSnap.forEach(docSnap => {
        const d = docSnap.data();
        const part = partMap[d.partId];
        const partLabel = part ? `${part.partCode} — ${part.name}` : (d.partId || '—');
        let actionHtml = '—';
        if (d.status === 'received') {
          actionHtml = `<div class="row-actions"><button class="btn-secondary return-defective-btn" data-id="${docSnap.id}">Mark Defective</button><button class="btn-secondary return-restock-btn" data-id="${docSnap.id}" data-partid="${d.partId}" data-qty="${d.quantity}">Return to Stock</button></div>`;
        } else if (d.status === 'defective') {
          actionHtml = `<div class="row-actions"><button class="btn-secondary return-supplier-btn" data-id="${docSnap.id}">Send to Supplier</button><button class="btn-danger return-dispose-btn" data-id="${docSnap.id}">Dispose</button></div>`;
        }
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-size:12px;color:var(--stone);">${d.returnId || docSnap.id}</td>
          <td>${partLabel}</td>
          <td>${d.quantity ?? '—'}</td>
          <td>${d.source || '—'}</td>
          <td>${d.reason || '—'}</td>
          <td><span class="status-pill ${RETURN_STATUS_PILL_CLASS[d.status] || ''}">${RETURN_STATUS_LABELS[d.status] || d.status}</span></td>
          <td>${actionHtml}</td>`;
        tbody.appendChild(tr);
      });
      tbody.querySelectorAll('.return-defective-btn').forEach(btn => btn.addEventListener('click', () => advanceReturn(btn.dataset.id, 'defective', tabId)));
      tbody.querySelectorAll('.return-supplier-btn').forEach(btn => btn.addEventListener('click', () => advanceReturn(btn.dataset.id, 'supplier_return', tabId)));
      tbody.querySelectorAll('.return-dispose-btn').forEach(btn => btn.addEventListener('click', () => advanceReturn(btn.dataset.id, 'disposed', tabId)));
      tbody.querySelectorAll('.return-restock-btn').forEach(btn => {
        btn.addEventListener('click', () => restockReturn(btn.dataset.id, btn.dataset.partid, Number(btn.dataset.qty), tabId));
      });
    } catch (err) {
      console.error('Load returns failed:', err);
      tbody.innerHTML = `<tr><td colspan="7" class="empty-row" style="color:var(--err);">Couldn't load returns. Check console for details.</td></tr>`;
    }
  }

  async function advanceReturn(id, nextStatus, tabId) {
    try {
      await updateDoc(doc(db, 'returns', id), { status: nextStatus, updatedAt: serverTimestamp() });
      loadReturns(RETURNS_TABS[tabId], tabId);
    } catch (err) {
      console.error('Update return failed:', err);
      alert('Could not update this return. Check the console for details.');
    }
  }

  // "Return to Stock" both closes out the return AND adds the
  // quantity back into Head Office inventory — same atomic pattern
  // as Inventory's Adjust Stock, plus a stockMovements log entry.
  async function restockReturn(returnDocId, partId, qty, tabId) {
    try {
      const invRef = doc(db, 'inventory', `headoffice_${partId}`);
      await runTransaction(db, async (transaction) => {
        const snap = await transaction.get(invRef);
        const current = snap.exists() ? (snap.data().quantity || 0) : 0;
        transaction.set(invRef, {
          partId, location: 'headoffice', quantity: current + qty, updatedAt: serverTimestamp()
        }, { merge: true });
      });
      await addDoc(collection(db, 'stockMovements'), {
        partId, type: 'receive', location: 'headoffice', quantity: qty,
        reason: 'Returned to stock (inspected, found OK)', createdAt: serverTimestamp()
      });
      await updateDoc(doc(db, 'returns', returnDocId), { status: 'restocked', updatedAt: serverTimestamp() });
      loadReturns(RETURNS_TABS[tabId], tabId);
    } catch (err) {
      console.error('Restock return failed:', err);
      alert('Could not restock this item. Check the console for details.');
    }
  }

  const returnOverlay = document.getElementById('return-overlay');
  const returnForm = document.getElementById('return-form');
  const returnError = document.getElementById('return-error');
  const returnSuccess = document.getElementById('return-success');
  const returnSubmitBtn = document.getElementById('submit-return');
  const returnPartSelect = document.getElementById('return-part-id');

  async function populateReturnPartOptions() {
    if (returnPartSelect.dataset.loaded === 'true') return;
    try {
      const snap = await getDocs(collection(db, 'spareParts'));
      snap.forEach(docSnap => {
        const d = docSnap.data();
        const opt = document.createElement('option');
        opt.value = docSnap.id;
        opt.textContent = `${d.partCode} — ${d.name}`;
        returnPartSelect.appendChild(opt);
      });
      returnPartSelect.dataset.loaded = 'true';
    } catch (err) {
      console.error('Load parts for return form failed:', err);
    }
  }

  function openReturnModal() {
    returnForm.reset();
    returnError.classList.remove('show');
    returnSuccess.classList.remove('show');
    returnSubmitBtn.disabled = false;
    returnSubmitBtn.textContent = 'Log return';
    populateReturnPartOptions();
    returnOverlay.classList.add('show');
  }
  function closeReturnModal() { returnOverlay.classList.remove('show'); }
  document.getElementById('cancel-return').addEventListener('click', closeReturnModal);
  returnOverlay.addEventListener('click', (e) => { if (e.target === returnOverlay) closeReturnModal(); });

  returnForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    returnError.classList.remove('show');
    returnSuccess.classList.remove('show');
    if (!returnPartSelect.value) {
      returnError.textContent = 'Select a part.';
      returnError.classList.add('show');
      return;
    }
    returnSubmitBtn.disabled = true;
    returnSubmitBtn.textContent = 'Saving…';
    try {
      const returnId = await generateReturnId();
      await addDoc(collection(db, 'returns'), {
        returnId,
        partId: returnPartSelect.value,
        quantity: Number(document.getElementById('return-qty').value) || 1,
        source: document.getElementById('return-source').value.trim(),
        reason: document.getElementById('return-reason').value.trim(),
        notes: document.getElementById('return-notes').value.trim(),
        status: 'received',
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      returnSuccess.textContent = `Logged — ${returnId}`;
      returnSuccess.classList.add('show');
      returnSubmitBtn.textContent = 'Log return';
      returnSubmitBtn.disabled = false;
      const activeItem = document.querySelector('.nav-item.active');
      if (activeItem && RETURNS_TABS[activeItem.dataset.id]) {
        loadReturns(RETURNS_TABS[activeItem.dataset.id], activeItem.dataset.id);
      }
      setTimeout(closeReturnModal, 1000);
    } catch (err) {
      console.error('Log return failed:', err);
      returnError.textContent = 'Could not log this return. Check console for details.';
      returnError.classList.add('show');
      returnSubmitBtn.disabled = false;
      returnSubmitBtn.textContent = 'Log return';
    }
  });

  renderNav();
  setActiveNav('dashboard');
</script>
</body>
</html>
