<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Head Office / Warehouse — Pushpak Enterprises CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#25292E;--paper:#F5EFE0;--paper-deep:#EDE3CC;--stone:#7A7565;--hairline:#E0D6BC;
    --blue:#1C6FBA;--blue-deep:#0F4C88;
    --err:#B3261E;--ok:#1C7A46;--sidebar-w:264px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}

  #gate{
    position:fixed;inset:0;background:var(--paper);z-index:100;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--stone);
  }
  #app{display:none;}

  .layout{display:flex;min-height:100vh;}
  .sidebar{
    width:var(--sidebar-w);flex-shrink:0;background:var(--blue-deep);color:var(--paper);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .sidebar-header{padding:22px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.1);}
  .sidebar-header img{width:30px;height:30px;flex-shrink:0;}
  .sidebar-header .name{font-size:13px;font-weight:700;}
  .sidebar-header .role{font-size:11px;color:#C9D6E4;}
  .nav-group{padding:14px 10px 4px;}
  .nav-group-label{font-size:10.5px;font-weight:700;letter-spacing:0.05em;color:#9FB4C8;padding:6px 12px;text-transform:uppercase;}
  .nav-item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:9px 12px;border-radius:3px;font-size:13px;font-weight:500;color:#E3EAF1;
    cursor:pointer;transition:background .15s;
  }
  .nav-item:hover{background:rgba(255,255,255,0.08);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,0.16);color:#fff;font-weight:600;}
  .nav-badge{font-size:9.5px;background:rgba(255,255,255,0.12);color:#C9D6E4;padding:2px 6px;border-radius:20px;}
  .sidebar-footer{margin-top:auto;padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);}
  .sidebar-footer .email{font-size:11.5px;color:#C9D6E4;margin-bottom:10px;word-break:break-all;}
  .logout-btn{
    width:100%;background:transparent;border:1px solid rgba(255,255,255,0.25);color:#E3EAF1;
    padding:9px;border-radius:3px;font-size:12.5px;font-weight:600;
  }
  .logout-btn:hover{background:rgba(255,255,255,0.1);}

  .main{flex:1;min-width:0;}
  .topbar{
    padding:18px 32px;border-bottom:1px solid var(--hairline);
    display:flex;align-items:center;justify-content:space-between;
  }
  .topbar h1{font-size:20px;font-weight:800;letter-spacing:-0.01em;}
  .topbar .sub{font-size:13px;color:var(--stone);margin-top:2px;}
  .content{padding:32px;}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hairline);border:1px solid var(--hairline);margin-bottom:32px;}
  .stat-card{background:var(--paper);padding:22px 20px;}
  .stat-card .label{font-size:12px;color:var(--stone);font-weight:600;margin-bottom:8px;}
  .stat-card .value{font-size:28px;font-weight:800;letter-spacing:-0.01em;}
  .stat-card .hint{font-size:11.5px;color:var(--stone);margin-top:4px;}
  @media (max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}

  .panel{border:1px solid var(--hairline);border-radius:2px;}
  .panel-header{padding:18px 22px;border-bottom:1px solid var(--hairline);display:flex;justify-content:space-between;align-items:center;}
  .panel-header h2{font-size:15px;font-weight:700;}
  .panel-body{padding:22px;}

  .coming-soon{
    border:1px dashed var(--hairline);border-radius:2px;padding:60px 30px;text-align:center;color:var(--stone);
  }
  .coming-soon .big{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px;}
  .coming-soon .small{font-size:13px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11.5px;font-weight:700;color:var(--stone);text-transform:uppercase;letter-spacing:0.03em;padding:10px 14px;border-bottom:1px solid var(--hairline);}
  td{padding:12px 14px;border-bottom:1px solid var(--hairline);vertical-align:top;}
  tr:last-child td{border-bottom:none;}

  .btn-primary{background:var(--blue);color:#fff;font-weight:600;font-size:13.5px;padding:10px 18px;border:none;border-radius:2px;}
  .btn-primary:disabled{opacity:0.6;cursor:default;}
  .btn-secondary{background:transparent;border:1px solid var(--hairline);font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:2px;}
  .btn-danger{background:transparent;border:1px solid var(--err);color:var(--err);font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:2px;}

  .status-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .status-pill.new{background:#DCEAF6;color:var(--blue-deep);}
  .status-pill.approved{background:#DCEAF6;color:var(--blue-deep);}
  .status-pill.picking{background:var(--paper-deep);color:var(--ink);}
  .status-pill.packing{background:var(--paper-deep);color:var(--ink);}
  .status-pill.dispatched{background:#D9EEE0;color:var(--ok);}
  .status-pill.intransit{background:#D9EEE0;color:var(--ok);}
  .status-pill.received{background:#D9EEE0;color:var(--ok);}
  .status-pill.backorder{background:#F6DCDC;color:var(--err);}
  .status-pill.ok{background:#D9EEE0;color:var(--ok);}
  .status-pill.low{background:#FBEAD2;color:#9A6A15;}
  .status-pill.out{background:#F6DCDC;color:var(--err);}

  .priority-tag{font-size:10.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;}
  .priority-tag.urgent{color:var(--err);}
  .priority-tag.normal{color:var(--stone);}

  .row-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,21,26,0.5);display:none;
    align-items:center;justify-content:center;z-index:50;
  }
  .modal-overlay.show{display:flex;}
  .modal{background:var(--paper);width:100%;max-width:440px;border-radius:3px;padding:28px;max-height:88vh;overflow-y:auto;}
  .modal h3{font-size:16px;font-weight:800;margin-bottom:18px;}
  .form-row{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
  .form-row label{font-size:12px;font-weight:600;color:var(--stone);}
  .form-row input,.form-row select,.form-row textarea{border:1px solid var(--hairline);padding:10px 12px;font-size:13.5px;border-radius:2px;font-family:inherit;background:#fff;}
  .form-row textarea{resize:vertical;min-height:70px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
  .modal-error{font-size:12.5px;color:var(--err);margin-top:6px;display:none;}
  .modal-error.show{display:block;}
  .modal-success{font-size:12.5px;color:var(--ok);margin-top:6px;display:none;}
  .modal-success.show{display:block;}
  .empty-row{text-align:center;color:var(--stone);padding:32px;}
</style>
</head>
<body>

<div id="gate">Checking your session…</div>

<div id="app">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../assets/logos/pushpak-enterprises-icon.png" alt="">
        <div>
          <div class="name">Pushpak Enterprises</div>
          <div class="role">Head Office / Warehouse</div>
        </div>
      </div>

      <div id="nav-container"></div>

      <div class="sidebar-footer">
        <div class="email" id="user-email"></div>
        <button class="logout-btn" id="logout-btn">Sign out</button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div>
          <h1 id="page-title">Dashboard</h1>
          <div class="sub" id="page-sub">Welcome back</div>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<!-- New Spare Request modal -->
<div class="modal-overlay" id="new-request-overlay">
  <div class="modal">
    <h3>New spare request</h3>
    <form id="new-request-form">
      <div class="form-row">
        <label>Requesting Service Center</label>
        <input type="text" id="req-center" placeholder="e.g. Hubli Service Center" required>
      </div>
      <div class="form-row">
        <label>Part / item</label>
        <input type="text" id="req-item" placeholder="e.g. Geyser thermostat, 15L" required>
      </div>
      <div class="form-row">
        <label>Quantity</label>
        <input type="number" id="req-qty" min="1" value="1" required>
      </div>
      <div class="form-row">
        <label>Priority</label>
        <select id="req-priority">
          <option value="normal">Normal</option>
          <option value="urgent">Urgent</option>
        </select>
      </div>
      <div class="form-row">
        <label>Notes (optional)</label>
        <textarea id="req-notes" placeholder="Any additional context…"></textarea>
      </div>
      <div class="modal-error" id="new-request-error"></div>
      <div class="modal-success" id="new-request-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-new-request">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-new-request">Create request</button>
      </div>
    </form>
  </div>
</div>

<!-- Add/Edit Spare Part modal -->
<div class="modal-overlay" id="part-overlay">
  <div class="modal">
    <h3 id="part-modal-title">Add spare part</h3>
    <form id="part-form">
      <input type="hidden" id="part-editing-id">
      <div class="form-row">
        <label>Part name</label>
        <input type="text" id="part-name" placeholder="e.g. Geyser thermostat, 15L" required>
      </div>
      <div class="form-row">
        <label>Category</label>
        <input type="text" id="part-category" placeholder="e.g. Thermostat, Heating Element, Valve">
      </div>
      <div class="form-row">
        <label>Brand compatibility</label>
        <select id="part-brand">
          <option value="All">All brands</option>
          <option value="MakWell">MakWell</option>
          <option value="Flyvision">Flyvision</option>
          <option value="Skevia">Skevia</option>
        </select>
      </div>
      <div class="form-row">
        <label>Price (₹)</label>
        <input type="number" id="part-price" min="0" step="0.01">
      </div>
      <div class="form-row">
        <label>Reorder level</label>
        <input type="number" id="part-reorder" min="0" value="5">
      </div>
      <div class="modal-error" id="part-error"></div>
      <div class="modal-success" id="part-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-part">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-part">Save part</button>
      </div>
    </form>
  </div>
</div>

<!-- Adjust Stock modal -->
<div class="modal-overlay" id="adjust-overlay">
  <div class="modal">
    <h3>Adjust Head Office stock</h3>
    <div style="font-size:13px;color:var(--stone);margin-bottom:16px;" id="adjust-part-label"></div>
    <form id="adjust-form">
      <input type="hidden" id="adjust-part-id">
      <div class="form-row">
        <label>Action</label>
        <select id="adjust-type">
          <option value="add">Add stock (received)</option>
          <option value="remove">Remove stock (issued/used)</option>
        </select>
      </div>
      <div class="form-row">
        <label>Quantity</label>
        <input type="number" id="adjust-qty" min="1" value="1" required>
      </div>
      <div class="form-row">
        <label>Reason / notes (optional)</label>
        <input type="text" id="adjust-reason" placeholder="e.g. Purchased from supplier, or issued to SC-Hubli">
      </div>
      <div class="modal-error" id="adjust-error"></div>
      <div class="modal-success" id="adjust-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-adjust">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-adjust">Save</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, collection, getDocs, query, where, orderBy, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCRqUdrKe2U2wF_4LI-6Yl7zdgmE5YhvQY",
    authDomain: "makwell-websiteandcrm.firebaseapp.com",
    projectId: "makwell-websiteandcrm",
    storageBucket: "makwell-websiteandcrm.firebasestorage.app",
    messagingSenderId: "673518655103",
    appId: "1:673518655103:web:1805d10de3c63eca23914a",
    measurementId: "G-YLM91W3YF1"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const gate = document.getElementById('gate');
  const appEl = document.getElementById('app');
  const userEmailEl = document.getElementById('user-email');

  const ALLOWED_ROLE = 'headoffice';

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }
    try {
      const roleSnap = await getDoc(doc(db, 'users', user.uid));
      if (!roleSnap.exists() || roleSnap.data().role !== ALLOWED_ROLE) {
        await signOut(auth);
        window.location.href = 'login.html';
        return;
      }
    } catch (err) {
      console.error('Role check failed:', err);
      window.location.href = 'login.html';
      return;
    }
    userEmailEl.textContent = user.email;
    gate.style.display = 'none';
    appEl.style.display = 'block';
    renderDashboard();
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = 'login.html';
  });

  const NAV = [{"group": "Overview", "items": [{"id": "dashboard", "label": "Dashboard", "built": true}]}, {"group": "Spare Requests", "items": [{"id": "requests-new", "label": "New Requests"}, {"id": "requests-approved", "label": "Approved"}, {"id": "requests-picking", "label": "Picking"}, {"id": "requests-packing", "label": "Packing"}, {"id": "requests-dispatch", "label": "Dispatch"}, {"id": "requests-transit", "label": "In Transit"}, {"id": "requests-backorder", "label": "Back Order"}]}, {"group": "Inventory", "items": [{"id": "inv-headoffice", "label": "Head Office Stock"}, {"id": "inv-servicecenter", "label": "Service Center Stock"}, {"id": "inv-technician", "label": "Technician Stock"}, {"id": "inv-summary", "label": "Stock Summary"}, {"id": "inv-lowstock", "label": "Low / Out of Stock"}, {"id": "inv-damaged", "label": "Damaged / Returned"}]}, {"group": "Stock Movement", "items": [{"id": "move-receive", "label": "Receive"}, {"id": "move-issue", "label": "Issue"}, {"id": "move-transfer", "label": "Transfer"}, {"id": "move-adjust", "label": "Adjustment"}, {"id": "move-history", "label": "Movement History"}]}, {"group": "Parts & Purchase", "items": [{"id": "spareparts", "label": "Spare Parts"}, {"id": "localpurchase", "label": "Local Purchase"}, {"id": "claims", "label": "Claims"}, {"id": "returns", "label": "Returns & Defects"}]}, {"group": "Operations", "items": [{"id": "servicevis", "label": "Service Visibility"}, {"id": "masterdata", "label": "Master Data"}, {"id": "reports", "label": "Reports"}, {"id": "auditlogs", "label": "Audit Logs"}, {"id": "profile", "label": "Profile"}]}];

  const navContainer = document.getElementById('nav-container');
  const pageTitle = document.getElementById('page-title');
  const pageSub = document.getElementById('page-sub');
  const contentEl = document.getElementById('content');

  function renderNav() {
    navContainer.innerHTML = '';
    NAV.forEach(group => {
      const groupEl = document.createElement('div');
      groupEl.className = 'nav-group';
      const label = document.createElement('div');
      label.className = 'nav-group-label';
      label.textContent = group.group;
      groupEl.appendChild(label);
      group.items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'nav-item';
        el.dataset.id = item.id;
        el.innerHTML = `<span>${item.label}</span>` + (!item.built ? '<span class="nav-badge">soon</span>' : '');
        el.addEventListener('click', () => selectSection(item.id, item.label));
        groupEl.appendChild(el);
      });
      navContainer.appendChild(groupEl);
    });
  }

  function setActiveNav(id) {
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.id === id);
    });
  }

  const SPARE_REQUEST_TABS = {
    'requests-new': 'new',
    'requests-approved': 'approved',
    'requests-picking': 'picking',
    'requests-packing': 'packing',
    'requests-dispatch': 'dispatched',
    'requests-transit': 'intransit',
    'requests-backorder': 'backorder',
  };

  function selectSection(id, label) {
    setActiveNav(id);
    pageTitle.textContent = label;
    if (id === 'dashboard') {
      pageSub.textContent = 'Welcome back';
      renderDashboard();
    } else if (SPARE_REQUEST_TABS[id]) {
      pageSub.textContent = 'Spare Requests & Dispatch';
      renderSpareRequests(SPARE_REQUEST_TABS[id], label);
    } else if (id === 'spareparts') {
      pageSub.textContent = 'Part master list';
      renderSpareParts();
    } else if (id === 'inv-headoffice') {
      pageSub.textContent = 'Current stock at Head Office';
      renderInventory('headoffice');
    } else if (id === 'inv-summary') {
      pageSub.textContent = 'Stock across all parts';
      renderInventory('summary');
    } else if (id === 'inv-lowstock') {
      pageSub.textContent = 'Parts at or below reorder level';
      renderInventory('low');
    } else if (id === 'inv-servicecenter' || id === 'inv-technician') {
      pageSub.textContent = 'Not populated yet';
      renderNoLocationData(label, id === 'inv-servicecenter' ? 'Service Center' : 'Technician');
    } else {
      pageSub.textContent = 'Not built yet';
      renderComingSoon(label);
    }
  }

  function renderNoLocationData(label, portalName) {
    contentEl.innerHTML = `
      <div class="coming-soon">
        <div class="big">No ${label.toLowerCase()} data yet</div>
        <div class="small">This will populate automatically once the ${portalName} portal is built and starts tracking its own stock.</div>
      </div>`;
  }

  function renderComingSoon(label) {
    contentEl.innerHTML = `
      <div class="coming-soon">
        <div class="big">${label} isn't built yet</div>
        <div class="small">This module is on the roadmap — it'll be built out next, module by module.</div>
      </div>`;
  }

  async function renderDashboard() {
    contentEl.innerHTML = `
      <div class="stat-grid">
        <div class="stat-card">
          <div class="label">New Requests</div>
          <div class="value" id="stat-new">…</div>
          <div class="hint">Awaiting approval</div>
        </div>
        <div class="stat-card">
          <div class="label">Back Order</div>
          <div class="value" id="stat-backorder">…</div>
          <div class="hint">Stuck, needs attention</div>
        </div>
        <div class="stat-card">
          <div class="label">In Transit</div>
          <div class="value" id="stat-transit">…</div>
          <div class="hint">Currently dispatched</div>
        </div>
        <div class="stat-card">
          <div class="label">Alerts</div>
          <div class="value">—</div>
          <div class="hint">Module not built yet</div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header"><h2>Getting started</h2></div>
        <div class="panel-body" style="font-size:13.5px;color:var(--stone);line-height:1.7;">
          <b style="color:var(--blue)">Spare Requests & Dispatch</b> is fully working — use the sidebar tabs to move requests
          through New → Approved → Picking → Packing → Dispatch → In Transit, or mark them Back Order.
          Other sections in the sidebar will fill in module by module.
        </div>
      </div>`;
    try {
      const [newSnap, backorderSnap, transitSnap] = await Promise.all([
        getDocs(query(collection(db, 'spareRequests'), where('status', '==', 'new'))),
        getDocs(query(collection(db, 'spareRequests'), where('status', '==', 'backorder'))),
        getDocs(query(collection(db, 'spareRequests'), where('status', '==', 'intransit'))),
      ]);
      document.getElementById('stat-new').textContent = newSnap.size;
      document.getElementById('stat-backorder').textContent = backorderSnap.size;
      document.getElementById('stat-transit').textContent = transitSnap.size;
    } catch (err) {
      console.error('Dashboard stats failed:', err);
    }
  }

  // ---------------------------------------------------------------
  // Spare Requests & Dispatch
  // ---------------------------------------------------------------

  const STATUS_LABELS = {
    new: 'New', approved: 'Approved', picking: 'Picking', packing: 'Packing',
    dispatched: 'Dispatched', intransit: 'In Transit', received: 'Received', backorder: 'Back Order'
  };

  // Each status's forward action(s) and, where relevant, a side action
  // (e.g. flagging Back Order from New/Approved, or retrying from Back Order).
  const STATUS_ACTIONS = {
    new:        [{ label: 'Approve', next: 'approved' }, { label: 'Back Order', next: 'backorder', variant: 'danger' }],
    approved:   [{ label: 'Start Picking', next: 'picking' }, { label: 'Back Order', next: 'backorder', variant: 'danger' }],
    picking:    [{ label: 'Mark Packed', next: 'packing' }],
    packing:    [{ label: 'Dispatch', next: 'dispatched' }],
    dispatched: [{ label: 'Mark In Transit', next: 'intransit' }],
    intransit:  [{ label: 'Mark Received', next: 'received' }],
    backorder:  [{ label: 'Retry (back to New)', next: 'new' }],
  };

  async function renderSpareRequests(status, label) {
    contentEl.innerHTML = `
      <div class="panel">
        <div class="panel-header">
          <h2>${label}</h2>
          <button class="btn-primary" id="open-new-request">+ New Request</button>
        </div>
        <div class="panel-body" style="padding:0;">
          <table>
            <thead>
              <tr><th>Request ID</th><th>Service Center</th><th>Item</th><th>Qty</th><th>Priority</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="requests-tbody">
              <tr><td colspan="7" class="empty-row">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>`;
    document.getElementById('open-new-request').addEventListener('click', openNewRequestModal);
    loadSpareRequests(status);
  }

  async function loadSpareRequests(status) {
    const tbody = document.getElementById('requests-tbody');
    try {
      const snap = await getDocs(query(
        collection(db, 'spareRequests'),
        where('status', '==', status),
        orderBy('createdAt', 'desc')
      ));
      if (snap.empty) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-row">No requests in this stage.</td></tr>`;
        return;
      }
      tbody.innerHTML = '';
      snap.forEach(docSnap => {
        const d = docSnap.data();
        const tr = document.createElement('tr');
        const actions = (STATUS_ACTIONS[status] || []).map(a =>
          `<button class="${a.variant === 'danger' ? 'btn-danger' : 'btn-secondary'} action-btn" data-uid="${docSnap.id}" data-next="${a.next}">${a.label}</button>`
        ).join('');
        tr.innerHTML = `
          <td style="font-size:12px;color:var(--stone);">${d.requestId || docSnap.id}</td>
          <td>${d.serviceCenter || '—'}</td>
          <td>${d.item || '—'}</td>
          <td>${d.quantity ?? '—'}</td>
          <td><span class="priority-tag ${d.priority || 'normal'}">${(d.priority || 'normal').toUpperCase()}</span></td>
          <td><span class="status-pill ${d.status}">${STATUS_LABELS[d.status] || d.status}</span></td>
          <td><div class="row-actions">${actions}</div></td>`;
        tbody.appendChild(tr);
      });
      tbody.querySelectorAll('.action-btn').forEach(btn => {
        btn.addEventListener('click', () => advanceRequest(btn.dataset.uid, btn.dataset.next, status));
      });
    } catch (err) {
      console.error('Load spare requests failed:', err);
      tbody.innerHTML = `<tr><td colspan="7" class="empty-row" style="color:var(--err);">Couldn't load requests. Check console for details.</td></tr>`;
    }
  }

  async function advanceRequest(uid, nextStatus, currentTabStatus) {
    try {
      await updateDoc(doc(db, 'spareRequests', uid), {
        status: nextStatus,
        updatedAt: serverTimestamp()
      });
      loadSpareRequests(currentTabStatus);
    } catch (err) {
      console.error('Update request status failed:', err);
      alert('Could not update this request. Check the console for details.');
    }
  }

  // Request ID format matches the site's ticket convention:
  // PE-SR-{YYYYMMDD}-{Serial}-{Mode}. Serial resets monthly via an
  // atomic Firestore transaction (counters/sparerequest-{YYYYMM}),
  // same collision-safe pattern used for public enquiry tickets.
  function todayYYYYMMDD() {
    const d = new Date();
    return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  }
  function currentYYYYMM() {
    const d = new Date();
    return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}`;
  }
  async function nextMonthlySerial(counterKey) {
    const counterRef = doc(db, 'counters', counterKey);
    return runTransaction(db, async (transaction) => {
      const snap = await transaction.get(counterRef);
      const next = (snap.exists() ? snap.data().value : 0) + 1;
      if (snap.exists()) transaction.update(counterRef, { value: next });
      else transaction.set(counterRef, { value: next });
      return next;
    });
  }
  async function generateRequestId() {
    const serial = await nextMonthlySerial(`sparerequest-${currentYYYYMM()}`);
    return `PE-SR-${todayYYYYMMDD()}-${String(serial).padStart(4, '0')}-Warehouse`;
  }

  const newRequestOverlay = document.getElementById('new-request-overlay');
  const newRequestForm = document.getElementById('new-request-form');
  const newRequestError = document.getElementById('new-request-error');
  const newRequestSuccess = document.getElementById('new-request-success');
  const newRequestSubmitBtn = document.getElementById('submit-new-request');

  function openNewRequestModal() {
    newRequestForm.reset();
    newRequestError.classList.remove('show');
    newRequestSuccess.classList.remove('show');
    newRequestSubmitBtn.disabled = false;
    newRequestSubmitBtn.textContent = 'Create request';
    newRequestOverlay.classList.add('show');
  }
  function closeNewRequestModal() {
    newRequestOverlay.classList.remove('show');
  }
  document.getElementById('cancel-new-request').addEventListener('click', closeNewRequestModal);
  newRequestOverlay.addEventListener('click', (e) => { if (e.target === newRequestOverlay) closeNewRequestModal(); });

  newRequestForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    newRequestError.classList.remove('show');
    newRequestSuccess.classList.remove('show');
    newRequestSubmitBtn.disabled = true;
    newRequestSubmitBtn.textContent = 'Creating…';
    try {
      const requestId = await generateRequestId();
      await addDoc(collection(db, 'spareRequests'), {
        requestId,
        serviceCenter: document.getElementById('req-center').value.trim(),
        item: document.getElementById('req-item').value.trim(),
        quantity: Number(document.getElementById('req-qty').value) || 1,
        priority: document.getElementById('req-priority').value,
        notes: document.getElementById('req-notes').value.trim(),
        status: 'new',
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      newRequestSuccess.textContent = `Created — ${requestId}`;
      newRequestSuccess.classList.add('show');
      newRequestSubmitBtn.textContent = 'Create request';
      newRequestSubmitBtn.disabled = false;
      // Refresh the currently open tab if it's the "New" tab
      const activeItem = document.querySelector('.nav-item.active');
      if (activeItem && activeItem.dataset.id === 'requests-new') loadSpareRequests('new');
      setTimeout(closeNewRequestModal, 1000);
    } catch (err) {
      console.error('Create request failed:', err);
      newRequestError.textContent = 'Could not create request. Check console for details.';
      newRequestError.classList.add('show');
      newRequestSubmitBtn.disabled = false;
      newRequestSubmitBtn.textContent = 'Create request';
    }
  });

  // ---------------------------------------------------------------
  // Spare Parts (master list)
  // ---------------------------------------------------------------

  async function generatePartCode() {
    const counterRef = doc(db, 'counters', 'sparepart-master');
    const next = await runTransaction(db, async (transaction) => {
      const snap = await transaction.get(counterRef);
      const n = (snap.exists() ? snap.data().value : 0) + 1;
      if (snap.exists()) transaction.update(counterRef, { value: n });
      else transaction.set(counterRef, { value: n });
      return n;
    });
    return `SP-${String(next).padStart(4, '0')}`;
  }

  async function renderSpareParts() {
    contentEl.innerHTML = `
      <div class="panel">
        <div class="panel-header">
          <h2>Spare parts master list</h2>
          <button class="btn-primary" id="open-add-part">+ Add part</button>
        </div>
        <div class="panel-body" style="padding:0;">
          <table>
            <thead>
              <tr><th>Code</th><th>Name</th><th>Category</th><th>Brand</th><th>Price</th><th>Reorder Level</th><th>Actions</th></tr>
            </thead>
            <tbody id="parts-tbody"><tr><td colspan="7" class="empty-row">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>`;
    document.getElementById('open-add-part').addEventListener('click', () => openPartModal(null));
    loadSpareParts();
  }

  let sparePartsCache = [];

  async function loadSpareParts() {
    const tbody = document.getElementById('parts-tbody');
    try {
      const snap = await getDocs(query(collection(db, 'spareParts'), orderBy('createdAt', 'desc')));
      sparePartsCache = [];
      if (snap.empty) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-row">No parts yet — add your first one.</td></tr>`;
        return;
      }
      tbody.innerHTML = '';
      snap.forEach(docSnap => {
        const d = { id: docSnap.id, ...docSnap.data() };
        sparePartsCache.push(d);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-size:12px;color:var(--stone);">${d.partCode || d.id}</td>
          <td>${d.name || '—'}</td>
          <td>${d.category || '—'}</td>
          <td>${d.brandCompatibility || 'All'}</td>
          <td>${d.price != null ? '₹' + d.price : '—'}</td>
          <td>${d.reorderLevel ?? '—'}</td>
          <td><button class="btn-secondary edit-part-btn" data-id="${d.id}">Edit</button></td>`;
        tbody.appendChild(tr);
        tr.querySelector('.edit-part-btn').addEventListener('click', () => openPartModal(d));
      });
    } catch (err) {
      console.error('Load spare parts failed:', err);
      tbody.innerHTML = `<tr><td colspan="7" class="empty-row" style="color:var(--err);">Couldn't load parts. Check console for details.</td></tr>`;
    }
  }

  const partOverlay = document.getElementById('part-overlay');
  const partForm = document.getElementById('part-form');
  const partError = document.getElementById('part-error');
  const partSuccess = document.getElementById('part-success');
  const partSubmitBtn = document.getElementById('submit-part');
  const partModalTitle = document.getElementById('part-modal-title');

  function openPartModal(existing) {
    partForm.reset();
    partError.classList.remove('show');
    partSuccess.classList.remove('show');
    partSubmitBtn.disabled = false;
    if (existing) {
      partModalTitle.textContent = `Edit ${existing.partCode || 'part'}`;
      document.getElementById('part-editing-id').value = existing.id;
      document.getElementById('part-name').value = existing.name || '';
      document.getElementById('part-category').value = existing.category || '';
      document.getElementById('part-brand').value = existing.brandCompatibility || 'All';
      document.getElementById('part-price').value = existing.price ?? '';
      document.getElementById('part-reorder').value = existing.reorderLevel ?? 5;
      partSubmitBtn.textContent = 'Save changes';
    } else {
      partModalTitle.textContent = 'Add spare part';
      document.getElementById('part-editing-id').value = '';
      document.getElementById('part-reorder').value = 5;
      partSubmitBtn.textContent = 'Save part';
    }
    partOverlay.classList.add('show');
  }
  function closePartModal() { partOverlay.classList.remove('show'); }
  document.getElementById('cancel-part').addEventListener('click', closePartModal);
  partOverlay.addEventListener('click', (e) => { if (e.target === partOverlay) closePartModal(); });

  partForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    partError.classList.remove('show');
    partSuccess.classList.remove('show');
    partSubmitBtn.disabled = true;
    partSubmitBtn.textContent = 'Saving…';
    const editingId = document.getElementById('part-editing-id').value;
    const payload = {
      name: document.getElementById('part-name').value.trim(),
      category: document.getElementById('part-category').value.trim(),
      brandCompatibility: document.getElementById('part-brand').value,
      price: document.getElementById('part-price').value ? Number(document.getElementById('part-price').value) : null,
      reorderLevel: Number(document.getElementById('part-reorder').value) || 0,
    };
    try {
      if (editingId) {
        await updateDoc(doc(db, 'spareParts', editingId), payload);
      } else {
        const partCode = await generatePartCode();
        await addDoc(collection(db, 'spareParts'), { ...payload, partCode, createdAt: serverTimestamp() });
      }
      partSuccess.textContent = 'Saved.';
      partSuccess.classList.add('show');
      partSubmitBtn.disabled = false;
      partSubmitBtn.textContent = editingId ? 'Save changes' : 'Save part';
      loadSpareParts();
      setTimeout(closePartModal, 800);
    } catch (err) {
      console.error('Save part failed:', err);
      partError.textContent = 'Could not save this part. Check console for details.';
      partError.classList.add('show');
      partSubmitBtn.disabled = false;
      partSubmitBtn.textContent = editingId ? 'Save changes' : 'Save part';
    }
  });

  // ---------------------------------------------------------------
  // Inventory — Head Office stock, Stock Summary, Low/Out of Stock.
  // One inventory doc per part at Head Office, id = `headoffice_{partId}`,
  // so adjustments upsert cleanly. Each adjustment also logs a
  // stockMovements entry — groundwork for the future Stock Movement /
  // Movement History module.
  // ---------------------------------------------------------------

  async function getHeadOfficeInventoryMap() {
    const snap = await getDocs(query(collection(db, 'inventory'), where('location', '==', 'headoffice')));
    const map = {};
    snap.forEach(d => { map[d.data().partId] = { id: d.id, ...d.data() }; });
    return map;
  }

  function stockStatus(qty, reorderLevel) {
    if (qty <= 0) return { cls: 'out', label: 'Out of stock' };
    if (qty <= reorderLevel) return { cls: 'low', label: 'Low' };
    return { cls: 'ok', label: 'OK' };
  }

  async function renderInventory(view) {
    const titles = {
      headoffice: 'Head Office stock',
      summary: 'Stock summary',
      low: 'Low / out of stock'
    };
    contentEl.innerHTML = `
      <div class="panel">
        <div class="panel-header"><h2>${titles[view]}</h2></div>
        <div class="panel-body" style="padding:0;">
          <table>
            <thead>
              <tr><th>Code</th><th>Part</th><th>Category</th><th>Qty (HO)</th><th>Reorder Level</th><th>Status</th>${view === 'headoffice' ? '<th>Actions</th>' : ''}</tr>
            </thead>
            <tbody id="inventory-tbody"><tr><td colspan="7" class="empty-row">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>`;
    loadInventory(view);
  }

  async function loadInventory(view) {
    const tbody = document.getElementById('inventory-tbody');
    try {
      const [partsSnap, invMap] = await Promise.all([
        getDocs(query(collection(db, 'spareParts'), orderBy('createdAt', 'desc'))),
        getHeadOfficeInventoryMap()
      ]);
      let rows = [];
      partsSnap.forEach(docSnap => {
        const part = { id: docSnap.id, ...docSnap.data() };
        const inv = invMap[part.id];
        const qty = inv ? inv.quantity : 0;
        rows.push({ part, qty });
      });
      if (view === 'low') {
        rows = rows.filter(r => r.qty <= (r.part.reorderLevel || 0));
      }
      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-row">${sparePartsCache.length === 0 && rows.length === 0 ? 'No parts in the master list yet — add parts first.' : 'Nothing to show here.'}</td></tr>`;
        return;
      }
      tbody.innerHTML = '';
      rows.forEach(({ part, qty }) => {
        const status = stockStatus(qty, part.reorderLevel || 0);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-size:12px;color:var(--stone);">${part.partCode || part.id}</td>
          <td>${part.name || '—'}</td>
          <td>${part.category || '—'}</td>
          <td><b>${qty}</b></td>
          <td>${part.reorderLevel ?? 0}</td>
          <td><span class="status-pill ${status.cls}">${status.label}</span></td>
          ${view === 'headoffice' ? `<td><button class="btn-secondary adjust-btn" data-id="${part.id}" data-name="${(part.name || '').replace(/"/g, '&quot;')}" data-code="${part.partCode || ''}">Adjust</button></td>` : ''}`;
        tbody.appendChild(tr);
        if (view === 'headoffice') {
          tr.querySelector('.adjust-btn').addEventListener('click', (e) => {
            openAdjustModal(e.target.dataset.id, e.target.dataset.name, e.target.dataset.code);
          });
        }
      });
    } catch (err) {
      console.error('Load inventory failed:', err);
      tbody.innerHTML = `<tr><td colspan="7" class="empty-row" style="color:var(--err);">Couldn't load inventory. Check console for details.</td></tr>`;
    }
  }

  const adjustOverlay = document.getElementById('adjust-overlay');
  const adjustForm = document.getElementById('adjust-form');
  const adjustError = document.getElementById('adjust-error');
  const adjustSuccess = document.getElementById('adjust-success');
  const adjustSubmitBtn = document.getElementById('submit-adjust');
  const adjustPartLabel = document.getElementById('adjust-part-label');

  function openAdjustModal(partId, partName, partCode) {
    adjustForm.reset();
    adjustError.classList.remove('show');
    adjustSuccess.classList.remove('show');
    adjustSubmitBtn.disabled = false;
    adjustSubmitBtn.textContent = 'Save';
    document.getElementById('adjust-part-id').value = partId;
    adjustPartLabel.textContent = `${partCode ? partCode + ' — ' : ''}${partName}`;
    adjustOverlay.classList.add('show');
  }
  function closeAdjustModal() { adjustOverlay.classList.remove('show'); }
  document.getElementById('cancel-adjust').addEventListener('click', closeAdjustModal);
  adjustOverlay.addEventListener('click', (e) => { if (e.target === adjustOverlay) closeAdjustModal(); });

  adjustForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    adjustError.classList.remove('show');
    adjustSuccess.classList.remove('show');
    const partId = document.getElementById('adjust-part-id').value;
    const type = document.getElementById('adjust-type').value;
    const qty = Number(document.getElementById('adjust-qty').value) || 0;
    const reason = document.getElementById('adjust-reason').value.trim();
    if (qty <= 0) {
      adjustError.textContent = 'Enter a quantity greater than 0.';
      adjustError.classList.add('show');
      return;
    }
    adjustSubmitBtn.disabled = true;
    adjustSubmitBtn.textContent = 'Saving…';
    const invRef = doc(db, 'inventory', `headoffice_${partId}`);
    try {
      await runTransaction(db, async (transaction) => {
        const snap = await transaction.get(invRef);
        const current = snap.exists() ? (snap.data().quantity || 0) : 0;
        const delta = type === 'add' ? qty : -qty;
        const next = Math.max(0, current + delta);
        transaction.set(invRef, {
          partId, location: 'headoffice', quantity: next, updatedAt: serverTimestamp()
        }, { merge: true });
      });
      await addDoc(collection(db, 'stockMovements'), {
        partId, type: type === 'add' ? 'receive' : 'issue',
        location: 'headoffice', quantity: qty, reason,
        createdAt: serverTimestamp()
      });
      adjustSuccess.textContent = 'Stock updated.';
      adjustSuccess.classList.add('show');
      adjustSubmitBtn.disabled = false;
      adjustSubmitBtn.textContent = 'Save';
      const activeItem = document.querySelector('.nav-item.active');
      const activeId = activeItem ? activeItem.dataset.id : null;
      const viewMap = { 'inv-headoffice': 'headoffice', 'inv-summary': 'summary', 'inv-lowstock': 'low' };
      if (activeId && viewMap[activeId]) loadInventory(viewMap[activeId]);
      setTimeout(closeAdjustModal, 800);
    } catch (err) {
      console.error('Adjust stock failed:', err);
      adjustError.textContent = 'Could not update stock. Check console for details.';
      adjustError.classList.add('show');
      adjustSubmitBtn.disabled = false;
      adjustSubmitBtn.textContent = 'Save';
    }
  });

  renderNav();
  setActiveNav('dashboard');
</script>
</body>
</html>
