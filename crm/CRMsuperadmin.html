<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Admin — Pushpak Enterprises CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#25292E;--paper:#F5EFE0;--paper-deep:#EDE3CC;--stone:#7A7565;--hairline:#E0D6BC;
    --blue:#1C6FBA;--blue-deep:#0F4C88;
    --err:#B3261E;--ok:#1C7A46;--sidebar-w:264px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  /* ---------- Auth gate ---------- */
  #gate{
    position:fixed;inset:0;background:var(--paper);z-index:100;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--stone);
  }
  #app{display:none;}

  /* ---------- Layout ---------- */
  .layout{display:flex;min-height:100vh;}
  .sidebar{
    width:var(--sidebar-w);flex-shrink:0;background:var(--blue-deep);color:var(--paper);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .sidebar-header{padding:22px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.1);}
  .sidebar-header img{width:30px;height:30px;flex-shrink:0;}
  .sidebar-header .name{font-size:13px;font-weight:700;}
  .sidebar-header .role{font-size:11px;color:#9A9BA3;}
  .nav-group{padding:14px 10px 4px;}
  .nav-group-label{font-size:10.5px;font-weight:700;letter-spacing:0.05em;color:#82838C;padding:6px 12px;text-transform:uppercase;}
  .nav-item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:9px 12px;border-radius:3px;font-size:13px;font-weight:500;color:#D6D7DC;
    cursor:pointer;transition:background .15s;
  }
  .nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,0.12);color:#fff;font-weight:600;}
  .nav-badge{font-size:9.5px;background:rgba(255,255,255,0.1);color:#9A9BA3;padding:2px 6px;border-radius:20px;}
  .sidebar-footer{margin-top:auto;padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);}
  .sidebar-footer .email{font-size:11.5px;color:#9A9BA3;margin-bottom:10px;word-break:break-all;}
  .logout-btn{
    width:100%;background:transparent;border:1px solid rgba(255,255,255,0.2);color:#D6D7DC;
    padding:9px;border-radius:3px;font-size:12.5px;font-weight:600;
  }
  .logout-btn:hover{background:rgba(255,255,255,0.08);}

  .main{flex:1;min-width:0;}
  .topbar{
    padding:18px 32px;border-bottom:1px solid var(--hairline);
    display:flex;align-items:center;justify-content:space-between;
  }
  .topbar h1{font-size:20px;font-weight:800;letter-spacing:-0.01em;}
  .topbar .sub{font-size:13px;color:var(--stone);margin-top:2px;}
  .content{padding:32px;}

  /* ---------- Dashboard stat cards ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hairline);border:1px solid var(--hairline);margin-bottom:32px;}
  .stat-card{background:var(--paper);padding:22px 20px;}
  .stat-card .label{font-size:12px;color:var(--stone);font-weight:600;margin-bottom:8px;}
  .stat-card .value{font-size:28px;font-weight:800;letter-spacing:-0.01em;}
  .stat-card .hint{font-size:11.5px;color:var(--stone);margin-top:4px;}
  @media (max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}

  .panel{border:1px solid var(--hairline);border-radius:2px;}
  .panel-header{padding:18px 22px;border-bottom:1px solid var(--hairline);display:flex;justify-content:space-between;align-items:center;}
  .panel-header h2{font-size:15px;font-weight:700;}
  .panel-body{padding:22px;}

  /* ---------- Coming soon ---------- */
  .coming-soon{
    border:1px dashed var(--hairline);border-radius:2px;padding:60px 30px;text-align:center;color:var(--stone);
  }
  .coming-soon .big{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px;}
  .coming-soon .small{font-size:13px;}

  /* ---------- Users & Access ---------- */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11.5px;font-weight:700;color:var(--stone);text-transform:uppercase;letter-spacing:0.03em;padding:10px 14px;border-bottom:1px solid var(--hairline);}
  td{padding:12px 14px;border-bottom:1px solid var(--hairline);}
  tr:last-child td{border-bottom:none;}
  .role-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--paper-deep);color:var(--ink);}
  .role-pill.superadmin,.role-pill.headoffice{background:var(--blue-deep);color:#F5EFE0;}

  .btn-primary{background:var(--blue);color:#fff;font-weight:600;font-size:13.5px;padding:10px 18px;border:none;border-radius:2px;}
  .btn-primary:disabled{opacity:0.6;cursor:default;}
  .btn-secondary{background:transparent;border:1px solid var(--hairline);font-weight:600;font-size:13px;padding:9px 16px;border-radius:2px;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,21,26,0.5);display:none;
    align-items:center;justify-content:center;z-index:50;
  }
  .modal-overlay.show{display:flex;}
  .modal{background:var(--paper);width:100%;max-width:420px;border-radius:3px;padding:28px;}
  .modal h3{font-size:16px;font-weight:800;margin-bottom:18px;}
  .form-row{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
  .form-row label{font-size:12px;font-weight:600;color:var(--stone);}
  .form-row input,.form-row select{border:1px solid var(--hairline);padding:10px 12px;font-size:13.5px;border-radius:2px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
  .modal-error{font-size:12.5px;color:var(--err);margin-top:6px;display:none;}
  .modal-error.show{display:block;}
  .modal-success{font-size:12.5px;color:var(--ok);margin-top:6px;display:none;}
  .modal-success.show{display:block;}
  .form-row textarea{border:1px solid var(--hairline);padding:10px 12px;font-size:13.5px;border-radius:2px;font-family:inherit;width:100%;resize:vertical;min-height:70px;}
  .btn-danger{background:transparent;border:1px solid var(--err);color:var(--err);font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:2px;}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .empty-row{text-align:center;color:var(--stone);padding:32px;}

  .status-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .status-pill.new,.status-pill.placed,.status-pill.assigned,.status-pill.submitted,.status-pill.requested{background:#DCEAF6;color:var(--blue-deep);}
  .status-pill.in_progress,.status-pill.picking,.status-pill.packing,.status-pill.dispatched,.status-pill.invoice_submitted,.status-pill.confirmed,.status-pill.verified,.status-pill.intransit,.status-pill.defective{background:#FBEAD2;color:#9A6A15;}
  .status-pill.completed,.status-pill.delivered,.status-pill.settled,.status-pill.active,.status-pill.received,.status-pill.restocked,.status-pill.converted,.status-pill.ok{background:#D9EEE0;color:var(--ok);}
  .status-pill.cancelled,.status-pill.rejected,.status-pill.backorder,.status-pill.disposed,.status-pill.closed,.status-pill.out,.status-pill.expired{background:#F6DCDC;color:var(--err);}
  .status-pill.low{background:#FBEAD2;color:#9A6A15;}

  .tab-toggle{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .tab-toggle button{
    background:var(--paper);border:1px solid var(--hairline);font-weight:600;font-size:12.5px;
    padding:8px 16px;border-radius:20px;color:var(--stone);cursor:pointer;font-family:inherit;
  }
  .tab-toggle button.active{background:var(--blue);border-color:var(--blue);color:#fff;}
</style>
</head>
<body>

<div id="gate">Checking your session…</div>

<div id="app">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../assets/logos/pushpak-enterprises-icon.png" alt="">
        <div>
          <div class="name">Pushpak Enterprises</div>
          <div class="role">Super Admin</div>
        </div>
      </div>

      <div id="nav-container"></div>

      <div class="sidebar-footer">
        <div class="email" id="user-email"></div>
        <button class="logout-btn" id="logout-btn">Sign out</button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div>
          <h1 id="page-title">Dashboard</h1>
          <div class="sub" id="page-sub">Overview across brands and services</div>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<!-- Add User modal -->
<div class="modal-overlay" id="add-user-overlay">
  <div class="modal">
    <h3>Create CRM account</h3>
    <form id="add-user-form">
      <div class="form-row">
        <label>Full name</label>
        <input type="text" id="new-user-name" required>
      </div>
      <div class="form-row">
        <label>Email</label>
        <input type="email" id="new-user-email" required>
      </div>
      <div class="form-row">
        <label>Temporary password (min 6 characters)</label>
        <input type="text" id="new-user-password" required minlength="6">
      </div>
      <div class="form-row">
        <label>Role</label>
        <select id="new-user-role" required>
          <option value="">Select a role…</option>
          <option value="superadmin">Super Admin</option>
          <option value="headoffice">Head Office</option>
          <option value="areamanager">Area Manager</option>
          <option value="servicecenter">Service Center</option>
          <option value="technician">Technician</option>
          <option value="dealer">Dealer</option>
        </select>
      </div>
      <div class="modal-error" id="add-user-error"></div>
      <div class="modal-success" id="add-user-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-add-user">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-add-user">Create account</button>
      </div>
    </form>
  </div>
</div>

<!-- Edit User modal -->
<div class="modal-overlay" id="edit-user-overlay">
  <div class="modal">
    <h3>Edit CRM account</h3>
    <form id="edit-user-form">
      <div class="form-row">
        <label>Full name</label>
        <input type="text" id="edit-user-name">
      </div>
      <div class="form-row">
        <label>Email</label>
        <input type="email" id="edit-user-email" disabled style="opacity:0.6;">
        <span style="font-size:11.5px;color:var(--stone);">Email can't be changed here — it's tied to the login account.</span>
      </div>
      <div class="form-row">
        <label>Role</label>
        <select id="edit-user-role" required>
          <option value="superadmin">Super Admin</option>
          <option value="headoffice">Head Office</option>
          <option value="areamanager">Area Manager</option>
          <option value="servicecenter">Service Center</option>
          <option value="technician">Technician</option>
          <option value="dealer">Dealer</option>
        </select>
      </div>
      <div class="modal-error" id="edit-user-error"></div>
      <div class="modal-success" id="edit-user-success"></div>
      <div class="modal-actions" style="justify-content:space-between;">
        <button type="button" class="btn-secondary" id="reset-password-btn">Send password reset</button>
        <div style="display:flex;gap:10px;">
          <button type="button" class="btn-secondary" id="cancel-edit-user">Cancel</button>
          <button type="submit" class="btn-primary" id="submit-edit-user">Save changes</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Edit Site Content modal -->
<div class="modal-overlay" id="sitecontent-overlay">
  <div class="modal" style="max-width:520px;">
    <h3>Edit landing page content</h3>
    <form id="sitecontent-form">
      <div class="form-row"><label>Hero headline</label><input type="text" id="sc-heroHeadline"></div>
      <div class="form-row"><label>Hero subcopy</label><textarea id="sc-heroSubcopy"></textarea></div>
      <div class="form-row"><label>Brands section intro</label><textarea id="sc-brandsIntro"></textarea></div>
      <div class="form-row"><label>About text (paragraph 1)</label><textarea id="sc-aboutText1"></textarea></div>
      <div class="form-row"><label>About text (paragraph 2)</label><textarea id="sc-aboutText2"></textarea></div>
      <div class="form-row"><label>Contact phone</label><input type="text" id="sc-contactPhone"></div>
      <div class="form-row"><label>Contact email</label><input type="text" id="sc-contactEmail"></div>
      <div class="form-row"><label>Contact location</label><input type="text" id="sc-contactLocation"></div>
      <div class="modal-error" id="sitecontent-error"></div>
      <div class="modal-success" id="sitecontent-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-sitecontent">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-sitecontent">Save changes</button>
      </div>
    </form>
  </div>
</div>

<!-- Edit Brand modal -->
<div class="modal-overlay" id="brand-overlay">
  <div class="modal">
    <h3 id="brand-modal-title">Edit brand</h3>
    <form id="brand-form">
      <input type="hidden" id="brand-editing-id">
      <div class="form-row"><label>Tagline</label><input type="text" id="brand-tagline"></div>
      <div class="form-row"><label>Description</label><textarea id="brand-description"></textarea></div>
      <div class="modal-error" id="brand-error"></div>
      <div class="modal-success" id="brand-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-brand">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-brand">Save changes</button>
      </div>
    </form>
  </div>
</div>

<!-- Add/Edit Product modal -->
<div class="modal-overlay" id="product-overlay">
  <div class="modal">
    <h3 id="product-modal-title">Add product</h3>
    <form id="product-form">
      <input type="hidden" id="product-editing-id">
      <div class="form-row"><label>Name</label><input type="text" id="product-name" required></div>
      <div class="form-row"><label>Category</label><input type="text" id="product-category" placeholder="e.g. LED TV, Geyser"></div>
      <div class="form-row"><label>Brand</label>
        <select id="product-brand">
          <option value="MakWell">MakWell</option>
          <option value="Flyvision">Flyvision</option>
          <option value="Skevia">Skevia</option>
        </select>
      </div>
      <div class="form-row"><label>Price (₹)</label><input type="number" id="product-price" min="0" step="0.01"></div>
      <div class="modal-error" id="product-error"></div>
      <div class="modal-success" id="product-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-product">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-product">Save product</button>
      </div>
    </form>
  </div>
</div>

<!-- New RMA modal -->
<div class="modal-overlay" id="rma-overlay">
  <div class="modal">
    <h3>New RMA request</h3>
    <form id="rma-form">
      <div class="form-row"><label>Customer name</label><input type="text" id="rma-customer" required></div>
      <div class="form-row"><label>Customer phone</label><input type="tel" id="rma-phone" required></div>
      <div class="form-row"><label>Product</label><input type="text" id="rma-product" required></div>
      <div class="form-row"><label>Serial number</label><input type="text" id="rma-serial" required></div>
      <div class="form-row"><label>Reason</label><textarea id="rma-reason" required></textarea></div>
      <div class="modal-error" id="rma-error"></div>
      <div class="modal-success" id="rma-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-rma">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-rma">Create RMA</button>
      </div>
    </form>
  </div>
</div>

<!-- Add/Edit Template modal -->
<div class="modal-overlay" id="template-overlay">
  <div class="modal">
    <h3 id="template-modal-title">Add template</h3>
    <form id="template-form">
      <input type="hidden" id="template-editing-id">
      <div class="form-row"><label>Name</label><input type="text" id="template-name" placeholder="e.g. Service reminder" required></div>
      <div class="form-row"><label>Channel</label>
        <select id="template-channel">
          <option value="WhatsApp">WhatsApp</option>
          <option value="SMS">SMS</option>
          <option value="Email">Email</option>
        </select>
      </div>
      <div class="form-row"><label>Message body</label><textarea id="template-body" placeholder="Use {name}, {date}, etc. as placeholders" required></textarea></div>
      <div class="modal-error" id="template-error"></div>
      <div class="modal-success" id="template-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-template">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-template">Save template</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signOut, createUserWithEmailAndPassword, sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, collection, getDocs, query, where, orderBy, serverTimestamp, runTransaction
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCRqUdrKe2U2wF_4LI-6Yl7zdgmE5YhvQY",
    authDomain: "makwell-websiteandcrm.firebaseapp.com",
    projectId: "makwell-websiteandcrm",
    storageBucket: "makwell-websiteandcrm.firebasestorage.app",
    messagingSenderId: "673518655103",
    appId: "1:673518655103:web:1805d10de3c63eca23914a",
    measurementId: "G-YLM91W3YF1"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const gate = document.getElementById('gate');
  const appEl = document.getElementById('app');
  const userEmailEl = document.getElementById('user-email');

  // ---------------------------------------------------------------
  // Auth gate — only a signed-in user with role === 'superadmin'
  // may see this page. Everyone else is bounced back to login.
  // ---------------------------------------------------------------
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }
    try {
      const roleSnap = await getDoc(doc(db, 'users', user.uid));
      if (!roleSnap.exists() || roleSnap.data().role !== 'superadmin') {
        await signOut(auth);
        window.location.href = 'login.html';
        return;
      }
    } catch (err) {
      console.error('Role check failed:', err);
      window.location.href = 'login.html';
      return;
    }
    userEmailEl.textContent = user.email;
    gate.style.display = 'none';
    appEl.style.display = 'block';
    initDashboardStats();
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = 'login.html';
  });

  // ---------------------------------------------------------------
  // Sidebar navigation — full Super Admin sitemap. Only Dashboard
  // and Users & Access are wired up; everything else shows a
  // "not built yet" placeholder until that module is built.
  // ---------------------------------------------------------------
  const NAV = [
    { group: 'Overview', items: [
      { id: 'dashboard', label: 'Dashboard', built: true },
    ]},
    { group: 'Customers & Sales', items: [
      { id: 'customers', label: 'Customers', built: true },
      { id: 'brands', label: 'Brands', built: true },
      { id: 'products', label: 'Product Management', built: true },
      { id: 'serials', label: 'Serial & Registration', built: true },
      { id: 'warranty', label: 'Warranty', built: true },
      { id: 'dealers', label: 'Dealers', built: true },
    ]},
    { group: 'Service Operations', items: [
      { id: 'service', label: 'Service', built: true },
      { id: 'routing', label: 'Service Request Routing', built: true },
      { id: 'centers', label: 'Service Centers', built: true },
      { id: 'technicians', label: 'Technicians', built: true },
      { id: 'sla', label: 'SLA & Escalation', built: true },
    ]},
    { group: 'Inventory & Logistics', items: [
      { id: 'spareparts', label: 'Spare Parts', built: true },
      { id: 'inventory', label: 'Inventory', built: true },
      { id: 'stockmovement', label: 'Stock Movement', built: true },
      { id: 'sparerequest', label: 'Spare Request & Logistics', built: true },
      { id: 'localpurchase', label: 'Local Purchase', built: true },
    ]},
    { group: 'Finance & Claims', items: [
      { id: 'finance', label: 'Finance', built: true },
      { id: 'rma', label: 'RMA & Replacement', built: true },
      { id: 'approvals', label: 'Approvals', built: true },
    ]},
    { group: 'Operations', items: [
      { id: 'communication', label: 'Communication', built: true },
      { id: 'reports', label: 'Reports', built: true },
      { id: 'website', label: 'Website Management', built: true },
      { id: 'masterdata', label: 'Master Data', built: true },
    ]},
    { group: 'System', items: [
      { id: 'users', label: 'Users & Access', built: true },
      { id: 'admin', label: 'Administration', built: true },
    ]},
  ];

  const navContainer = document.getElementById('nav-container');
  const pageTitle = document.getElementById('page-title');
  const pageSub = document.getElementById('page-sub');
  const contentEl = document.getElementById('content');

  function renderNav() {
    navContainer.innerHTML = '';
    NAV.forEach(group => {
      const groupEl = document.createElement('div');
      groupEl.className = 'nav-group';
      const label = document.createElement('div');
      label.className = 'nav-group-label';
      label.textContent = group.group;
      groupEl.appendChild(label);
      group.items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'nav-item';
        el.dataset.id = item.id;
        el.innerHTML = `<span>${item.label}</span>` + (!item.built ? '<span class="nav-badge">soon</span>' : '');
        el.addEventListener('click', () => selectSection(item.id, item.label, !!item.built));

  const addUserForm = document.getElementById('add-user-form');

  const addUserSuccess = document.getElementById('add-user-success');

  function openAddUserModal() {
    addUserForm.reset();
    addUserError.classList.remove('show');
    addUserSuccess.classList.remove('show');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Create account';
    overlay.classList.add('show');
  }
  function closeAddUserModal() {
    overlay.classList.remove('show');
  }
  document.getElementById('cancel-add-user').addEventListener('click', closeAddUserModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeAddUserModal(); });

  addUserForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    addUserError.classList.remove('show');
    addUserSuccess.classList.remove('show');

    const name = document.getElementById('new-user-name').value.trim();
    const email = document.getElementById('new-user-email').value.trim();
    const password = document.getElementById('new-user-password').value;
    const role = document.getElementById('new-user-role').value;

    if (!role) {
      addUserError.textContent = 'Select a role.';
      addUserError.classList.add('show');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating…';

    // Secondary, isolated app instance: creating a user with the
    // client SDK signs in as that new user on whatever app instance
    // did it. Using a throwaway secondary app keeps the admin's own
    // session on the primary `app`/`auth` untouched.
    const secondaryApp = initializeApp(firebaseConfig, `secondary-${Date.now()}`);
    const secondaryAuth = getAuth(secondaryApp);

    try {
      const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
      const newUid = cred.user.uid;

      // Write the role doc using the PRIMARY app's Firestore instance,
      // authenticated as the admin — so it passes the isAdmin() rule.
      await setDoc(doc(db, 'users', newUid), {
        name, email, role, createdAt: new Date().toISOString()
      });

      await signOut(secondaryAuth);
      await deleteApp(secondaryApp);

      addUserSuccess.textContent = `Account created for ${email}.`;
      addUserSuccess.classList.add('show');
      submitBtn.textContent = 'Create account';
      submitBtn.disabled = false;
      loadUsersTable();
      initDashboardStats();
      setTimeout(closeAddUserModal, 1200);
    } catch (err) {
      console.error('Create user failed:', err);
      let msg = 'Something went wrong. Please try again.';
      if (err.code === 'auth/email-already-in-use') msg = 'That email is already registered.';
      else if (err.code === 'auth/invalid-email') msg = 'Enter a valid email address.';
      else if (err.code === 'auth/weak-password') msg = 'Password must be at least 6 characters.';
      addUserError.textContent = msg;
      addUserError.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create account';
      try { await deleteApp(secondaryApp); } catch (_) {}
    }
  });

  const productSubmitBtn = document.getElementById('submit-product');

  function openProductModal(existing) {
    productForm.reset();
    productError.classList.remove('show');
    productSuccess.classList.remove('show');
    productSubmitBtn.disabled = false;
    if (existing) {
      productModalTitle.textContent = 'Edit product';
      document.getElementById('product-editing-id').value = existing.id;
      document.getElementById('product-name').value = existing.name || '';
      document.getElementById('product-category').value = existing.category || '';
      document.getElementById('product-brand').value = existing.brand || 'MakWell';
      document.getElementById('product-price').value = existing.price ?? '';
      productSubmitBtn.textContent = 'Save changes';
    } else {
      productModalTitle.textContent = 'Add product';
      document.getElementById('product-editing-id').value = '';
      productSubmitBtn.textContent = 'Save product';
    }
    productOverlay.classList.add('show');
  }
  function closeProductModal() { productOverlay.classList.remove('show'); }
  document.getElementById('cancel-product').addEventListener('click', closeProductModal);
  productOverlay.addEventListener('click', (e) => { if (e.target === productOverlay) closeProductModal(); });

  productForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    productError.classList.remove('show');
    productSuccess.classList.remove('show');
    productSubmitBtn.disabled = true;
    productSubmitBtn.textContent = 'Saving…';
    const editingId = document.getElementById('product-editing-id').value;
    const payload = {
      name: document.getElementById('product-name').value.trim(),
      category: document.getElementById('product-category').value.trim(),
      brand: document.getElementById('product-brand').value,
      price: document.getElementById('product-price').value ? Number(document.getElementById('product-price').value) : null,
    };
    try {
      if (editingId) {
        await updateDoc(doc(db, 'products', editingId), payload);
      } else {
        await addDoc(collection(db, 'products'), { ...payload, createdAt: serverTimestamp() });
      }
      productSuccess.textContent = 'Saved.';
      productSuccess.classList.add('show');
      productSubmitBtn.disabled = false;
      productSubmitBtn.textContent = editingId ? 'Save changes' : 'Save product';
      if (document.getElementById('products-tbody')) loadProducts();
      setTimeout(closeProductModal, 800);
    } catch (err) {
      console.error('Save product failed:', err);
      productError.textContent = 'Could not save this product. Check console for details.';
      productError.classList.add('show');
      productSubmitBtn.disabled = false;
      productSubmitBtn.textContent = editingId ? 'Save changes' : 'Save product';
    }
  });

  function warrantyStatus(purchaseDate, warrantyMonths) {
    if (!purchaseDate) return { cls: '', label: 'Unknown' };
    const purchase = new Date(purchaseDate);
    const expiry = new Date(purchase);
    expiry.setMonth(expiry.getMonth() + (warrantyMonths || 0));
    const now = new Date();
    const daysLeft = Math.round((expiry - now) / (1000 * 60 * 60 * 24));
    if (daysLeft < 0) return { cls: 'expired', label: 'Expired' };
    if (daysLeft <= 30) return { cls: 'low', label: `Expiring (${daysLeft}d)` };
    return { cls: 'active', label: 'Active' };
  }

  async function loadSlaView(filter) {
    const tbody = document.getElementById('sla-tbody');
    try {
      const [jobsSnap, requestsSnap] = await Promise.all([
        getDocs(query(collection(db, 'serviceJobs'), where('status', 'in', ['assigned', 'in_progress']))),
        getDocs(query(collection(db, 'centerRequests'), where('status', 'in', ['new', 'assigned', 'in_progress']))),
      ]);
      const now = Date.now();
      const rows = [];
      function pushRow(source, id, customer, status, createdAt) {
        const openedMs = createdAt && createdAt.toDate ? createdAt.toDate().getTime() : now;
        const hoursOpen = (now - openedMs) / (1000 * 60 * 60);
        rows.push({ source, id, customer, status, hoursOpen });
      }
      jobsSnap.forEach(d => { const j = d.data(); pushRow('Technician', j.jobId, j.customerName, j.status, j.createdAt); });
      requestsSnap.forEach(d => { const r = d.data(); pushRow('Service Center', r.requestId, r.customerName, r.status, r.createdAt); });

      let filtered = rows;
      if (filter === 'duesoon') filtered = rows.filter(r => r.hoursOpen > 24 && r.hoursOpen <= 48);
      if (filter === 'breached') filtered = rows.filter(r => r.hoursOpen > 48);
      filtered.sort((a, b) => b.hoursOpen - a.hoursOpen);

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty-row">Nothing here.</td></tr>`;
        return;
      }
      tbody.innerHTML = '';
      filtered.forEach(r => {
        const badge = r.hoursOpen > 48 ? 'cancelled' : r.hoursOpen > 24 ? 'low' : 'ok';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.source}</td>
          <td style="font-size:12px;color:var(--stone);">${r.id || '—'}</td>
          <td>${r.customer || '—'}</td>
          <td><span class="status-pill ${badge}">${Math.round(r.hoursOpen)}h</span></td>
          <td>${r.status}</td>`;
        tbody.appendChild(tr);
      });
    } catch (err) {
      console.error('Load SLA view failed:', err);
      tbody.innerHTML = `<tr><td colspan="5" class="empty-row" style="color:var(--err);">Couldn't load this view. Check console for details.</td></tr>`;
    }
  }

  async function generateRmaId() {
    const d = new Date();
    const monthKey = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}`;
    const counterRef = doc(db, 'counters', `rma-${monthKey}`);
    const next = await runTransaction(db, async (transaction) => {
      const snap = await transaction.get(counterRef);
      const n = (snap.exists() ? snap.data().value : 0) + 1;
      if (snap.exists()) transaction.update(counterRef, { value: n });
      else transaction.set(counterRef, { value: n });
      return n;
    });
    const dateStr = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    return `PE-RMA-${dateStr}-${String(next).padStart(4, '0')}-SuperAdmin`;
  }

    try {

      tbody.querySelectorAll('.rma-action-btn').forEach(btn => {

      <div style="margin-top:14px;font-size:12px;color:var(--stone);">
        This manages template text only — actually sending WhatsApp/SMS/Email requires connecting a
        real messaging provider (e.g. WhatsApp Business API, Twilio), which isn't set up yet.
      </div>`;
    document.getElementById('open-template').addEventListener('click', () => openTemplateModal(null));
    loadTemplates();
  }

  async function loadTemplates() {
    const tbody = document.getElementById('template-tbody');
    try {
      const snap = await getDocs(query(collection(db, 'messageTemplates'), orderBy('createdAt', 'desc')));
      if (snap.empty) {
        tbody.innerHTML = `<tr><td colspan="4" class="empty-row">No templates yet.</td></tr>`;
        return;
      }
      tbody.innerHTML = '';
      snap.forEach(docSnap => {
        const d = { id: docSnap.id, ...docSnap.data() };
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${d.name || '—'}</td>
          <td>${d.channel || '—'}</td>
          <td style="max-width:320px;color:var(--stone);">${d.body || '—'}</td>
          <td><button class="btn-secondary template-edit-btn" data-id="${d.id}">Edit</button></td>`;
        tbody.appendChild(tr);
        tr.querySelector('.template-edit-btn').addEventListener('click', () => openTemplateModal(d));
      });
    } catch (err) {
      console.error('Load templates failed:', err);
      tbody.innerHTML = `<tr><td colspan="4" class="empty-row" style="color:var(--err);">Couldn't load templates. Check console for details.</td></tr>`;
    }
  }

  const templateOverlay = document.getElementById('template-overlay');
  const templateForm = document.getElementById('template-form');
  const templateError = document.getElementById('template-error');
  const templateSuccess = document.getElementById('template-success');
  const templateSubmitBtn = document.getElementById('submit-template');
  const templateModalTitle = document.getElementById('template-modal-title');

  function openTemplateModal(existing) {
    templateForm.reset();
    templateError.classList.remove('show');
    templateSuccess.classList.remove('show');
    templateSubmitBtn.disabled = false;
    if (existing) {
      templateModalTitle.textContent = 'Edit template';
      document.getElementById('template-editing-id').value = existing.id;
      document.getElementById('template-name').value = existing.name || '';
      document.getElementById('template-channel').value = existing.channel || 'WhatsApp';
      document.getElementById('template-body').value = existing.body || '';
      templateSubmitBtn.textContent = 'Save changes';
    } else {
      templateModalTitle.textContent = 'Add template';
      document.getElementById('template-editing-id').value = '';
      templateSubmitBtn.textContent = 'Save template';
    }
    templateOverlay.classList.add('show');
  }
  function closeTemplateModal() { templateOverlay.classList.remove('show'); }
  document.getElementById('cancel-template').addEventListener('click', closeTemplateModal);
  templateOverlay.addEventListener('click', (e) => { if (e.target === templateOverlay) closeTemplateModal(); });

  templateForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    templateError.classList.remove('show');
    templateSuccess.classList.remove('show');
    templateSubmitBtn.disabled = true;
    templateSubmitBtn.textContent = 'Saving…';
    const editingId = document.getElementById('template-editing-id').value;
    const payload = {
      name: document.getElementById('template-name').value.trim(),
      channel: document.getElementById('template-channel').value,
      body: document.getElementById('template-body').value.trim(),
    };
    try {
      if (editingId) {
        await updateDoc(doc(db, 'messageTemplates', editingId), payload);
      } else {
        await addDoc(collection(db, 'messageTemplates'), { ...payload, createdAt: serverTimestamp() });
      }
      templateSuccess.textContent = 'Saved.';
      templateSuccess.classList.add('show');
      templateSubmitBtn.disabled = false;
      templateSubmitBtn.textContent = editingId ? 'Save changes' : 'Save template';
      if (document.getElementById('template-tbody')) loadTemplates();
      setTimeout(closeTemplateModal, 800);
    } catch (err) {
      console.error('Save template failed:', err);
      templateError.textContent = 'Could not save this template. Check console for details.';
      templateError.classList.add('show');
      templateSubmitBtn.disabled = false;
      templateSubmitBtn.textContent = editingId ? 'Save changes' : 'Save template';
    }
  });

  // =================================================================
  // MASTER DATA — bulk CSV import for the Product catalog. Runs
  // entirely client-side (no backend needed): parse CSV, validate,
  // batch-write to `products`.
  // =================================================================

  function renderMasterData() {
    contentEl.innerHTML = `
      <div class="panel" style="margin-bottom:24px;">
        <div class="panel-header"><h2>Download sample file</h2></div>
        <div class="panel-body">
          <p style="font-size:13.5px;color:var(--stone);margin-bottom:14px;">
            Download a sample CSV for the product catalog, fill it in, then upload it below.
          </p>
          <button class="btn-secondary" id="download-sample-csv">Download sample CSV</button>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header"><h2>Import products</h2></div>
        <div class="panel-body">
          <input type="file" id="csv-file-input" accept=".csv" style="margin-bottom:14px;">
          <div id="csv-preview" style="font-size:13px;color:var(--stone);margin-bottom:14px;"></div>
          <button class="btn-primary" id="import-csv-btn" disabled>Import</button>
          <div class="modal-error" id="import-error"></div>
          <div class="modal-success" id="import-success"></div>
        </div>
      </div>`;

    document.getElementById('download-sample-csv').addEventListener('click', () => {
      const csv = 'name,category,brand,price\nSample 43 inch LED TV,LED TV,MakWell,18999\n';
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'products-sample.csv';
      a.click();
      URL.revokeObjectURL(url);
    });

    let parsedRows = [];
    const fileInput = document.getElementById('csv-file-input');
    const preview = document.getElementById('csv-preview');
    const importBtn = document.getElementById('import-csv-btn');
    const importError = document.getElementById('import-error');
    const importSuccess = document.getElementById('import-success');

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const lines = reader.result.split('\n').map(l => l.trim()).filter(Boolean);
        const header = lines[0].split(',').map(h => h.trim().toLowerCase());
        parsedRows = lines.slice(1).map(line => {
          const cells = line.split(',');
          const row = {};
          header.forEach((h, i) => { row[h] = (cells[i] || '').trim(); });
          return row;
        }).filter(r => r.name);
        preview.textContent = `${parsedRows.length} product(s) ready to import.`;
        importBtn.disabled = parsedRows.length === 0;
      };
      reader.readAsText(file);
    });

    importBtn.addEventListener('click', async () => {
      importError.classList.remove('show');
      importSuccess.classList.remove('show');
      importBtn.disabled = true;
      importBtn.textContent = 'Importing…';
      try {
        for (const row of parsedRows) {
          await addDoc(collection(db, 'products'), {
            name: row.name,
            category: row.category || '',
            brand: row.brand || 'MakWell',
            price: row.price ? Number(row.price) : null,
            createdAt: serverTimestamp()
          });
        }
        importSuccess.textContent = `Imported ${parsedRows.length} product(s).`;
        importSuccess.classList.add('show');
        importBtn.textContent = 'Import';
        parsedRows = [];
        preview.textContent = '';
        fileInput.value = '';
      } catch (err) {
        console.error('CSV import failed:', err);
        importError.textContent = 'Import failed partway through. Check console for details — some rows may have been added.';
        importError.classList.add('show');
        importBtn.disabled = false;
        importBtn.textContent = 'Import';
      }
    });
  }

  // =================================================================
  // ADMINISTRATION — general company settings only. Audit Logs and
  // State & District master data aren't built: audit logging would
  // need instrumentation added to every write across the whole CRM
  // (a cross-cutting change, not a single module), and State &
  // District master data has no consumer anywhere yet to justify it.
  // =================================================================

  async function renderAdministration() {
    contentEl.innerHTML = `
      <div class="panel">
        <div class="panel-header"><h2>General settings</h2></div>
        <div class="panel-body">
          <div class="form-row"><label>Company name</label><input type="text" id="admin-company-name"></div>
          <div class="form-row"><label>Support email</label><input type="text" id="admin-support-email"></div>
          <div class="form-row"><label>Support phone</label><input type="text" id="admin-support-phone"></div>
          <div class="modal-error" id="admin-error"></div>
          <div class="modal-success" id="admin-success"></div>
          <button class="btn-primary" id="save-admin-settings" style="margin-top:8px;">Save changes</button>
        </div>
      </div>
      <div class="coming-soon" style="margin-top:24px;">
        <div class="big">Audit Logs & State/District Master Data aren't built yet</div>
        <div class="small">Audit logging needs instrumentation added across every write in the CRM, not just this page — a bigger cross-cutting change. State/District data has no consumer yet to justify building it ahead of need.</div>
      </div>`;
    try {
      const snap = await getDoc(doc(db, 'settings', 'general'));
      const d = snap.exists() ? snap.data() : {};
      document.getElementById('admin-company-name').value = d.companyName || 'Pushpak Enterprises';
      document.getElementById('admin-support-email').value = d.supportEmail || '';
      document.getElementById('admin-support-phone').value = d.supportPhone || '';
    } catch (err) {
      console.error('Load settings failed:', err);
    }
    document.getElementById('save-admin-settings').addEventListener('click', async () => {
      const btn = document.getElementById('save-admin-settings');
      const errEl = document.getElementById('admin-error');
      const okEl = document.getElementById('admin-success');
      errEl.classList.remove('show');
      okEl.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Saving…';
      try {
        await setDoc(doc(db, 'settings', 'general'), {
          companyName: document.getElementById('admin-company-name').value.trim(),
          supportEmail: document.getElementById('admin-support-email').value.trim(),
          supportPhone: document.getElementById('admin-support-phone').value.trim(),
        }, { merge: true });
        okEl.textContent = 'Saved.';
        okEl.classList.add('show');
      } catch (err) {
        console.error('Save settings failed:', err);
        errEl.textContent = 'Could not save. Check console for details.';
        errEl.classList.add('show');
      }
      btn.disabled = false;
      btn.textContent = 'Save changes';
    });
  }

  // Default view once authenticated
  setActiveNav('dashboard');
</script>
</body>
</html>
