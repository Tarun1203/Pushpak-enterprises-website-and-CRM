<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pushpak Enterprises CRM — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#25292E;--paper:#F5EFE0;--stone:#7A7565;--hairline:#E0D6BC;--blue:#1C6FBA;--blue-deep:#0F4C88;--err:#B3261E;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--blue-deep);color:var(--paper);
    min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .card{background:var(--paper);color:var(--ink);width:100%;max-width:380px;padding:40px 36px;border-radius:2px;}
  .logo-box{width:44px;margin-bottom:20px;}
  .logo-box img{width:100%;}
  .tag{font-size:12px;font-weight:600;color:var(--stone);letter-spacing:0.02em;margin-bottom:8px;}
  h1{font-size:22px;font-weight:800;margin-bottom:28px;}
  form{display:flex;flex-direction:column;gap:14px;}
  input{border:1px solid var(--hairline);padding:13px 15px;font-family:inherit;font-size:14px;border-radius:2px;width:100%;}
  input:focus{outline:2px solid var(--blue);outline-offset:1px;}
  button{background:var(--blue);color:#fff;font-weight:600;font-size:14px;padding:13px;border:none;border-radius:2px;cursor:pointer;margin-top:6px;}
  button:disabled{opacity:0.6;cursor:default;}
  .error-msg{font-size:13px;color:var(--err);display:none;padding:10px 12px;border:1px solid var(--err);border-radius:2px;}
  .error-msg.show{display:block;}
  .links-row{display:flex;justify-content:flex-end;margin-top:-4px;}
  .links-row a{font-size:12.5px;color:var(--stone);font-weight:600;text-decoration:none;cursor:pointer;}
  .links-row a:hover{color:var(--blue);}
  .status-msg{font-size:12.5px;color:var(--stone);display:none;}
  .status-msg.show{display:block;}
  .back-link{display:block;text-align:center;margin-top:20px;font-size:12.5px;color:var(--stone);text-decoration:none;}
  .back-link:hover{color:var(--blue);}
  /* 16px text in form fields on phones, so iOS does not zoom in on focus */
  @media (max-width:820px){input,select,textarea{font-size:16px !important;}}
</style>
<style>
/* Refreshed look (UI phase 7): same markup, softer tokens, rounded card. */
:root{--ink:#0B1020;--paper:#F3F5FA;--stone:#59627A;--hairline:#D5DBEC;--blue:#2F5BFF;--blue-deep:#0E1330}
body{font-family:'Inter','Manrope',system-ui,sans-serif;background:radial-gradient(120% 90% at 100% 0%,rgba(92,224,255,.28),transparent 55%),linear-gradient(135deg,#0E1330,#1B2C8F);padding:16px;-webkit-font-smoothing:antialiased}
.card{background:#fff;border-radius:24px;padding:40px 36px;box-shadow:0 24px 70px rgba(5,8,25,.45)}
.logo-box{width:48px;background:#fff;border-radius:12px}
h1{font-family:'Manrope','Inter',sans-serif;letter-spacing:-.02em;font-size:26px}
input{border-radius:12px;border-color:#CFD6EA;background:#fff;transition:border-color .15s,box-shadow .15s}
input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,91,255,.3)}
button{border-radius:999px;box-shadow:0 8px 20px rgba(47,91,255,.32);transition:transform .15s,background .15s}
button:hover:not(:disabled){background:#2449D6;transform:translateY(-1px)}
.error-msg{border-radius:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="stylesheet" href="../assets/fit.css">
<script src="release.js"></script>
<script src="resilience.js"></script>
</head>
<body>
  <div class="card">
    <div class="logo-box"><img src="../assets/logos/pushpak-enterprises-icon.png" alt="Pushpak Enterprises"></div>
    <div class="tag">Pushpak Enterprises</div>
    <h1>CRM login</h1>

    <form id="login-form">
      <input type="email" id="email" placeholder="Email" autocomplete="username" required>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
      <div class="links-row"><a id="forgot-link">Forgot password?</a></div>
      <div class="error-msg" id="error-msg"></div>
      <div class="status-msg" id="status-msg"></div>
      <button type="submit" id="login-btn">Sign in</button>
    </form>
    <a href="../index.html" class="back-link">← Back to Pushpak Enterprises</a>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCRqUdrKe2U2wF_4LI-6Yl7zdgmE5YhvQY",
    authDomain: "makwell-websiteandcrm.firebaseapp.com",
    projectId: "makwell-websiteandcrm",
    storageBucket: "makwell-websiteandcrm.firebasestorage.app",
    messagingSenderId: "673518655103",
    appId: "1:673518655103:web:1805d10de3c63eca23914a",
    measurementId: "G-YLM91W3YF1"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Each role's landing dashboard. Update these paths to match the
  // actual CRM page filenames once each dashboard is built — these
  // follow the CRM<Role>.html naming already used elsewhere.
  const ROLE_REDIRECTS = {
    superadmin:   'CRMsuperadmin.html',
    warehouse:   'CRMwarehouse.html',
    servicecenter:'CRMservicecenter.html',
    technician:   'CRMtechnician.html',
    dealer:       'CRMdealer.html',
    distributor:  'CRMdistributor.html',
    customer:     '../portal.html'
  };

  const form = document.getElementById('login-form');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const errorMsg = document.getElementById('error-msg');
  const statusMsg = document.getElementById('status-msg');
  const loginBtn = document.getElementById('login-btn');
  const forgotLink = document.getElementById('forgot-link');

  function showError(text) {
    errorMsg.textContent = text;
    errorMsg.classList.add('show');
    statusMsg.classList.remove('show');
  }
  function clearError() {
    errorMsg.classList.remove('show');
  }
  function showStatus(text) {
    statusMsg.textContent = text;
    statusMsg.classList.add('show');
    errorMsg.classList.remove('show');
  }

  function friendlyAuthError(err) {
    switch (err.code) {
      case 'auth/invalid-email': return 'Enter a valid email address.';
      case 'auth/user-disabled': return 'This account has been disabled. Contact your admin.';
      case 'auth/user-not-found':
      case 'auth/wrong-password':
      case 'auth/invalid-credential':
        return 'Incorrect email or password.';
      case 'auth/too-many-requests':
        return 'Too many attempts. Please wait a few minutes and try again.';
      case 'auth/network-request-failed':
        return 'Network error — check your connection and try again.';
      default:
        return 'Something went wrong. Please try again.';
    }
  }

  // Route a signed-in user to their role's dashboard, or show an
  // error and sign them out if their account isn't fully set up.
  async function routeAfterLogin(user) {
    let roleSnap;
    try {
      roleSnap = await getDoc(doc(db, 'users', user.uid));
    } catch (err) {
      console.error('Role lookup failed:', err);
      showError('Could not verify your account. Contact your admin.');
      await auth.signOut();
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign in';
      return;
    }

    if (!roleSnap.exists() || !roleSnap.data().role) {
      showError('Your account has no role assigned yet. Contact your admin.');
      await auth.signOut();
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign in';
      return;
    }

    if (roleSnap.data().accessDisabled === true) {
      showError('Your account has been deactivated. Contact your admin if you believe this is a mistake.');
      await auth.signOut();
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign in';
      return;
    }

    const role = roleSnap.data().role;
    const destination = ROLE_REDIRECTS[role];
    if (!destination) {
      showError(`Unrecognized role "${role}". Contact your admin.`);
      await auth.signOut();
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign in';
      return;
    }

    showStatus('Signed in — redirecting…');
    window.location.href = destination;
  }

  // If already signed in (e.g. returning to this tab), route straight
  // through instead of asking to log in again.
  onAuthStateChanged(auth, (user) => {
    if (user) routeAfterLogin(user);
  });

  // A dashboard's auth gate redirects here with ?deactivated=1 when
  // the signed-in account's role is still valid but the account
  // itself (service center status, technician employment status)
  // has been deactivated/suspended/terminated by an admin.
  if (new URLSearchParams(window.location.search).get('deactivated') === '1') {
    showError('Your account has been deactivated. Contact your admin if you believe this is a mistake.');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();
    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in…';
    try {
      const cred = await signInWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
      await routeAfterLogin(cred.user);
    } catch (err) {
      console.error('Login failed:', err);
      showError(friendlyAuthError(err));
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign in';
    }
  });

  forgotLink.addEventListener('click', async () => {
    clearError();
    const email = emailInput.value.trim();
    if (!email) {
      showError('Enter your email above first, then click "Forgot password?".');
      return;
    }
    try {
      await sendPasswordResetEmail(auth, email);
      showStatus('Password reset email sent — check your inbox.');
    } catch (err) {
      console.error('Password reset failed:', err);
      showError(friendlyAuthError(err));
    }
  });
</script>
</body>
</html>
