<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dealer — Pushpak Enterprises CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#25292E;--paper:#F5EFE0;--paper-deep:#EDE3CC;--stone:#7A7565;--hairline:#E0D6BC;
    --blue:#1C6FBA;--blue-deep:#0F4C88;
    --err:#B3261E;--ok:#1C7A46;--sidebar-w:264px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}

  #gate{
    position:fixed;inset:0;background:var(--paper);z-index:100;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--stone);
  }
  #app{display:none;}

  .layout{display:flex;min-height:100vh;}
  .sidebar{
    width:var(--sidebar-w);flex-shrink:0;background:var(--blue-deep);color:var(--paper);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .sidebar-header{padding:22px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.1);}
  .sidebar-header img{width:30px;height:30px;flex-shrink:0;}
  .sidebar-header .name{font-size:13px;font-weight:700;}
  .sidebar-header .role{font-size:11px;color:#C9D6E4;}
  .nav-group{padding:14px 10px 4px;}
  .nav-group-label{font-size:10.5px;font-weight:700;letter-spacing:0.05em;color:#9FB4C8;padding:6px 12px;text-transform:uppercase;}
  .nav-item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:9px 12px;border-radius:3px;font-size:13px;font-weight:500;color:#E3EAF1;
    cursor:pointer;transition:background .15s;
  }
  .nav-item:hover{background:rgba(255,255,255,0.08);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,0.16);color:#fff;font-weight:600;}
  .nav-badge{font-size:9.5px;background:rgba(255,255,255,0.12);color:#C9D6E4;padding:2px 6px;border-radius:20px;}
  .sidebar-footer{margin-top:auto;padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);}
  .sidebar-footer .email{font-size:11.5px;color:#C9D6E4;margin-bottom:10px;word-break:break-all;}
  .logout-btn{
    width:100%;background:transparent;border:1px solid rgba(255,255,255,0.25);color:#E3EAF1;
    padding:9px;border-radius:3px;font-size:12.5px;font-weight:600;
  }
  .logout-btn:hover{background:rgba(255,255,255,0.1);}

  .main{flex:1;min-width:0;}
  .topbar{
    padding:18px 32px;border-bottom:1px solid var(--hairline);
    display:flex;align-items:center;justify-content:space-between;
  }
  .topbar h1{font-size:20px;font-weight:800;letter-spacing:-0.01em;}
  .topbar .sub{font-size:13px;color:var(--stone);margin-top:2px;}
  .content{padding:32px;}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hairline);border:1px solid var(--hairline);margin-bottom:32px;}
  .stat-card{background:var(--paper);padding:22px 20px;}
  .stat-card .label{font-size:12px;color:var(--stone);font-weight:600;margin-bottom:8px;}
  .stat-card .value{font-size:28px;font-weight:800;letter-spacing:-0.01em;}
  .stat-card .hint{font-size:11.5px;color:var(--stone);margin-top:4px;}
  @media (max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}

  .panel{border:1px solid var(--hairline);border-radius:2px;}
  .panel-header{padding:18px 22px;border-bottom:1px solid var(--hairline);display:flex;justify-content:space-between;align-items:center;}
  .panel-header h2{font-size:15px;font-weight:700;}
  .panel-body{padding:22px;}

  .coming-soon{
    border:1px dashed var(--hairline);border-radius:2px;padding:60px 30px;text-align:center;color:var(--stone);
  }
  .coming-soon .big{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px;}
  .coming-soon .small{font-size:13px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11.5px;font-weight:700;color:var(--stone);text-transform:uppercase;letter-spacing:0.03em;padding:10px 14px;border-bottom:1px solid var(--hairline);}
  td{padding:12px 14px;border-bottom:1px solid var(--hairline);vertical-align:top;}
  tr:last-child td{border-bottom:none;}

  .btn-primary{background:var(--blue);color:#fff;font-weight:600;font-size:13.5px;padding:10px 18px;border:none;border-radius:2px;}
  .btn-primary:disabled{opacity:0.6;cursor:default;}
  .btn-secondary{background:transparent;border:1px solid var(--hairline);font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:2px;}
  .btn-danger{background:transparent;border:1px solid var(--err);color:var(--err);font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:2px;}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .status-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .status-pill.new{background:#DCEAF6;color:var(--blue-deep);}
  .status-pill.placed{background:#DCEAF6;color:var(--blue-deep);}
  .status-pill.confirmed{background:#FBEAD2;color:#9A6A15;}
  .status-pill.dispatched{background:#FBEAD2;color:#9A6A15;}
  .status-pill.delivered{background:#D9EEE0;color:var(--ok);}
  .status-pill.completed{background:#D9EEE0;color:var(--ok);}
  .status-pill.settled{background:#D9EEE0;color:var(--ok);}
  .status-pill.active{background:#D9EEE0;color:var(--ok);}
  .status-pill.contacted{background:#FBEAD2;color:#9A6A15;}
  .status-pill.converted{background:#D9EEE0;color:var(--ok);}
  .status-pill.cancelled{background:#F6DCDC;color:var(--err);}
  .status-pill.closed{background:#F6DCDC;color:var(--err);}

  .tab-toggle{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .tab-toggle button{
    background:var(--paper);border:1px solid var(--hairline);font-weight:600;font-size:12.5px;
    padding:8px 16px;border-radius:20px;color:var(--stone);
  }
  .tab-toggle button.active{background:var(--blue);border-color:var(--blue);color:#fff;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,21,26,0.5);display:none;
    align-items:center;justify-content:center;z-index:50;
  }
  .modal-overlay.show{display:flex;}
  .modal{background:var(--paper);width:100%;max-width:440px;border-radius:3px;padding:28px;max-height:88vh;overflow-y:auto;}
  .modal h3{font-size:16px;font-weight:800;margin-bottom:18px;}
  .form-row{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
  .form-row label{font-size:12px;font-weight:600;color:var(--stone);}
  .form-row input,.form-row select,.form-row textarea{border:1px solid var(--hairline);padding:10px 12px;font-size:13.5px;border-radius:2px;font-family:inherit;background:#fff;}
  .form-row textarea{resize:vertical;min-height:70px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
  .modal-error{font-size:12.5px;color:var(--err);margin-top:6px;display:none;}
  .modal-error.show{display:block;}
  .modal-success{font-size:12.5px;color:var(--ok);margin-top:6px;display:none;}
  .modal-success.show{display:block;}
  .empty-row{text-align:center;color:var(--stone);padding:32px;}
</style>
</head>
<body>

<div id="gate">Checking your session…</div>

<div id="app">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../assets/logos/pushpak-enterprises-icon.png" alt="">
        <div>
          <div class="name">Pushpak Enterprises</div>
          <div class="role">Dealer</div>
        </div>
      </div>

      <div id="nav-container"></div>

      <div class="sidebar-footer">
        <div class="email" id="user-email"></div>
        <button class="logout-btn" id="logout-btn">Sign out</button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div>
          <h1 id="page-title">Dashboard</h1>
          <div class="sub" id="page-sub">Welcome back</div>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<!-- New Customer modal -->
<div class="modal-overlay" id="cust-overlay">
  <div class="modal">
    <h3>Add customer</h3>
    <form id="cust-form">
      <div class="form-row"><label>Name</label><input type="text" id="cust-name" required></div>
      <div class="form-row"><label>Phone</label><input type="tel" id="cust-phone" required></div>
      <div class="form-row"><label>Address</label><input type="text" id="cust-address"></div>
      <div class="form-row"><label>Notes (optional)</label><textarea id="cust-notes"></textarea></div>
      <div class="modal-error" id="cust-error"></div>
      <div class="modal-success" id="cust-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-cust">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-cust">Save customer</button>
      </div>
    </form>
  </div>
</div>

<!-- New Order modal -->
<div class="modal-overlay" id="order-overlay">
  <div class="modal">
    <h3>Place a new order</h3>
    <form id="order-form">
      <div class="form-row"><label>Product / model</label><input type="text" id="order-product" placeholder="e.g. MakWell 43 inch LED TV" required></div>
      <div class="form-row"><label>Quantity</label><input type="number" id="order-qty" min="1" value="1" required></div>
      <div class="form-row"><label>Notes (optional)</label><textarea id="order-notes" placeholder="Any additional context…"></textarea></div>
      <div class="modal-error" id="order-error"></div>
      <div class="modal-success" id="order-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-order">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-order">Place order</button>
      </div>
    </form>
  </div>
</div>

<!-- New Sale modal -->
<div class="modal-overlay" id="sale-overlay">
  <div class="modal">
    <h3>Log a sale</h3>
    <form id="sale-form">
      <div class="form-row"><label>Customer name</label><input type="text" id="sale-customer" required></div>
      <div class="form-row"><label>Product / model</label><input type="text" id="sale-product" required></div>
      <div class="form-row"><label>Quantity</label><input type="number" id="sale-qty" min="1" value="1" required></div>
      <div class="form-row"><label>Amount (₹)</label><input type="number" id="sale-amount" min="0" step="0.01" required></div>
      <div class="form-row"><label>Sale date</label><input type="date" id="sale-date" required></div>
      <div class="modal-error" id="sale-error"></div>
      <div class="modal-success" id="sale-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-sale">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-sale">Save sale</button>
      </div>
    </form>
  </div>
</div>

<!-- New Product Registration modal -->
<div class="modal-overlay" id="reg-overlay">
  <div class="modal">
    <h3>Register a product</h3>
    <form id="reg-form">
      <div class="form-row"><label>Customer name</label><input type="text" id="reg-customer" required></div>
      <div class="form-row"><label>Customer phone</label><input type="tel" id="reg-phone" required></div>
      <div class="form-row"><label>Product / brand</label><input type="text" id="reg-product" required></div>
      <div class="form-row"><label>Serial number</label><input type="text" id="reg-serial" required></div>
      <div class="form-row"><label>Purchase date</label><input type="date" id="reg-purchase-date" required></div>
      <div class="form-row"><label>Warranty (months)</label><input type="number" id="reg-warranty" min="0" value="12"></div>
      <div class="modal-error" id="reg-error"></div>
      <div class="modal-success" id="reg-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-reg">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-reg">Register</button>
      </div>
    </form>
  </div>
</div>

<!-- New Enquiry modal -->
<div class="modal-overlay" id="denq-overlay">
  <div class="modal">
    <h3>Log an enquiry</h3>
    <form id="denq-form">
      <div class="form-row"><label>Customer name</label><input type="text" id="denq-customer" required></div>
      <div class="form-row"><label>Phone</label><input type="tel" id="denq-phone" required></div>
      <div class="form-row"><label>Subject</label><input type="text" id="denq-subject" placeholder="e.g. Interested in 55&quot; TV" required></div>
      <div class="form-row"><label>Notes (optional)</label><textarea id="denq-notes"></textarea></div>
      <div class="modal-error" id="denq-error"></div>
      <div class="modal-success" id="denq-success"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-denq">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-denq">Save enquiry</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, collection, getDocs, query, where, orderBy, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCRqUdrKe2U2wF_4LI-6Yl7zdgmE5YhvQY",
    authDomain: "makwell-websiteandcrm.firebaseapp.com",
    projectId: "makwell-websiteandcrm",
    storageBucket: "makwell-websiteandcrm.firebasestorage.app",
    messagingSenderId: "673518655103",
    appId: "1:673518655103:web:1805d10de3c63eca23914a",
    measurementId: "G-YLM91W3YF1"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const gate = document.getElementById('gate');
  const appEl = document.getElementById('app');
  const userEmailEl = document.getElementById('user-email');

  const ALLOWED_ROLE = 'dealer';

  let currentUser = null;

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }
    try {
      const roleSnap = await getDoc(doc(db, 'users', user.uid));
      if (!roleSnap.exists() || roleSnap.data().role !== ALLOWED_ROLE) {
        await signOut(auth);
        window.location.href = 'login.html';
        return;
      }
    } catch (err) {
      console.error('Role check failed:', err);
      window.location.href = 'login.html';
      return;
    }
    currentUser = user;
    userEmailEl.textContent = user.email;
    gate.style.display = 'none';
    appEl.style.display = 'block';
    renderDashboard();
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = 'login.html';
  });

  const NAV = [{"group": "Overview", "items": [{"id": "dashboard", "label": "Dashboard", "built": true}]}, {"group": "Business", "items": [{"id": "customers", "label": "My Customers"}, {"id": "orders", "label": "My Orders"}, {"id": "sales", "label": "My Sales"}, {"id": "products", "label": "Products"}]}, {"group": "Support", "items": [{"id": "registration", "label": "Product Registration"}, {"id": "enquiries", "label": "Enquiries"}]}, {"group": "Operations", "items": [{"id": "performance", "label": "Performance"}, {"id": "profile", "label": "Profile"}]}];

  const navContainer = document.getElementById('nav-container');
  const pageTitle = document.getElementById('page-title');
  const pageSub = document.getElementById('page-sub');
  const contentEl = document.getElementById('content');

  function renderNav() {
    navContainer.innerHTML = '';
    NAV.forEach(group => {
      const groupEl = document.createElement('div');
      groupEl.className = 'nav-group';
      const label = document.createElement('div');
      label.className = 'nav-group-label';
      label.textContent = group.group;
      groupEl.appendChild(label);
      group.items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'nav-item';
        el.dataset.id = item.id;
        el.innerHTML = `<span>${item.label}</span>` + (!item.built ? '<span class="nav-badge">soon</span>' : '');
        el.addEventListener('click', () => selectSection(item.id, item.label));
        groupEl.appendChild(el);
      });
      navContainer.appendChild(groupEl);
    });
  }

  function setActiveNav(id) {
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.id === id);
    });
  }

  function selectSection(id, label) {
    setActiveNav(id);
    pageTitle.textContent = label;
    if (id === 'dashboard') {
      pageSub.textContent = 'Welcome back';
      renderDashboard();
    } else if (id === 'customers') {
      pageSub.textContent = 'Your customer directory';
      renderCustomers();
    } else if (id === 'orders') {
      pageSub.textContent = 'Orders placed with Pushpak Enterprises';
      renderOrders();
    } else if (id === 'sales') {
      pageSub.textContent = 'Sales you\'ve logged';
      renderSales();
    } else if (id === 'products') {
      pageSub.textContent = 'Product catalog';
      renderProducts();
    } else if (id === 'registration') {
      pageSub.textContent = 'Register a product for warranty';
      renderRegistrations();
    } else if (id === 'enquiries') {
      pageSub.textContent = 'Your leads and enquiries';
      renderEnquiries();
    } else if (id === 'performance') {
      pageSub.textContent = 'Your sales stats';
      renderPerformance();
    } else if (id === 'profile') {
      pageSub.textContent = 'Your dealer account details';
      renderProfile();
    } else {
      pageSub.textContent = 'Not built yet';
      renderComingSoon(label);
    }
  }

  function renderComingSoon(label) {
    contentEl.innerHTML = `
      <div class="coming-soon">
        <div class="big">${label} isn't built yet</div>
        <div class="small">This module is on the roadmap — it'll be built out next, module by module.</div>
      </div>`;
  }

  async function renderDashboard() {
    contentEl.innerHTML = `
      <div class="stat-grid">
        <div class="stat-card"><div class="label">Customers</div><div class="value" id="stat-customers">…</div><div class="hint">In your directory</div></div>
        <div class="stat-card"><div class="label">Orders Placed</div><div class="value" id="stat-orders">…</div><div class="hint">All time</div></div>
        <div class="stat-card"><div class="label">Sales Logged</div><div class="value" id="stat-sales">…</div><div class="hint">All time</div></div>
        <div class="stat-card"><div class="label">Open Enquiries</div><div class="value" id="stat-enquiries">…</div><div class="hint">Not yet converted</div></div>
      </div>
      <div class="panel">
        <div class="panel-header"><h2>Getting started</h2></div>
        <div class="panel-body" style="font-size:13.5px;color:var(--stone);line-height:1.7;">
          Every section in the sidebar is fully working — manage your customer directory, place orders,
          log sales, register products for warranty, and track enquiries, all from here.
        </div>
      </div>`;
    if (!currentUser) return;
    try {
      const [custSnap, orderSnap, saleSnap, enqSnap] = await Promise.all([
        getDocs(query(collection(db, 'dealerCustomers'), where('dealerUid', '==', currentUser.uid))),
        getDocs(query(collection(db, 'dealerOrders'), where('dealerUid', '==', currentUser.uid))),
        getDocs(query(collection(db, 'dealerSales'), where('dealerUid', '==', currentUser.uid))),
        getDocs(query(collection(db, 'dealerEnquiries'), where('dealerUid', '==', currentUser.uid), where('status', 'in', ['new', 'contacted']))),
      ]);
      document.getElementById('stat-customers').textContent = custSnap.size;
      document.getElementById('stat-orders').textContent = orderSnap.size;
      document.getElementById('stat-sales').textContent = saleSnap.size;
      document.getElementById('stat-enquiries').textContent = enqSnap.size;
    } catch (err) {
      console.error('Dashboard stats failed:', err);
    }
  }

  // ---------------------------------------------------------------
  // Shared helpers
  // ---------------------------------------------------------------

  function todayYYYYMMDD() {
    const d = new Date();
    return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  }
  function currentYYYYMM() {
    const d = new Date();
    return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}`;
  }
  async function nextMonthlySerial(counterKey) {
    const counterRef = doc(db, 'counters', counterKey);
    return runTransaction(db, async (transaction) => {
      const snap = await transaction.get(counterRef);
      const next = (snap.exists() ? snap.data().value : 0) + 1;
      if (snap.exists()) transaction.update(counterRef, { value: next });
      else transaction.set(counterRef, { value: next });
      return next;
    });
  }

  // ---------------------------------------------------------------
  // My Customers — dealer's own customer directory.
  // ---------------------------------------------------------------

  async function renderCustomers() {
    contentEl.innerHTML = `
      <div class="panel">
        <div class="panel-header">
          <h2>My customers</h2>
          <button class="btn-primary" id="open-cust">+ Add Customer</button>
        </div>
        <div class="panel-body" style="padding:0;">
          <table>
            <thead><tr><th>Name</th><th>Phone</th><th>Address</th><th>Notes</th></tr></thead>
            <tbody id="cust-tbody"><tr><td colspan="4" class="empty-row">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>`;
    document.getElementById('open-cust').addEventListener('click', openCustModal);
    loadCustomers();
  }

  async function loadCustomers() {
    const tbody = document.getElementById('cust-tbody');
    if (!currentUser) return;
    try {
      const snap = await getDocs(query(collection(db, 'dealerCustomers'), where('dealerUid', '==', currentUser.uid), orderBy('createdAt', 'desc')));
      if (snap.empty) {
        tbody.innerHTML = `<tr><td colspan="4" class="empty-row">No customers yet — add your first one.</td></tr>`;
        return;
      }
      tbody.innerHTML = '';
      snap.forEach(docSnap => {
        const d = docSnap.data();

    contentEl.innerHTML = `
      <div class="panel">
        <div class="panel-header"><h2>Dealer profile</h2></div>
        <div class="panel-body">
          <div class="form-row"><label>Business name</label><input type="text" id="profile-name"></div>
          <div class="form-row"><label>Email</label><input type="text" id="profile-email" disabled style="opacity:0.6;"></div>
          <div class="form-row"><label>Phone</label><input type="text" id="profile-phone"></div>
          <div class="form-row"><label>Address</label><input type="text" id="profile-address"></div>
          <div class="form-row"><label>GSTIN (optional)</label><input type="text" id="profile-gstin"></div>
          <div class="modal-error" id="profile-error"></div>
          <div class="modal-success" id="profile-success"></div>
          <button class="btn-primary" id="save-profile" style="margin-top:8px;">Save changes</button>
        </div>
      </div>`;
    if (!currentUser) return;
    try {
      const snap = await getDoc(doc(db, 'users', currentUser.uid));
      const d = snap.exists() ? snap.data() : {};
      document.getElementById('profile-name').value = d.name || '';
      document.getElementById('profile-email').value = currentUser.email || '';
      document.getElementById('profile-phone').value = d.phone || '';
      document.getElementById('profile-address').value = d.address || '';
      document.getElementById('profile-gstin').value = d.gstin || '';
    } catch (err) {
      console.error('Load profile failed:', err);
    }
    document.getElementById('save-profile').addEventListener('click', async () => {
      const btn = document.getElementById('save-profile');
      const errEl = document.getElementById('profile-error');
      const okEl = document.getElementById('profile-success');
      errEl.classList.remove('show');
      okEl.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Saving…';
      try {
        await setDoc(doc(db, 'users', currentUser.uid), {
          name: document.getElementById('profile-name').value.trim(),
          phone: document.getElementById('profile-phone').value.trim(),
          address: document.getElementById('profile-address').value.trim(),
          gstin: document.getElementById('profile-gstin').value.trim(),
        }, { merge: true });
        okEl.textContent = 'Saved.';
        okEl.classList.add('show');
      } catch (err) {
        console.error('Save profile failed:', err);
        errEl.textContent = 'Could not save. Check console for details.';
        errEl.classList.add('show');
      }
      btn.disabled = false;
      btn.textContent = 'Save changes';
    });
  }

  renderNav();
  setActiveNav('dashboard');
</script>
</body>
</html>
