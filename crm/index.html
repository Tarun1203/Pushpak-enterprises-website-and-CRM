<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pushpak Enterprises CRM — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#14151A;--paper:#FAFAF8;--stone:#6B6D76;--hairline:#D4D4D0;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--ink);color:var(--paper);
    min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .card{background:var(--paper);color:var(--ink);width:100%;max-width:380px;padding:40px 36px;border-radius:2px;}
  .tag{font-size:12px;font-weight:600;color:var(--stone);letter-spacing:0.02em;margin-bottom:8px;}
  h1{font-size:22px;font-weight:800;margin-bottom:28px;}
  form{display:flex;flex-direction:column;gap:14px;}
  input{border:1px solid var(--hairline);padding:13px 15px;font-family:inherit;font-size:14px;border-radius:2px;}
  input:focus{outline:2px solid var(--ink);outline-offset:1px;}
  button{background:var(--ink);color:var(--paper);font-weight:600;font-size:14px;padding:13px;border:none;border-radius:2px;cursor:pointer;margin-top:6px;}
  .status{margin-top:24px;padding:12px 14px;border:1px solid var(--hairline);font-size:12px;color:var(--stone);}
</style>
</head>
<body>
  <div class="card">
    <div class="tag">Pushpak Enterprises</div>
    <h1>CRM login</h1>
    <form>
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Sign in</button>
    </form>
    <div class="status">Scaffolded 9 Sept 2026 — Firebase Auth not wired here yet; role routing (Super Admin, Head Office, Area Manager, Service Center, Technician, Dealer, Warehouse) to follow the CRM module build-out.</div>
  </div>
</body>
</html>
