<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — Pushpak Enterprises</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/pe.css">
<style>
main.wrap{padding-top:36px;padding-bottom:80px;max-width:1100px}
.state-msg{font-size:15px;color:var(--muted);padding:70px 0;text-align:center}
.crumbs{font-size:13.5px;color:var(--muted);margin-bottom:22px}.crumbs a{font-weight:600;color:var(--ink-2)}.crumbs a:hover{color:var(--accent)}
.product-hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;margin-bottom:56px;align-items:start}
.product-visual{background:radial-gradient(circle at 50% 35%,#fff,#E9ECF6);border:1px solid var(--line);border-radius:var(--r-xl);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:28px;overflow:hidden}
.product-visual #product-hero-img{object-fit:contain!important;padding:8px;transition:transform .5s}
.product-visual:hover #product-hero-img{transform:scale(1.04)}
.product-visual .logo-box{width:50%}.product-visual .logo-box img{width:100%;height:auto;border-radius:14px}
.product-thumb{border-radius:12px!important;width:64px!important;height:64px!important;object-fit:contain!important;background:#fff;border:2px solid var(--line)!important;padding:4px}
.product-info .cat{font-size:12.5px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.14em;margin-bottom:12px}
.product-info h1{font-size:clamp(30px,4vw,48px);margin-bottom:16px}
.product-info .price-range{font-family:var(--font-d);font-size:28px;font-weight:800;margin-bottom:4px}
.product-info .price-range span{font-size:15px;font-weight:600;color:var(--muted)}
.price-note{font-size:13.5px;color:var(--muted);margin-bottom:22px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 26px}
.key-feats{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.key-feats span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:700}
.key-feats small{color:var(--muted);font-weight:600;margin-right:6px}
.perks{display:grid;gap:10px;margin-top:26px}.perks div{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--ink-2)}
.perks svg{width:22px;height:22px;color:var(--accent);flex:none}
h2.sec{font-size:clamp(24px,3vw,34px);margin-bottom:22px}
.models-list{display:grid;gap:16px;margin-bottom:48px}
.model-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:28px}
.model-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.model-card-head .model-number{font-family:var(--font-d);font-size:22px;font-weight:800}
.model-card-head .sku{font-size:12.5px;color:var(--muted);margin-top:3px}
.model-card-head .model-price{font-size:19px;font-weight:800;color:var(--accent-deep);white-space:nowrap}
.spec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0;margin-top:14px;border-top:1px solid var(--line)}
.spec-item{padding:14px 16px 14px 0;border-bottom:1px solid var(--line)}
.spec-item .label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.spec-item .value{font-size:15px;font-weight:700;margin-top:3px}
.warranty-note{margin-top:16px;padding:14px 16px;background:var(--bg);border-radius:var(--r-md);font-size:14px;color:var(--muted)}
.warranty-note b{color:var(--ink)}
.warranty-components{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
.warranty-pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700;color:var(--ink)}
.notes-box{font-size:14px;color:var(--muted);margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
@media (max-width:860px){.product-hero{grid-template-columns:1fr;gap:26px}.model-card{padding:22px 18px}}
</style>
<script src="assets/mobile-nav.js" defer></script>
<script src="assets/pe.js" defer></script>
<link rel="stylesheet" href="assets/fit.css">
</head>
<body class="has-tabbar">
<a class="skip" href="#main">Skip to content</a>
<header>
  <div class="header-inner">
    <a class="brandmark-wrap" href="index.html" aria-label="Pushpak Enterprises home"><img src="assets/logos/pushpak-enterprises-icon.png" alt="" class="brandmark-icon"><div class="brandmark">Pushpak Enterprises <span>Building Brands. Delivering Trust.</span></div></a>
    <nav aria-label="Main"><a href="index.html#products">Products</a><a href="index.html#brands">Brands</a><a href="index.html#help">Support</a><a href="index.html#contact">Contact</a></nav>
    <div class="header-actions"><div class="logo-box" id="brand-logo-box" style="height:30px"></div><a href="index.html#book-service" class="nav-cta">Book a Service</a><a href="portal.html" class="acct" aria-label="My Account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></a></div>
  </div>
</header>

<main class="wrap" id="main">
  <div id="content"><div class="state-msg">Loading product…</div></div>
</main>

<footer>
  <div class="wrap footer-inner">
    <span>© <span id="year"></span> Pushpak Enterprises. All rights reserved.</span>
    <span class="foot-links"><a href="makwell/index.html">MakWell</a><a href="flyvision/index.html">Flyvision</a><a href="skevia/index.html">Skevia</a></span>
  </div>
</footer>
<nav class="tabbar" aria-label="Quick links">
  <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
  <a href="index.html#products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Products</a>
  <a href="index.html#help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>Support</a>
  <a href="portal.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Account</a>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCRqUdrKe2U2wF_4LI-6Yl7zdgmE5YhvQY",
    authDomain: "makwell-websiteandcrm.firebaseapp.com",
    projectId: "makwell-websiteandcrm",
    storageBucket: "makwell-websiteandcrm.firebasestorage.app",
    messagingSenderId: "673518655103",
    appId: "1:673518655103:web:1805d10de3c63eca23914a",
    measurementId: "G-YLM91W3YF1"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  document.getElementById('year').textContent = new Date().getFullYear();

  function escapeHtmlPE(v) { return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  const BRAND_LOGO_FILES = { makwell: 'makwell-logo.jpeg', flyvision: 'flyvision-logo.jpeg', skevia: 'skevia-logo.jpeg' };
  const BRAND_COLORS = {
    makwell: { brand: '#8A3B94', deep: '#5E2568' },
    flyvision: { brand: '#E5262C', deep: '#1B1B3A' },
    skevia: { brand: '#1C7DC0', deep: '#0F4C88' },
  };
  const BRAND_HOME = { makwell: 'makwell/index.html', flyvision: 'flyvision/index.html', skevia: 'skevia/index.html' };

  const params = new URLSearchParams(window.location.search);
  const productId = params.get('id');
  const contentEl = document.getElementById('content');

  function applyBrandTheme(brandId) {
    const colors = BRAND_COLORS[brandId];
    if (colors) {
      document.documentElement.style.setProperty('--brand', colors.brand);
      document.documentElement.style.setProperty('--brand-deep', colors.deep);
      document.documentElement.style.setProperty('--accent', colors.brand);
      document.documentElement.style.setProperty('--accent-deep', colors.deep);
    }
    const logoBox = document.getElementById('brand-logo-box');
    if (BRAND_LOGO_FILES[brandId]) {
      logoBox.innerHTML = `<img src="assets/logos/${BRAND_LOGO_FILES[brandId]}" alt="${brandId}">`;
    }
  }

  async function loadProduct() {
    if (!productId) {
      contentEl.innerHTML = '<div class="state-msg">No product specified.</div>';
      return;
    }
    try {
      const productSnap = await getDoc(doc(db, 'products', productId));
      if (!productSnap.exists()) {
        contentEl.innerHTML = '<div class="state-msg">Product not found — it may have been removed.</div>';
        return;
      }
      const product = productSnap.data();
      applyBrandTheme(product.brandId);
      document.title = `${product.name || 'Product'} — Pushpak Enterprises`;

      // Attribute definitions for this product's category, so model
      // attribute values can be shown with real labels/units instead
      // of raw keys.
      let attrDefs = {};
      if (product.categoryId) {
        try {
          const attrSnap = await getDocs(query(collection(db, 'productAttributes'), where('categoryId', '==', product.categoryId)));
          attrSnap.forEach(d => { attrDefs[d.id] = d.data(); });
          // Also index by attributeKey for lookup convenience
          const byKey = {};
          Object.values(attrDefs).forEach(a => { byKey[a.attributeKey] = a; });
          attrDefs = byKey;
        } catch (err) {
          console.warn('Could not load attribute definitions:', err.message);
        }
      }

      // Models for this product
      let models = [];
      try {
        const modelsSnap = await getDocs(query(collection(db, 'productModels'), where('productId', '==', productId)));
        modelsSnap.forEach(d => { const m = d.data(); if ((m.status || 'active') === 'active') models.push(m); });
        models.sort((a, b) => (a.modelNumber || '').localeCompare(b.modelNumber || ''));
      } catch (err) {
        console.warn('Could not load models:', err.message);
      }

      // Warranty plan details (fetch each unique plan referenced by a model)
      const warrantyPlanCache = {};
      async function getWarrantyPlan(planId) {
        if (!planId) return null;
        if (warrantyPlanCache[planId] !== undefined) return warrantyPlanCache[planId];
        try {
          const snap = await getDoc(doc(db, 'warrantyPlans', planId));
          warrantyPlanCache[planId] = snap.exists() ? snap.data() : null;
        } catch (err) {
          warrantyPlanCache[planId] = null;
        }
        return warrantyPlanCache[planId];
      }

      const prices = models.map(m => m.price).filter(p => p != null);
      const priceRangeHtml = prices.length === 0
        ? 'Price on request'
        : (Math.min(...prices) === Math.max(...prices)
            ? `₹${Math.min(...prices)}`
            : `₹${Math.min(...prices)} <span>– ₹${Math.max(...prices)}</span>`);

      // Key features: the first few specifications of the first model.
      const keyFeatHtml = models.length ? Object.entries(models[0].attributeValues || {}).filter(([, v]) => v !== '' && v !== 'no').slice(0, 6).map(([key, val]) => {
        const def = attrDefs[key]; const unit = def && def.unit ? ' ' + def.unit : '';
        const show = val === 'yes' ? '' : escapeHtmlPE(val) + unit;
        return `<span>${show ? '<small>' + escapeHtmlPE(def ? def.attributeName : key) + '</small>' + show : escapeHtmlPE(def ? def.attributeName : key)}</span>`;
      }).join('') : '';
      const brandHome = BRAND_HOME[product.brandId] || 'index.html';
      const galleryImages = product.imageUrls && product.imageUrls.length ? product.imageUrls : (product.imageUrl ? [product.imageUrl] : []);

      contentEl.innerHTML = `
        <div class="product-hero">
          <div>
            <div class="product-visual" id="product-hero-visual" style="${galleryImages.length ? 'padding:0;' : ''}">
              ${galleryImages.length
                ? `<img src="${galleryImages[0]}" alt="${product.name || ''}" id="product-hero-img" style="width:100%;height:100%;object-fit:cover;">`
                : `<div class="logo-box"><img src="assets/logos/${BRAND_LOGO_FILES[product.brandId] || ''}" alt=""></div>`}
            </div>
            ${galleryImages.length > 1 ? `
              <div id="product-thumb-strip" style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
                ${galleryImages.map((url, i) => `
                  <img src="${url}" data-idx="${i}" class="product-thumb" style="width:56px;height:56px;object-fit:cover;border-radius:2px;cursor:pointer;border:2px solid ${i === 0 ? 'var(--brand)' : 'transparent'};">
                `).join('')}
              </div>` : ''}
          </div>
          <div class="product-info">
            <div class="cat">${product.categoryName || 'Product'}</div>
            <h1>${product.name || 'Unnamed product'}</h1>
            <div class="price-range">${priceRangeHtml}</div>
            <div class="price-note">Dealer pricing available. Final price at your authorized dealer.</div>
            ${keyFeatHtml ? `<div class="key-feats" aria-label="Key features">${keyFeatHtml}</div>` : ''}
            <div class="cta-row">
              <a href="index.html#register-product" class="btn btn-primary">Register this product</a>
              <a href="index.html#book-service" class="btn btn-secondary">Book a service</a>
              <a href="${brandHome}" class="btn btn-secondary">Back to ${product.brand || 'brand'}</a>
            </div>
            <div class="perks">
              <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>Registered warranty, checkable any time</div>
              <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>Service by Pushpak technicians across Karnataka</div>
            </div>
          </div>
        </div>
        <h2 class="sec">Available models${models.length ? ` (${models.length})` : ''}</h2>
        <div class="models-list" id="models-list"></div>
      `;

      if (galleryImages.length > 1) {
        document.querySelectorAll('.product-thumb').forEach(thumb => {
          thumb.addEventListener('click', () => {
            document.getElementById('product-hero-img').src = galleryImages[Number(thumb.dataset.idx)];
            document.querySelectorAll('.product-thumb').forEach(t => t.style.borderColor = 'transparent');
            thumb.style.borderColor = 'var(--brand)';
          });
        });
      }

      const modelsListEl = document.getElementById('models-list');
      if (models.length === 0) {
        modelsListEl.outerHTML = '<div class="state-msg" style="padding:30px 0;">No models listed yet for this product.</div>';
        return;
      }

      for (const m of models) {
        const specEntries = Object.entries(m.attributeValues || {}).map(([key, val]) => {
          const def = attrDefs[key];
          const label = def ? def.attributeName : key;
          const unit = def && def.unit ? ' ' + def.unit : '';
          const displayVal = val === 'yes' ? 'Yes' : val === 'no' ? 'No' : val;
          return `<div class="spec-item"><div class="label">${label}</div><div class="value">${displayVal}${unit}</div></div>`;
        }).join('');

        let warrantyHtml = '';
        if (m.warrantyPlanId) {
          const plan = await getWarrantyPlan(m.warrantyPlanId);
          if (plan) {
            const compPills = (plan.components || []).map(c =>
              `<span class="warranty-pill">${c.componentName}: ${c.durationYears}yr</span>`
            ).join('');
            warrantyHtml = `<div class="warranty-note"><b>Warranty:</b> ${plan.name}<div class="warranty-components">${compPills}</div></div>`;
          } else {
            warrantyHtml = `<div class="warranty-note"><b>Warranty:</b> ${m.warrantyPlanName || 'Plan on file'}</div>`;
          }
        }

        const notesHtml = m.specifications
          ? `<div class="notes-box">${m.specifications}</div>` : '';

        const card = document.createElement('div');
        card.className = 'model-card';
        card.innerHTML = `
          <div class="model-card-head">
            <div>
              <div class="model-number">${m.modelNumber || '—'}</div>
              ${m.sku ? `<div class="sku">SKU: ${m.sku}</div>` : ''}
            </div>
            <div class="model-price">${m.price != null ? '₹' + m.price : 'Price on request'}</div>
          </div>
          ${specEntries ? `<div class="spec-grid">${specEntries}</div>` : ''}
          ${warrantyHtml}
          ${notesHtml}
        `;
        modelsListEl.appendChild(card);
      }
    } catch (err) {
      console.error('Load product failed:', err);
      contentEl.innerHTML = '<div class="state-msg">Could not load this product right now.</div>';
    }
  }

  loadProduct();
</script>
</body>
</html>
