.num{font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(90px,22vw,170px);line-height:.95;letter-spacing:-.05em;background:linear-gradient(135deg,var(--ink),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
h1{font-family:'Manrope',sans-serif;font-size:clamp(24px,4vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:10px 0 14px}
p{color:var(--muted);font-size:16px;margin-bottom:28px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:14px 28px;border-radius:999px;font-weight:700;font-size:15px;border:1.5px solid transparent;transition:.2s}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 8px 22px rgba(47,91,255,.35)}
.btn-primary:hover{background:var(--accent-deep);transform:translateY(-2px)}
.btn-secondary{background:#fff;border-color:var(--line)}.btn-secondary:hover{border-color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
